[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "extractor*", "transformer*"]
exclude = ["tests*", "migrations*", "scripts*"]

[project]
name = "resemblio-api"
version = "0.1.0"
description = "FastAPI backend for authenticated Resemblio extractions"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "stripe>=11.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28",
  "moto>=5.0",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: live tests that call outbound services and Anthropic",
]
