<html lang="en">
<head>

<style>
:root {
  color-scheme: dark;
  --ink: #0B0B0F;
  --ink-2: #14141A;
  --bone: #F5F2EA;
  --sun: #FBE71F;
  --hairline: #3A372E;
  --type-display: "Anton", "Bebas Neue", "Impact", system-ui, sans-serif;
  --type-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
html, body {
  margin: 0;
  background: var(--ink);
  color: var(--bone);
  font-family: var(--type-body);
  font-size: 17px;
  line-height: 1.6;
}
a { color: var(--sun); text-decoration: none; }
h1, h2, h3 { font-family: var(--type-display); letter-spacing: 0.04em; text-transform: uppercase; }
.cta { background: var(--sun); color: var(--ink); padding: 16px 24px; border: 0; }
.hairline { border-top: 1px solid var(--hairline); }
</style>
</head>

  <h1>SUSANN CAMUS</h1>

</header>
<main>
  <section><h2>See Me</h2><p>Body copy in Inter, set on ink, with bone foreground.</p></section>
