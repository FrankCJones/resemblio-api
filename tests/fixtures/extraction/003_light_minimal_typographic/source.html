<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margins — an editorial journal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FAF7F0;
  --ink: #1B1B1B;
  --rule: #C8B89B;
  --highlight: #C2410C;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Inter", -apple-system, sans-serif;
  font-size: 18px;
  line-height: 1.65;
}
h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 700; }
em, .marked { color: var(--highlight); }
hr { border: 0; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<h1>Margins</h1>
<p>An editorial journal, set on paper with ink. <em>Emphasis</em> lives in burnt-orange highlight.</p>
</body>
</html>
