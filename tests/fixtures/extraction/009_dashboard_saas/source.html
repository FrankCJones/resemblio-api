<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helm — your ops dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0E14;
  --panel: #131720;
  --text: #D7DCE5;
  --muted: #7A8290;
  --accent: #6366F1;
  --ok: #22C55E;
  --err: #EF4444;
}
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 14px; }
h1, h2, h3 { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 600; }
.panel { background: var(--panel); padding: 16px; border-radius: 6px; }
.metric { font-family: "JetBrains Mono", monospace; color: var(--accent); }
.ok { color: var(--ok); } .err { color: var(--err); } .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="panel"><span class="muted">Throughput</span><div class="metric">2,418/s</div></div>
<div class="panel"><span class="muted">Error rate</span><div class="metric err">0.42%</div></div>
</body>
</html>
