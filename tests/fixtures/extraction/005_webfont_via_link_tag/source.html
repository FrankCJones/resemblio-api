<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tinta — typography studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts loaded ONLY via this <link> in <head>. Family names appear in
     no inline style; the page CSS uses unquoted bare references. This
     is the exact Hypothesis-3 trap from the Susann finding. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  background: #1A1814;
  color: #EFE9DC;
  font-family: Manrope, system-ui, sans-serif;
  font-size: 17px;
}
h1, h2 { font-family: "Playfair Display", Georgia, serif; }
a { color: #D4AF37; }
</style>
</head>
<body>
<h1>Tinta</h1>
<p>A typography studio. Body in Manrope, display in Playfair Display, gold accent.</p>
</body>
</html>
