# Phase 5 visual-fidelity gate targets.
#
# Plan:   projects/OptSus Team/cto-reviews/2026-06-04-resemblio-library-inspirado-no-copiado-correction-plan.md
# Spec:   visual_fidelity_spec.md (sibling)
# Driver: projects/Resemblio/_scripts/visual_fidelity_gate.py
#
# Schema contract:
#   schema_version: visual_fidelity_targets_v1
#   defaults:        run-wide knobs the orchestrator applies unless a
#                    tuple overrides
#   reference_dir:   where reference captures live on disk; resolved
#                    relative to this file
#   resemblio_base:  base URL for the Resemblio renders (staging or prod)
#   tuples:          list of (brand, category, viewport, ...) jobs
#
# Each tuple becomes one invocation of `visual-fidelity-check`.

schema_version: visual_fidelity_targets_v1

defaults:
  pixel_diff_threshold: 0.30
  per_region_threshold: 0.20
  color_bucket_min_overlap: 3
  output_root: _fidelity_reports/library-inspirado-correction-20260604
  pixel_regions:
    - {name: header,          x: 0, y: 0,    w: full, h: 120}
    - {name: hero,            x: 0, y: 120,  w: full, h: 600}
    - {name: primary_content, x: 0, y: 720,  w: full, h: 1600}

reference_dir: reference_captures
resemblio_base: https://resemblio.com

# Resemblio URL pattern: {resemblio_base}/library/{brand}/{category}/
# Reference capture path: {reference_dir}/{brand}_{category}_{viewport}.png
# Spec path per tuple:    {reference_dir}/specs/{brand}_{category}.json
#
# The spec JSON per (brand, category) is generated by the orchestrator
# from the per-brand registry the first time the tuple runs, then
# committed for reproducibility.

tuples:
