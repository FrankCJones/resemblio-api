# Aggregate exit semantics (mirrored from visual_fidelity_spec.md):
#   all tuples PASS                       -> PASS
#   < 100% but >= 80% tuples PASS         -> PARTIAL (YELLOW for Frank)
#   < 80% tuples PASS                     -> FAIL    (RED for Frank)
aggregate:
  partial_pass_floor: 0.80
