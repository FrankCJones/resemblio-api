# Phase 5.2 visual-fidelity gate tolerance config.
#
# Schema: visual_fidelity_tolerance_v1
#
# Plan: projects/OptSus Team/cto-reviews/2026-06-04-resemblio-library-inspirado-no-copiado-correction-plan.md
#       Phase 5.2 lines 255-263.
#
# Provenance: Jim-locked default per the plan's tolerance ladder. Frank
# ratifies post-first-run per Section H decision 4 of the correction plan;
# if the first gate run shows three brand x one category combinations
# passing under these defaults, the values graduate to project-locked.
# If they over- or under-shoot, Frank ratifies the tightened number and
# this file is updated with the new value plus a one-line audit note in
# Decisions log.
#
# Gate logic (mirrors the test):
#
# D-5.1 (Opus, LOCKED 2026-06-13): structural dims are PRIMARY; SSIM is
# informational only. The inspirado-no-copiado posture makes high SSIM
# against a real brand site a liability, not a goal.
# Comment reconciled to D-5.1 Option A, 2026-06-13; values unchanged.
#
#   For each (brand, category, viewport) reference capture:
#     1. Render the live Resemblio page at the same viewport.
#     2. Compute SSIM between live render and reference capture (after
#        resizing the larger image to the smaller one's dimensions to
#        cancel DPR drift). SSIM is LOGGED only; it does not gate the
#        tuple pass/fail decision.
#     3. Run the structural gate (PRIMARY):
#          - color_bucket_overlap_min       -> count buckets matching
#                                              from the reference's
#                                              dominant-color histogram
#                                              against the live render's.
#          - dominant_font_family_match     -> structural assertion
#                                              already authored under
#                                              reference_captures/specs/
#                                              must report `MATCH` on at
#                                              least one font-family
#                                              assertion (case-insensitive
#                                              substring).
#        If both structural checks pass    -> PASS via structural gate.
#     4. Else                                -> FAIL with the dimension
#                                              that drifted recorded.
#
# Acceptance per plan: 3 brand x 1 category combinations pass. The
# pytest test parametrizes over the full 36-tuple matrix; the aggregate
# acceptance check is "at least 3 distinct (brand, category) pairs have
# all viewports passing."

schema_version: visual_fidelity_tolerance_v1

# Primary gate: structural-similarity index.
# 0.65 is the Jim-locked floor per the plan; 1.0 is pixel-identical.
# Empirically a same-page reload on a stable site lands at ~0.92-0.99;
# a brand-stripped render of the same source typically lands 0.45-0.80
# depending on category. 0.65 is the "structurally faithful, brand-
# stripped" threshold the plan locks in. Below 0.65 we fall through to
# the structural fallback rather than failing outright.
ssim_floor: 0.65

# Structural fallback when SSIM gate fails. Both sub-gates must pass
# for the tuple to pass via fallback.
structural_fallback:
  # How many of the reference's top-N dominant-color buckets must also
  # appear in the live render's top-N. Buckets are quantized into the
  # color cube (4 bits per channel = 4096 buckets). 3 of 5 is a forgiving
  # default; tightens to 4 of 5 once we have first-run data.
  color_bucket_overlap_min: 3
  color_bucket_top_n: 5
  # Quantization bits per RGB channel for the dominant-color histogram.
  # 4 bits = 16 levels per channel = 4096 total buckets. Lower is more
  # forgiving; higher rewards exact-color matches.
  color_quantization_bits: 4
  # Dominant font-family match. Reads the per-(brand,category) spec
  # under reference_captures/specs/{brand}_{category}.json, finds the
  # first structural assertion whose `id` contains "font" or "family",
  # and treats the tuple as font-matching if that assertion would
  # evaluate to MATCH against the live render. Evaluation is
  # case-insensitive substring against computed-style fontFamily.
  dominant_font_family_match: required

# Acceptance per Phase 5.2 spec: 3 brand x 1 category combinations
# pass. A (brand, category) combination is considered passing when all
# its viewports pass. The test reports both per-tuple pass/fail and the
# aggregate brand-x-category pass count.
acceptance:
  brand_x_category_pass_minimum: 3
  # If the gate runs in CI with no live URL reachable (e.g. resemblio.com
  # behind basic auth without the env var set), the test SKIPs rather
  # than fails so the suite stays green during dev. Set this to false
  # to make missing-live-URL a hard failure.
  skip_on_missing_live_url: true

# Live-render capture parameters. Mirrors the reference-capture settings
# in fidelity_targets.yml so the diff stays apples-to-apples.
live_capture:
  # Pattern the test resolves per tuple. {brand} and {category} are
  # substituted from the manifest record.
  url_pattern: "https://resemblio.com/library/{brand}/{category}"
  # Environment variable name that may carry "user:password" Basic Auth
  # for resemblio.com staging or restricted prod. Treated as a secret;
  # never logged. Absent env var -> unauthenticated request.
  basic_auth_env: "LIBRARY_BASIC_AUTH"
  # Per-viewport request timeout in milliseconds.
  timeout_ms: 30000
  # Wait for `networkidle` before screenshotting to give web fonts and
  # any client-side render a chance to settle.
  wait_until: networkidle
