name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

jobs:
  # Stage 3 lint: assert the deploy workflow still carries the
  # silent-partial-deploy gate. Greps deploy.yml for four required strings.
  # If any are missing, this job fails and `build-and-deploy` is skipped
  # (the `needs:` dependency below makes the gate hard).
  #
  # Why a separate job rather than a step inside build-and-deploy:
  # a careless edit that removes the PID-change block would also remove
  # any step lint embedded in the same block. A sibling job that grep's
  # the raw file cannot be self-deleted by editing inside build-and-deploy.
  # The lint is paired with `tests/test_deploy_workflow_logic.py` which
  # asserts the same four markers at pytest time.
  lint-deploy-yml:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assert Stage 3 markers present
        run: bash ci/lint_deploy_yml.sh

  build-and-deploy:
    needs: lint-deploy-yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sanity test (offline tests; production swap happens via SSH)
        run: |
          python -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install -q --upgrade pip
          /tmp/ci-venv/bin/pip install -q -e ".[test]"
          /tmp/ci-venv/bin/pytest -q

      # Security gate: fail the deploy if any installed dependency has a known
      # CVE at high severity or above. Companion to the resemblio web npm-audit
      # gate (`projects/Resemblio/code/web/.github/workflows/deploy.yml`).
      # Closes audit finding M-DEV-1 (`projects/OptSus Team/security-audits/
      # 2026-05-26-initial.md`). pip-audit reads the installed environment, so
      # this step runs AFTER the install above and audits exactly what would
      # ship. `--strict` causes a non-zero exit if pip-audit cannot resolve a
      # dependency, preventing silent passes when the package index is flaky.
      - name: pip-audit (fail on known vulnerabilities)
        run: |
          /tmp/ci-venv/bin/pip install -q pip-audit
          # Drop --strict: pip-audit treats the locally-installed editable
          # `resemblio-api` (pip install -e .) as an audit error under
          # --strict, even with --skip-editable. The default exit-code
          # behavior still fails the build on real CVEs in pinned deps,
          # which is the actual security gate (closes audit finding
          # M-DEV-1). --skip-editable additionally prevents complaints
          # about our own in-tree package not being on PyPI.
          /tmp/ci-venv/bin/pip-audit --skip-editable

      # Entrypoint smoke: every declared CLI module runs `--help` in a clean
      # subprocess. Catches module-load ordering bugs (transitive import
      # side effects that break `python -m app.cli.X`) BEFORE deploy.
      # Per CTO Week 1 Day 4-5 rollout
      # (`projects/OptSus Team/cto-reviews/2026-06-02-workflow-rollout-week1.md`).
      - name: Entrypoint smoke (every CLI module --help cleanly)
        env:
          PYTHON: /tmp/ci-venv/bin/python
        run: bash ci/entrypoints.sh

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Capture the alembic head revision recorded in the repo so we can assert
      # parity against prod's `alembic current` after the deploy. Locked
      # 2026-06-01 after the silent-skip incident: migrations 0009/0010/0011
      # were authored and "deployed" but Postgres was still at 0008. Root
      # cause hypothesis: an alembic upgrade step that errored silently or
      # was absent from a prior workflow revision still let the deploy report
      # green because no parity assertion existed. This step makes the
      # repo-head explicit BEFORE the deploy so we can compare after.
      - name: Capture local alembic head
        id: alembic_local_head
        run: |
          set -euo pipefail
          /tmp/ci-venv/bin/alembic -c alembic.ini heads --resolve-dependencies > /tmp/alembic_heads.txt
          # `alembic heads` prints lines like "<rev> (head)" - extract just the rev id.
          LOCAL_HEAD=$(awk '{print $1}' /tmp/alembic_heads.txt | head -n1)
          if [ -z "$LOCAL_HEAD" ]; then
            echo "FATAL: could not determine local alembic head from alembic.ini" >&2
            cat /tmp/alembic_heads.txt >&2
            exit 1
          fi
          echo "local_head=$LOCAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "Local alembic head (repo): $LOCAL_HEAD"

      - name: Deploy on resemblio-prod-01
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LOCAL_ALEMBIC_HEAD: ${{ steps.alembic_local_head.outputs.local_head }}
          # GITHUB_SHA is the commit SHA that triggered this workflow run. We
          # forward it via SendEnv so the remote heredoc can assert prod git
          # HEAD landed at the SAME commit after `git reset --hard origin/main`.
          # Closes the Incident 2 (2026-06-02 `b3f7ca2`) gap where the SSH
          # heredoc apparently returned 0 with prod git HEAD never advancing.
          # CTO design: `cto-reviews/2026-06-04-cicd-partial-deploy-investigation.md`.
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -o SendEnv=LOCAL_ALEMBIC_HEAD -o SendEnv=GITHUB_SHA "$DEPLOY_USER@$DEPLOY_HOST" \
            LOCAL_ALEMBIC_HEAD="$LOCAL_ALEMBIC_HEAD" GITHUB_SHA="$GITHUB_SHA" bash -s << 'REMOTE'
          # set -e halts on any non-zero exit; -u catches unset vars; -o pipefail
          # surfaces errors mid-pipeline. Critical for the alembic step: prior
          # to 2026-06-01 a silent migration skip could pass under a looser
          # shell mode. Do not soften these flags.
          set -euo pipefail

          cd /opt/resemblio-api/app

          # Probe: detect git-objects ownership drift before it bites the
          # `git fetch` below. Root cause of the e631585 deploy failure
          # (2026-06-02): a stray `sudo`/`root@` git op during a prior
          # session left pack objects under .git/objects/ owned by root,
          # making subsequent `git fetch` as claude-cowork fail with
          # `unpack-objects failed`. RCA:
          # _handoff/inbox/claude/2026-06-02-cicd-git-perm-failure-rca.md
          NON_OWNED=$(find /opt/resemblio-api/app/.git -not -user claude-cowork -print -quit 2>/dev/null || true)
          if [ -n "$NON_OWNED" ]; then
            echo "WARN: .git/ contains files not owned by claude-cowork (drift detected)."
            echo "  example: $NON_OWNED"
            echo "Attempting self-heal via sudo chown (requires NOPASSWD entry)."
            if sudo -n chown -R claude-cowork:claude-cowork /opt/resemblio-api/app/.git 2>/dev/null; then
              echo "Self-heal OK: .git/ ownership normalized to claude-cowork:claude-cowork."
            else
              echo "FATAL: .git/ ownership drift detected and sudo self-heal not permitted."
              echo "Run from parent SSH: sudo chown -R claude-cowork:claude-cowork /opt/resemblio-api/app/.git"
              echo "Then re-trigger this workflow. RCA: 2026-06-02-cicd-git-perm-failure-rca.md"
              exit 1
            fi
          fi

          git fetch --quiet origin main
          git reset --hard origin/main

          # Git-SHA parity assertion. Closes the class flagged by 2026-06-02
          # Incident 2 (commit `b3f7ca2`): GH Actions step reported success
          # but prod git HEAD never advanced from the prior commit. Triggers
          # when the SSH channel dropped mid-heredoc, when a queued concurrent
          # run raced on /opt/resemblio-api/app/.git, or when any future
          # failure shape diverges prod-state from repo-state. The assertion
          # makes both failure shapes loud and red instead of silent-green.
          # CTO design: `cto-reviews/2026-06-04-cicd-partial-deploy-investigation.md`.
          EXPECTED_SHA="${GITHUB_SHA}"
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "FATAL: prod git HEAD (${ACTUAL_SHA}) does not match workflow trigger SHA (${EXPECTED_SHA})."
            echo "The fetch+reset did not advance prod to the intended commit."
            echo "Likely cause: SSH heredoc truncation or concurrent deploy race."
            exit 1
          fi
          echo "Git-SHA parity OK: prod at ${ACTUAL_SHA} (matches workflow trigger)."

          /opt/resemblio-api/venv/bin/pip install -q --upgrade pip
          # Install with [browser] extra so Pillow + Playwright land in the prod
          # venv. Without the extra, the screenshot raster pass silently degrades
          # (Pillow missing -> PIL import fails -> raster fallback). Locked
          # 2026-06-04 after A1.1 deploy (commit 570fe1b) landed but the prod
          # venv was probed and Pillow was absent. The `[browser]` group is
          # declared in pyproject.toml under [project.optional-dependencies].
          # Quoting `".[browser]"` is required so the shell does not glob the
          # bracket expression. Note: this step installs the Playwright Python
          # package; the chromium browser binary itself is installed separately
          # in the next step (idempotent; no-op when already present).
          /opt/resemblio-api/venv/bin/pip install -q -e ".[browser]"

          # Ensure the Chromium binary Playwright drives is present. Idempotent
          # (Playwright skips download when the version is already on disk).
          # Required for the screenshot raster pass to actually launch a browser
          # after the Python package install above.
          /opt/resemblio-api/venv/bin/playwright install chromium

          # Load RESEMBLIO_DB_URL from the production env file. Required so
          # alembic talks to the right database without inheriting whatever
          # may or may not be in the SSH session's environment.
          set -a
          # shellcheck disable=SC1091
          . /opt/resemblio-api/.env
          set +a

          # Pre-upgrade probe: log current prod revision and repo head BEFORE
          # mutating. If they already match, alembic upgrade is a no-op; if
          # they differ, we log the gap loudly so the deploy log shows what
          # migrations are about to run. This is the diagnostic that would
          # have surfaced the 0008 vs 0011 gap on the day it opened.
          PROD_CURRENT=$(/opt/resemblio-api/venv/bin/alembic -c alembic.ini current 2>/dev/null \
            | awk '{print $1}' | head -n1 || true)
          echo "ALEMBIC PRE-UPGRADE: prod current = '${PROD_CURRENT:-<none>}', repo head = '${LOCAL_ALEMBIC_HEAD}'"
          if [ "${PROD_CURRENT:-}" != "${LOCAL_ALEMBIC_HEAD}" ]; then
            echo "ALEMBIC GAP DETECTED: prod is behind repo head; running upgrade."
          else
            echo "ALEMBIC: prod already at repo head; upgrade will be a no-op."
          fi

          # Run the upgrade. `set -e` halts the script on non-zero exit, which
          # halts this SSH heredoc, which fails the GitHub Actions step, which
          # halts the deploy. Do not wrap this in `|| true` or any retry that
          # masks failure - a failed migration MUST block the service restart.
          /opt/resemblio-api/venv/bin/alembic -c alembic.ini upgrade head

          # Post-upgrade parity assertion: prod current MUST equal repo head.
          # This catches the failure mode where alembic exits 0 but did not
          # actually advance (e.g. multiple heads with unresolved dependencies,
          # or a partial branch upgrade). If they disagree, fail the deploy
          # BEFORE restarting the service - a service running against a stale
          # schema is worse than a service that didn't restart.
          POST_CURRENT=$(/opt/resemblio-api/venv/bin/alembic -c alembic.ini current 2>/dev/null \
            | awk '{print $1}' | head -n1 || true)
          if [ "${POST_CURRENT:-}" != "${LOCAL_ALEMBIC_HEAD}" ]; then
            echo "FATAL: alembic upgrade did not bring prod to repo head."
            echo "  prod current after upgrade: '${POST_CURRENT:-<none>}'"
            echo "  repo head:                  '${LOCAL_ALEMBIC_HEAD}'"
            echo "Aborting deploy; service NOT restarted."
            exit 1
          fi
          echo "ALEMBIC POST-UPGRADE: prod at ${POST_CURRENT} (matches repo head)."

          # Stage 3 (`cto-reviews/2026-06-03-resemblio-back-on-track-tdd-plan.md`):
          # close the silent-partial-deploy bug. On 2026-06-02 two deploys
          # returned green while the systemd unit's MainPID did NOT change -
          # the service kept serving the prior process image with the new
          # schema already applied. Parity assertion below captures the
          # MainPID BEFORE restart and AFTER restart and fails the deploy
          # when they match (the no-op restart signature).
          #
          # `systemctl show -p MainPID --value` returns just the number
          # (`--value` strips the `MainPID=` prefix). If the unit was
          # inactive, MainPID is 0; in that case we accept any non-zero
          # AFTER_PID as proof the restart took.
          BEFORE_PID=$(systemctl show -p MainPID --value resemblio-api 2>/dev/null || echo "0")
          echo "BEFORE_PID=${BEFORE_PID}"

          sudo systemctl restart resemblio-api
          sleep 2
          systemctl is-active resemblio-api

          AFTER_PID=$(systemctl show -p MainPID --value resemblio-api 2>/dev/null || echo "0")
          echo "AFTER_PID=${AFTER_PID}"

          # PID-change parity assertion. The before/after PIDs MUST differ;
          # if they match, the restart was a no-op and we are about to ship
          # a silent partial deploy. Special case: if BEFORE_PID was 0 (unit
          # was inactive), any non-zero AFTER_PID counts as a real start.
          if [ "${AFTER_PID}" = "0" ]; then
            echo "FATAL: AFTER_PID=0; systemd reports resemblio-api is not running after restart."
            exit 1
          fi
          if [ "${BEFORE_PID}" != "0" ] && [ "${BEFORE_PID}" = "${AFTER_PID}" ]; then
            echo "FATAL: PID did not change across restart (BEFORE_PID=${BEFORE_PID}, AFTER_PID=${AFTER_PID})."
            echo "This is the silent-partial-deploy signature. The new code is NOT running."
            echo "Rollback: parent SSH runs 'alembic downgrade -1' + 'git reset --hard <prior-sha>'"
            echo "  + 'sudo systemctl restart resemblio-api' per Resemblio_INFRA.md."
            exit 1
          fi
          echo "PID changed across restart: ${BEFORE_PID} -> ${AFTER_PID}; new code is running."
          REMOTE

      # Post-deploy smoke. Two probes:
      #   (1) /v1/healthz - liveness only; cheap, retried up to 8 times to
      #       cover the systemd-active-but-uvicorn-still-binding window.
      #   (2) /v1/readyz  - verb-probe; exercises the DB + storage paths
      #       (`app/routes/health.py::readyz`). A 200 here proves the NEW
      #       process can actually serve a request that touches the real
      #       backing services, not just that some process is bound to
      #       port 8000. This is the Stage 3 verb-probe that, paired with
      #       the in-deploy PID-change assertion above, makes silent
      #       partial deploys structurally impossible.
      - name: Post-deploy smoke check
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.resemblio.com/v1/healthz)
            if [ "$CODE" = "200" ]; then
              echo "healthz OK (HTTP $CODE)"
              break
            fi
            echo "healthz attempt $i: HTTP $CODE; retrying"
            sleep 5
            if [ "$i" = "8" ]; then
              echo "healthz failed after retries"
              exit 1
            fi
          done

          # /v1/readyz verb-probe. 5 retries are enough; if the DB or
          # storage path is broken after deploy, that is the actual deploy
          # failure and we want to surface it red, not paper over with
          # longer backoff. Rollback path on failure is documented in
          # Resemblio_INFRA.md under "Schema migration discipline":
          # alembic downgrade -1 + redeploy prior code sha.
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.resemblio.com/v1/readyz)
            if [ "$CODE" = "200" ]; then
              echo "readyz OK (HTTP $CODE) - new code is exercising DB + storage"
              break
            fi
            echo "readyz attempt $i: HTTP $CODE; retrying"
            sleep 5
            if [ "$i" = "5" ]; then
              echo "FATAL: /v1/readyz did not return 200 after deploy."
              echo "The service is bound but cannot serve a real verb-probe."
              echo "Rollback: alembic downgrade -1 + redeploy prior code sha"
              echo "  (Resemblio_INFRA.md > Schema migration discipline)."
              exit 1
            fi
          done

      # Link-crawl smoke gate (standing PR gate locked 2026-06-03).
      # Runs AFTER /v1/readyz; same retry pattern as the smoke step above.
      # Reads `code/api/surfaces.yml` (vendored copy of the canonical
      # workspace-level `projects/Resemblio/surfaces.yml`) for the surface
      # registry, crawls every registered surface, parses every `<a href>`
      # / `<link>` / `<script src>` / `<img src>` / `<iframe src>` /
      # `<form action>` in the rendered HTML via stdlib `html.parser`
      # (DOM parse, NOT regex), and asserts every INTERNAL link returns
      # 200 (or a documented 301).
      #
      # Path note: the GitHub Actions runner checks out only the
      # resemblio-api repo (rooted at what is `code/api/` in Frank's
      # workspace), so the canonical workspace path `../../surfaces.yml`
      # does not exist on CI. The repo carries its own copy at
      # `surfaces.yml` (this file's repo root) which MUST stay
      # byte-identical to the workspace canonical source. A test asserts
      # the parity.
      #
      # Why this gate exists: on 2026-06-02 the Library v1.1 deploy went
      # green and 500'd every metadata route. Same shape bit Susann WP
      # staging (nav 404s post-deploy). Status-only smoke (healthz/readyz)
      # cannot catch link-shape regressions because the smoke routes
      # themselves were healthy. This gate is the structural fix.
      #
      # External links are not crawled; the gate only asserts on surfaces
      # Resemblio owns. The JSON report (schema_version=link_crawl_report_v1)
      # is uploaded as a workflow artifact for forensics.
      - name: Link-crawl smoke (assert every internal link returns 200)
        id: link_crawl_smoke
        run: |
          set -e
          /tmp/ci-venv/bin/python scripts/link_crawl_smoke.py \
            --surfaces ./surfaces.yml \
            --report /tmp/link_crawl_report.json

      - name: Upload link-crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-crawl-report
          path: /tmp/link_crawl_report.json
          if-no-files-found: ignore

      # Closes audit finding M8-API (companion to the web-side security-header
      # smoke check at `projects/Resemblio/code/web/.github/workflows/deploy.yml`).
      # Asserts (1) Caddy-fronted HSTS is present (so a future Caddyfile edit
      # that breaks TLS hardening fails the deploy) and (2) the Server response
      # header has been stripped by the FastAPI middleware (regression guard
      # for the fix at `app/main.py` that closed the v1 hardening backlog item).
      # Headers checked here are intentionally conservative - the API service
      # does not own the full web-frontend header set (CSP, X-Frame-Options,
      # etc. are scoped to the browser surface). Widen this check if the API
      # Caddy site config later sets additional response headers worth gating.
      - name: API security header smoke check
        run: |
          set -e
          HEADERS=$(curl -sI https://api.resemblio.com/v1/healthz)
          echo "$HEADERS" | grep -i "^strict-transport-security:" || { echo "MISSING: HSTS on api.resemblio.com"; exit 1; }
          if echo "$HEADERS" | grep -iq "^server:"; then
            echo "REGRESSION: Server header is present on api.resemblio.com; middleware strip is not effective"
            echo "$HEADERS" | grep -i "^server:"
            exit 1
          fi
          echo "API security headers OK (HSTS present, Server header stripped)."
