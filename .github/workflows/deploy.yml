name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sanity test (offline tests; production swap happens via SSH)
        run: |
          python -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install -q --upgrade pip
          /tmp/ci-venv/bin/pip install -q -e ".[test]"
          /tmp/ci-venv/bin/pytest -q

      # Security gate: fail the deploy if any installed dependency has a known
      # CVE at high severity or above. Companion to the resemblio web npm-audit
      # gate (`projects/Resemblio/code/web/.github/workflows/deploy.yml`).
      # Closes audit finding M-DEV-1 (`projects/OptSus Team/security-audits/
      # 2026-05-26-initial.md`). pip-audit reads the installed environment, so
      # this step runs AFTER the install above and audits exactly what would
      # ship. `--strict` causes a non-zero exit if pip-audit cannot resolve a
      # dependency, preventing silent passes when the package index is flaky.
      - name: pip-audit (fail on known vulnerabilities)
        run: |
          /tmp/ci-venv/bin/pip install -q pip-audit
          # Drop --strict: pip-audit treats the locally-installed editable
          # `resemblio-api` (pip install -e .) as an audit error under
          # --strict, even with --skip-editable. The default exit-code
          # behavior still fails the build on real CVEs in pinned deps,
          # which is the actual security gate (closes audit finding
          # M-DEV-1). --skip-editable additionally prevents complaints
          # about our own in-tree package not being on PyPI.
          /tmp/ci-venv/bin/pip-audit --skip-editable

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Capture the alembic head revision recorded in the repo so we can assert
      # parity against prod's `alembic current` after the deploy. Locked
      # 2026-06-01 after the silent-skip incident: migrations 0009/0010/0011
      # were authored and "deployed" but Postgres was still at 0008. Root
      # cause hypothesis: an alembic upgrade step that errored silently or
      # was absent from a prior workflow revision still let the deploy report
      # green because no parity assertion existed. This step makes the
      # repo-head explicit BEFORE the deploy so we can compare after.
      - name: Capture local alembic head
        id: alembic_local_head
        run: |
          set -euo pipefail
          /tmp/ci-venv/bin/alembic -c alembic.ini heads --resolve-dependencies > /tmp/alembic_heads.txt
          # `alembic heads` prints lines like "<rev> (head)" - extract just the rev id.
          LOCAL_HEAD=$(awk '{print $1}' /tmp/alembic_heads.txt | head -n1)
          if [ -z "$LOCAL_HEAD" ]; then
            echo "FATAL: could not determine local alembic head from alembic.ini" >&2
            cat /tmp/alembic_heads.txt >&2
            exit 1
          fi
          echo "local_head=$LOCAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "Local alembic head (repo): $LOCAL_HEAD"

      - name: Deploy on resemblio-prod-01
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LOCAL_ALEMBIC_HEAD: ${{ steps.alembic_local_head.outputs.local_head }}
        run: |
          ssh -o SendEnv=LOCAL_ALEMBIC_HEAD "$DEPLOY_USER@$DEPLOY_HOST" \
            LOCAL_ALEMBIC_HEAD="$LOCAL_ALEMBIC_HEAD" bash -s << 'REMOTE'
          # set -e halts on any non-zero exit; -u catches unset vars; -o pipefail
          # surfaces errors mid-pipeline. Critical for the alembic step: prior
          # to 2026-06-01 a silent migration skip could pass under a looser
          # shell mode. Do not soften these flags.
          set -euo pipefail

          cd /opt/resemblio-api/app

          # Probe: detect git-objects ownership drift before it bites the
          # `git fetch` below. Root cause of the e631585 deploy failure
          # (2026-06-02): a stray `sudo`/`root@` git op during a prior
          # session left pack objects under .git/objects/ owned by root,
          # making subsequent `git fetch` as claude-cowork fail with
          # `unpack-objects failed`. RCA:
          # _handoff/inbox/claude/2026-06-02-cicd-git-perm-failure-rca.md
          NON_OWNED=$(find /opt/resemblio-api/app/.git -not -user claude-cowork -print -quit 2>/dev/null || true)
          if [ -n "$NON_OWNED" ]; then
            echo "WARN: .git/ contains files not owned by claude-cowork (drift detected)."
            echo "  example: $NON_OWNED"
            echo "Attempting self-heal via sudo chown (requires NOPASSWD entry)."
            if sudo -n chown -R claude-cowork:claude-cowork /opt/resemblio-api/app/.git 2>/dev/null; then
              echo "Self-heal OK: .git/ ownership normalized to claude-cowork:claude-cowork."
            else
              echo "FATAL: .git/ ownership drift detected and sudo self-heal not permitted."
              echo "Run from parent SSH: sudo chown -R claude-cowork:claude-cowork /opt/resemblio-api/app/.git"
              echo "Then re-trigger this workflow. RCA: 2026-06-02-cicd-git-perm-failure-rca.md"
              exit 1
            fi
          fi

          git fetch --quiet origin main
          git reset --hard origin/main
          /opt/resemblio-api/venv/bin/pip install -q --upgrade pip
          /opt/resemblio-api/venv/bin/pip install -q -e .

          # Load RESEMBLIO_DB_URL from the production env file. Required so
          # alembic talks to the right database without inheriting whatever
          # may or may not be in the SSH session's environment.
          set -a
          # shellcheck disable=SC1091
          . /opt/resemblio-api/.env
          set +a

          # Pre-upgrade probe: log current prod revision and repo head BEFORE
          # mutating. If they already match, alembic upgrade is a no-op; if
          # they differ, we log the gap loudly so the deploy log shows what
          # migrations are about to run. This is the diagnostic that would
          # have surfaced the 0008 vs 0011 gap on the day it opened.
          PROD_CURRENT=$(/opt/resemblio-api/venv/bin/alembic -c alembic.ini current 2>/dev/null \
            | awk '{print $1}' | head -n1 || true)
          echo "ALEMBIC PRE-UPGRADE: prod current = '${PROD_CURRENT:-<none>}', repo head = '${LOCAL_ALEMBIC_HEAD}'"
          if [ "${PROD_CURRENT:-}" != "${LOCAL_ALEMBIC_HEAD}" ]; then
            echo "ALEMBIC GAP DETECTED: prod is behind repo head; running upgrade."
          else
            echo "ALEMBIC: prod already at repo head; upgrade will be a no-op."
          fi

          # Run the upgrade. `set -e` halts the script on non-zero exit, which
          # halts this SSH heredoc, which fails the GitHub Actions step, which
          # halts the deploy. Do not wrap this in `|| true` or any retry that
          # masks failure - a failed migration MUST block the service restart.
          /opt/resemblio-api/venv/bin/alembic -c alembic.ini upgrade head

          # Post-upgrade parity assertion: prod current MUST equal repo head.
          # This catches the failure mode where alembic exits 0 but did not
          # actually advance (e.g. multiple heads with unresolved dependencies,
          # or a partial branch upgrade). If they disagree, fail the deploy
          # BEFORE restarting the service - a service running against a stale
          # schema is worse than a service that didn't restart.
          POST_CURRENT=$(/opt/resemblio-api/venv/bin/alembic -c alembic.ini current 2>/dev/null \
            | awk '{print $1}' | head -n1 || true)
          if [ "${POST_CURRENT:-}" != "${LOCAL_ALEMBIC_HEAD}" ]; then
            echo "FATAL: alembic upgrade did not bring prod to repo head."
            echo "  prod current after upgrade: '${POST_CURRENT:-<none>}'"
            echo "  repo head:                  '${LOCAL_ALEMBIC_HEAD}'"
            echo "Aborting deploy; service NOT restarted."
            exit 1
          fi
          echo "ALEMBIC POST-UPGRADE: prod at ${POST_CURRENT} (matches repo head)."

          sudo systemctl restart resemblio-api
          sleep 2
          systemctl is-active resemblio-api
          REMOTE

      - name: Post-deploy smoke check
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.resemblio.com/v1/healthz)
            if [ "$CODE" = "200" ]; then
              echo "healthz OK (HTTP $CODE)"
              break
            fi
            echo "healthz attempt $i: HTTP $CODE; retrying"
            sleep 5
            if [ "$i" = "8" ]; then
              echo "healthz failed after retries"
              exit 1
            fi
          done

      # Closes audit finding M8-API (companion to the web-side security-header
      # smoke check at `projects/Resemblio/code/web/.github/workflows/deploy.yml`).
      # Asserts (1) Caddy-fronted HSTS is present (so a future Caddyfile edit
      # that breaks TLS hardening fails the deploy) and (2) the Server response
      # header has been stripped by the FastAPI middleware (regression guard
      # for the fix at `app/main.py` that closed the v1 hardening backlog item).
      # Headers checked here are intentionally conservative - the API service
      # does not own the full web-frontend header set (CSP, X-Frame-Options,
      # etc. are scoped to the browser surface). Widen this check if the API
      # Caddy site config later sets additional response headers worth gating.
      - name: API security header smoke check
        run: |
          set -e
          HEADERS=$(curl -sI https://api.resemblio.com/v1/healthz)
          echo "$HEADERS" | grep -i "^strict-transport-security:" || { echo "MISSING: HSTS on api.resemblio.com"; exit 1; }
          if echo "$HEADERS" | grep -iq "^server:"; then
            echo "REGRESSION: Server header is present on api.resemblio.com; middleware strip is not effective"
            echo "$HEADERS" | grep -i "^server:"
            exit 1
          fi
          echo "API security headers OK (HSTS present, Server header stripped)."
