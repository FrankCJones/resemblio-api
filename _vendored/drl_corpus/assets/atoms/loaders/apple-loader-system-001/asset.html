<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>apple-loader-system-001 - Design Reference Library</title><link rel="stylesheet" href="tokens.css"/><style>.apple-loaders{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:56px 24px}.apple-loaders__inner{max-width:860px;margin:0 auto}.loader-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.loader{background:#fff;border:1px solid #e8e8ed;border-radius:24px;padding:28px;min-height:210px}.spinner{width:34px;height:34px;border:3px solid #d2d2d7;border-top-color:#0066cc;border-radius:999px}.progress .bar{height:8px;border-radius:999px;background:#e8e8ed;overflow:hidden}.progress .bar span{display:block;width:62%;height:100%;background:#0066cc}.skeleton .line{height:14px;border-radius:999px;background:#e8e8ed;margin:12px 0}.skeleton .line.short{width:56%}.apple-loaders__note{margin-top:22px;color:#86868b;font-size:12px;line-height:1.45}@media(max-width:820px){.loader-grid{grid-template-columns:1fr}}</style></head><body><section class="apple-loaders"><div class="apple-loaders__inner"><h1>Loading states with low visual noise.</h1><div class="loader-grid"><article class="loader"><h2>spinner</h2><div class="spinner"></div></article><article class="loader progress"><h2>progress</h2><div class="bar"><span></span></div></article><article class="loader skeleton"><h2>skeleton</h2><div class="line"></div><div class="line"></div><div class="line short"></div></article></div><aside class="apple-loaders__note" data-resemblio-attribution>Inspired by: Apple (https://www.apple.com). No affiliation with Apple. Independent design reference.</aside></div></section></body></html>
