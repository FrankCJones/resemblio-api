<!--
  Asset: modular-1-25-001
  Class: spacing-scales
  Pattern: (none - scales and motion primitives are visualizations, not patterns)
  Inspired by: editorial publication systems, classical typographic ratios
  Notes: Modular 1.25x scale; each step is 1.25x the previous, rounded.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>modular-1-25-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg); color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    min-height: 100vh;
    display: flex; flex-direction: column; gap: var(--ds-space-3);
  }
  .label {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
    margin-bottom: var(--ds-space-3);
  }
  .row {
    display: grid; grid-template-columns: 90px 64px 1fr;
    align-items: center; gap: var(--ds-space-3);
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    color: var(--ds-text-muted);
  }
  .row__slot { color: var(--ds-text); }
  .row__bar { height: 8px; background: var(--ds-accent); border-radius: 2px; }
</style>
</head>
<body>
  <div class="label">modular-1-25-001 · 1.25x modular spacing scale</div>
  <div class="row"><span class="row__slot">space-1</span><span>6px</span><div class="row__bar" style="width: 6px;"></div></div>
  <div class="row"><span class="row__slot">space-2</span><span>8px</span><div class="row__bar" style="width: 8px;"></div></div>
  <div class="row"><span class="row__slot">space-3</span><span>10px</span><div class="row__bar" style="width: 10px;"></div></div>
  <div class="row"><span class="row__slot">space-4</span><span>13px</span><div class="row__bar" style="width: 13px;"></div></div>
  <div class="row"><span class="row__slot">space-5</span><span>20px</span><div class="row__bar" style="width: 20px;"></div></div>
  <div class="row"><span class="row__slot">space-6</span><span>25px</span><div class="row__bar" style="width: 25px;"></div></div>
  <div class="row"><span class="row__slot">space-8</span><span>39px</span><div class="row__bar" style="width: 39px;"></div></div>
  <div class="row"><span class="row__slot">space-10</span><span>61px</span><div class="row__bar" style="width: 61px;"></div></div>
  <div class="row"><span class="row__slot">space-12</span><span>95px</span><div class="row__bar" style="width: 95px;"></div></div>
  <div class="row"><span class="row__slot">space-16</span><span>149px</span><div class="row__bar" style="width: 149px;"></div></div>
</body>
</html>
