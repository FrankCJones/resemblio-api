<!--
  Asset: four-point-001
  Class: spacing-scales
  Pattern: (no named pattern; scales are visualizations, not patterns)
  Inspired by: Linear, Vercel, Stripe
  Notes:
    - Visualizes the 4px additive scale as horizontal bars; one bar per step,
      width proportional to the spacing value.
    - The label for each bar shows the slot name and pixel value via mono.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>four-point-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg); color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    min-height: 100vh;
    display: flex; flex-direction: column; gap: var(--ds-space-2);
  }
  .label {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
    margin-bottom: var(--ds-space-3);
  }
  .row {
    display: grid;
    grid-template-columns: 90px 64px 1fr;
    align-items: center;
    gap: var(--ds-space-3);
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    color: var(--ds-text-muted);
  }
  .row__slot { color: var(--ds-text); }
  .row__bar {
    height: 8px; background: var(--ds-accent);
    border-radius: var(--ds-radius-xs);
  }
</style>
</head>
<body>
  <div class="label">four-point-001 · 4px additive spacing scale</div>
  <div class="row"><span class="row__slot">space-1</span><span>4px</span><div class="row__bar" style="width: 4px;"></div></div>
  <div class="row"><span class="row__slot">space-2</span><span>8px</span><div class="row__bar" style="width: 8px;"></div></div>
  <div class="row"><span class="row__slot">space-3</span><span>12px</span><div class="row__bar" style="width: 12px;"></div></div>
  <div class="row"><span class="row__slot">space-4</span><span>16px</span><div class="row__bar" style="width: 16px;"></div></div>
  <div class="row"><span class="row__slot">space-5</span><span>24px</span><div class="row__bar" style="width: 24px;"></div></div>
  <div class="row"><span class="row__slot">space-6</span><span>32px</span><div class="row__bar" style="width: 32px;"></div></div>
  <div class="row"><span class="row__slot">space-8</span><span>48px</span><div class="row__bar" style="width: 48px;"></div></div>
  <div class="row"><span class="row__slot">space-10</span><span>64px</span><div class="row__bar" style="width: 64px;"></div></div>
  <div class="row"><span class="row__slot">space-12</span><span>96px</span><div class="row__bar" style="width: 96px;"></div></div>
  <div class="row"><span class="row__slot">space-16</span><span>128px</span><div class="row__bar" style="width: 128px;"></div></div>
</body>
</html>
