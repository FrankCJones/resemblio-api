<!--
  Asset: substack-spacing-scale-001
  Class: spacing-scales
  Pattern: (none - token-derived atom)
  Inspired by: Substack (token values from system alphabet)
  Notes:
    - Spacing scale visualized as proportional bars per slot.
    - Synthesized deterministically from system tokens.css.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>substack-spacing-scale-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-2); }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); margin-bottom: var(--ds-space-3); }
  .row { display: grid; grid-template-columns: 90px 80px 1fr; align-items: center; gap: var(--ds-space-3); font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-text-muted); }
  .row__slot { color: var(--ds-text); }
  .row__bar { height: 8px; background: var(--ds-accent); border-radius: var(--ds-radius-xs); }
</style>
</head>
<body>
  <div class="label">substack-spacing-scale-001 - spacing ramp</div>
  <div class="row"><span class="row__slot">space-1</span><span>4px</span><div class="row__bar" style="width: var(--ds-space-1);"></div></div>
  <div class="row"><span class="row__slot">space-2</span><span>8px</span><div class="row__bar" style="width: var(--ds-space-2);"></div></div>
  <div class="row"><span class="row__slot">space-3</span><span>12px</span><div class="row__bar" style="width: var(--ds-space-3);"></div></div>
  <div class="row"><span class="row__slot">space-4</span><span>16px</span><div class="row__bar" style="width: var(--ds-space-4);"></div></div>
  <div class="row"><span class="row__slot">space-5</span><span>24px</span><div class="row__bar" style="width: var(--ds-space-5);"></div></div>
  <div class="row"><span class="row__slot">space-6</span><span>32px</span><div class="row__bar" style="width: var(--ds-space-6);"></div></div>
  <div class="row"><span class="row__slot">space-8</span><span>48px</span><div class="row__bar" style="width: var(--ds-space-8);"></div></div>
  <div class="row"><span class="row__slot">space-10</span><span>64px</span><div class="row__bar" style="width: var(--ds-space-10);"></div></div>
  <div class="row"><span class="row__slot">space-12</span><span>96px</span><div class="row__bar" style="width: var(--ds-space-12);"></div></div>
</body>
</html>
