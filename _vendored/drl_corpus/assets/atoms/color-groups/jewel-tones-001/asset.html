<!--
  Asset: jewel-tones-001
  Class: color-groups
  Pattern: warm-earth-palette
  Inspired by: editorial commerce (Cereal, Aēsop ranges)
  Notes:
    - Saturated jewel triad (emerald, burgundy, sapphire) on warm cream.
    - All swatches use tokens; no inline ornament.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>jewel-tones-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg); color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    display: flex; flex-direction: column; gap: var(--ds-space-4);
    min-height: 100vh;
  }
  .label {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: var(--ds-space-2);
  }
  .swatch {
    padding: var(--ds-space-3); min-height: 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-sm);
    background: var(--c);
  }
  .swatch--on-light { color: var(--ds-text); }
  .swatch--on-dark { color: var(--ds-bg); }
  .swatch__role {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
  }
  .swatch__hex { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="label">jewel-tones-001 · saturated editorial palette</div>
  <div class="grid">
    <div class="swatch swatch--on-light" style="--c: var(--ds-bg);"><span class="swatch__role">bg</span><span class="swatch__hex">#F4EFE6</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-surface);"><span class="swatch__role">surface</span><span class="swatch__hex">#FBF7F0</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text);"><span class="swatch__role">text</span><span class="swatch__hex">#1F1A14</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-border);"><span class="swatch__role">border</span><span class="swatch__hex">#D9CDB8</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-accent);"><span class="swatch__role">accent · emerald</span><span class="swatch__hex">#1F5B47</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-accent-2);"><span class="swatch__role">accent-2 · burgundy</span><span class="swatch__hex">#6E1E2E</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-info);"><span class="swatch__role">info · sapphire</span><span class="swatch__hex">#1F3C66</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-warning);"><span class="swatch__role">warning · amber</span><span class="swatch__hex">#B47820</span></div>
  </div>
</body>
</html>
