<!--
  Asset: hugging-face-color-group-001
  Class: color-groups
  Pattern: (none - token-derived atom)
  Inspired by: Hugging Face (token values from system alphabet)
  Notes:
    - Palette grid: bg, surface, text, muted, accent, border, status.
    - Synthesized deterministically from system tokens.css.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>hugging-face-color-group-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); display: flex; flex-direction: column; gap: var(--ds-space-4); min-height: 100vh; }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--ds-space-2); }
  .swatch { padding: var(--ds-space-3); min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--ds-border); background: var(--c); }
  .swatch--light { color: var(--ds-text); }
  .swatch--dark { color: var(--ds-bg); }
  .swatch__role { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; }
  .swatch__hex { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="label">hugging-face-color-group-001 - system palette grid</div>
  <div class="grid">
    <div class="swatch swatch--light" style="--c: var(--ds-bg);"><span class="swatch__role">bg</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch swatch--light" style="--c: var(--ds-surface);"><span class="swatch__role">surface</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch swatch--dark" style="--c: var(--ds-text);"><span class="swatch__role">text</span><span class="swatch__hex">#1F2937</span></div>
    <div class="swatch swatch--dark" style="--c: var(--ds-text-muted);"><span class="swatch__role">muted</span><span class="swatch__hex">#6B7280</span></div>
    <div class="swatch swatch--dark" style="--c: var(--ds-accent);"><span class="swatch__role">accent</span><span class="swatch__hex">#FFD21E</span></div>
    <div class="swatch swatch--light" style="--c: var(--ds-border);"><span class="swatch__role">border</span><span class="swatch__hex">#E5E7EB</span></div>
    <div class="swatch swatch--dark" style="--c: var(--ds-success);"><span class="swatch__role">success</span><span class="swatch__hex">#10B981</span></div>
    <div class="swatch swatch--dark" style="--c: var(--ds-error);"><span class="swatch__role">error</span><span class="swatch__hex">#EF4444</span></div>
  </div>
</body>
</html>
