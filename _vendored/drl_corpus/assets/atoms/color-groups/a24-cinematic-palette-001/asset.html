<!--
  Asset: a24-cinematic-palette-001
  Class: color-groups
  Pattern: paper-and-ink
  Inspired by: A24 Films (a24films.com)
  Notes:
    - Cinema-black field with paper-white type; the inverse register of the A24 shop, matching the title-card moment.
    - All swatches read from tokens.css. No inline values; the asset is pure contract demonstration.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>a24-cinematic-palette-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<!-- System sans is used for the swatch chrome; no web-font import is needed since
     the asset's job is to demonstrate the color contract, not type. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-4);
    min-height: 100vh;
  }
  .label {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: var(--ds-space-2);
  }
  .swatch {
    padding: var(--ds-space-3);
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid var(--ds-border);
    background: var(--c);
  }
  .swatch--on-light { color: var(--ds-bg); }
  .swatch--on-dark  { color: var(--ds-text); }
  .swatch__role {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
  }
  .swatch__hex {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
  }
  .titlecard {
    margin-top: var(--ds-space-5);
    background: var(--ds-bg);
    color: var(--ds-text-strong);
    padding: var(--ds-space-10) var(--ds-space-6);
    text-align: center;
    border: 1px solid var(--ds-border);
    font-family: var(--ds-font-display);
    font-size: var(--ds-text-5xl);
    letter-spacing: var(--ds-tracking-tight);
    line-height: var(--ds-leading-tight);
  }
  .titlecard__kicker {
    display: block;
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
    margin-bottom: var(--ds-space-5);
  }
</style>
</head>
<body>
  <div class="label">a24-cinematic-palette-001 · cinema black with paper-white type</div>
  <div class="grid">
    <div class="swatch swatch--on-dark"  style="--c: var(--ds-bg);"><span class="swatch__role">bg · cinema black</span><span class="swatch__hex">#0A0908</span></div>
    <div class="swatch swatch--on-dark"  style="--c: var(--ds-surface);"><span class="swatch__role">surface</span><span class="swatch__hex">#14110F</span></div>
    <div class="swatch swatch--on-dark"  style="--c: var(--ds-surface-2);"><span class="swatch__role">surface-2</span><span class="swatch__hex">#1E1A17</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-text);"><span class="swatch__role">text · paper</span><span class="swatch__hex">#F5F1EA</span></div>
    <div class="swatch swatch--on-dark"  style="--c: var(--ds-text-muted);"><span class="swatch__role">muted</span><span class="swatch__hex">#9C968A</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-text-strong);"><span class="swatch__role">strong</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch swatch--on-dark"  style="--c: var(--ds-border);"><span class="swatch__role">border</span><span class="swatch__hex">#2A2522</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-accent);"><span class="swatch__role">accent · slab</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch swatch--on-dark"  style="--c: var(--ds-success);"><span class="swatch__role">success</span><span class="swatch__hex">#4A8A5C</span></div>
    <div class="swatch swatch--on-dark"  style="--c: var(--ds-warning);"><span class="swatch__role">warning</span><span class="swatch__hex">#C49449</span></div>
    <div class="swatch swatch--on-dark"  style="--c: var(--ds-error);"><span class="swatch__role">error</span><span class="swatch__hex">#B24A3F</span></div>
  </div>

  <div class="titlecard">
    <span class="titlecard__kicker">Lorem Ipsum &middot; In Theaters</span>
    Dolor Sit Amet
  </div>
</body>
</html>
