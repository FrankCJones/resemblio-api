<!--
  Asset: pastel-soft-001
  Class: color-groups
  Pattern: warm-earth-palette
  Inspired by: wellness, consumer health, modern lifestyle brands
  Notes: All swatches use tokens; no inline ornament.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>pastel-soft-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg); color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    display: flex; flex-direction: column; gap: var(--ds-space-4);
    min-height: 100vh;
  }
  .label {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: var(--ds-space-2);
  }
  .swatch {
    padding: var(--ds-space-3); min-height: 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    background: var(--c);
  }
  .swatch--on-light { color: var(--ds-text); }
  .swatch__role {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
  }
  .swatch__hex { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="label">pastel-soft-001 · desaturated luminous palette</div>
  <div class="grid">
    <div class="swatch swatch--on-light" style="--c: var(--ds-bg);"><span class="swatch__role">bg</span><span class="swatch__hex">#FAF7F2</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-text);"><span class="swatch__role">text</span><span class="swatch__hex">#2C2A26</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-accent);"><span class="swatch__role">accent · lavender</span><span class="swatch__hex">#B8A7E0</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-accent-2);"><span class="swatch__role">accent-2 · peach</span><span class="swatch__hex">#F2B89E</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-success);"><span class="swatch__role">success · mint</span><span class="swatch__hex">#A8C9A6</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-warning);"><span class="swatch__role">warning · butter</span><span class="swatch__hex">#E8C977</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-error);"><span class="swatch__role">error · terracotta</span><span class="swatch__hex">#D89A8B</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-border);"><span class="swatch__role">border</span><span class="swatch__hex">#E8E2D5</span></div>
  </div>
</body>
</html>
