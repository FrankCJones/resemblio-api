<!--
  Asset: candy-bright-001
  Class: color-groups
  Pattern: electric-accent
  Inspired by: consumer DTC, fitness/wellness brands
  Notes: Saturated pink and mint on pure white; pill-default radii implied. All swatches use tokens.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>candy-bright-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); display: flex; flex-direction: column; gap: var(--ds-space-4); min-height: 100vh; }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--ds-space-2); }
  .swatch { padding: var(--ds-space-3); min-height: 88px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-md); background: var(--c); }
  .swatch--on-light { color: var(--ds-text); }
  .swatch--on-dark { color: var(--ds-bg); }
  .swatch__role { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; }
  .swatch__hex { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="label">candy-bright-001 · DTC saturated palette</div>
  <div class="grid">
    <div class="swatch swatch--on-light" style="--c: var(--ds-bg);"><span class="swatch__role">bg</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-text);"><span class="swatch__role">text</span><span class="swatch__hex">#1A1A1A</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-accent);"><span class="swatch__role">accent · pink</span><span class="swatch__hex">#FF3D78</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-accent-2);"><span class="swatch__role">accent-2 · mint</span><span class="swatch__hex">#1FE095</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-warning);"><span class="swatch__role">warning</span><span class="swatch__hex">#FFB332</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-info);"><span class="swatch__role">info</span><span class="swatch__hex">#5B72FF</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-border);"><span class="swatch__role">border</span><span class="swatch__hex">#EEEEEE</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-surface-2);"><span class="swatch__role">surface-2</span><span class="swatch__hex">#FAFAFA</span></div>
  </div>
</body>
</html>
