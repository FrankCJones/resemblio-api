<!--
  Asset: vintage-print-001
  Class: color-groups
  Pattern: warm-earth-palette
  Inspired by: letterpress, risograph print
  Notes: Two-spot-color feel with cream background. All swatches use tokens.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>vintage-print-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); display: flex; flex-direction: column; gap: var(--ds-space-4); min-height: 100vh; }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--ds-space-2); }
  .swatch { padding: var(--ds-space-3); min-height: 88px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--ds-border); background: var(--c); }
  .swatch--on-light { color: var(--ds-text); }
  .swatch--on-dark { color: var(--ds-bg); }
  .swatch__role { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; }
  .swatch__hex { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="label">vintage-print-001 · two-spot-color print palette</div>
  <div class="grid">
    <div class="swatch swatch--on-light" style="--c: var(--ds-bg);"><span class="swatch__role">bg · cream</span><span class="swatch__hex">#F1EBDC</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text);"><span class="swatch__role">text · ink</span><span class="swatch__hex">#1F1814</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-accent);"><span class="swatch__role">spot · brick</span><span class="swatch__hex">#C24438</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-accent-2);"><span class="swatch__role">spot · teal</span><span class="swatch__hex">#2F6E78</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-success);"><span class="swatch__role">success</span><span class="swatch__hex">#4F6B3E</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-warning);"><span class="swatch__role">warning</span><span class="swatch__hex">#B07D24</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-border);"><span class="swatch__role">border</span><span class="swatch__hex">#C9BEA5</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-surface);"><span class="swatch__role">surface</span><span class="swatch__hex">#F8F4E8</span></div>
  </div>
</body>
</html>
