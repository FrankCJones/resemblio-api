<!--
  Asset: saturated-tech-001
  Class: color-groups
  Pattern: accent-on-neutral
  Inspired by: Stripe
  Notes: All swatches use tokens.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>saturated-tech-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg); color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    display: flex; flex-direction: column; gap: var(--ds-space-4);
    min-height: 100vh;
  }
  .label {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: var(--ds-space-2);
  }
  .swatch {
    padding: var(--ds-space-3); min-height: 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-sm);
    background: var(--c);
  }
  .swatch--on-light { color: var(--ds-text); }
  .swatch--on-dark { color: var(--ds-bg); }
  .swatch__role { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; }
  .swatch__hex { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="label">saturated-tech-001 · electric tech palette</div>
  <div class="grid">
    <div class="swatch swatch--on-light" style="--c: var(--ds-bg);"><span class="swatch__role">bg</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-surface);"><span class="swatch__role">surface</span><span class="swatch__hex">#F6F9FC</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text);"><span class="swatch__role">text · navy</span><span class="swatch__hex">#0A2540</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-accent);"><span class="swatch__role">accent · electric</span><span class="swatch__hex">#635BFF</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-accent-2);"><span class="swatch__role">accent-2 · cyan</span><span class="swatch__hex">#00D4FF</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-success);"><span class="swatch__role">success</span><span class="swatch__hex">#1FAA59</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-warning);"><span class="swatch__role">warning</span><span class="swatch__hex">#FF8F40</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-error);"><span class="swatch__role">error</span><span class="swatch__hex">#E5384F</span></div>
  </div>
</body>
</html>
