<!--
  Asset: curated-museum-neutral-001
  Class: color-groups
  Pattern: monochrome-palette, paper-and-ink
  Inspired by: Cosmos (cosmos.so)
  Notes:
    - The palette of a curated-platform brand: paper-warm white, true
      ink black, soft graphites, and zero accent color. The brand
      expresses through restraint so user-uploaded imagery is the
      page's only color.
    - Inline ornament: the top hairline rule on each swatch and the
      18px rounded preview thumbnail at the bottom showing the radius
      that defines the palette's structural voice. Both asset-specific;
      not promoted to contract slots.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>curated-museum-neutral-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-6);
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-5);
    min-height: 100vh;
  }

  .label {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    letter-spacing: var(--ds-tracking-normal);
    color: var(--ds-text-muted);
  }
  .label strong {
    color: var(--ds-text-strong);
    font-weight: 600;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: var(--ds-space-3);
  }

  .swatch {
    padding: var(--ds-space-4);
    min-height: 104px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid var(--ds-border);
    background: var(--c);
    /* Inline ornament: a 3px top rule colored with the swatch's role
     * value so the rule visually reads as the swatch's identity card.
     * Asset-specific; would clutter the contract. */
    border-top: 3px solid var(--ds-text-strong);
    border-radius: var(--ds-radius-md);
  }
  .swatch--on-light { color: #111; }
  .swatch--on-dark  { color: #FAFAF7; }
  .swatch__role {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
  }
  .swatch__hex {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
  }

  /* The closing demonstration: a rounded thumbnail showing the radius
   * value that gives this palette its structural voice. The image is
   * a CSS-only gradient placeholder so the asset has no external image
   * dependency. */
  .thumb-demo {
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-2);
    margin-top: var(--ds-space-4);
  }
  .thumb-demo__caption {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .thumb-demo__strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--ds-space-3);
  }
  .thumb-demo__tile {
    aspect-ratio: 3 / 4;
    border-radius: var(--ds-radius-lg);
    /* Inline ornament: four soft gradient stand-ins for four different
     * portrait-leaning thumbnails. The palette's purpose is to host
     * imagery, so the demonstration is the imagery's container shape. */
    background: linear-gradient(135deg, #D3CDC0 0%, #B5AC97 100%);
  }
  .thumb-demo__tile:nth-child(2) {
    background: linear-gradient(135deg, #C7C1B2 0%, #8E867A 100%);
  }
  .thumb-demo__tile:nth-child(3) {
    background: linear-gradient(135deg, #DAD3C5 0%, #A39A86 100%);
  }
  .thumb-demo__tile:nth-child(4) {
    background: linear-gradient(135deg, #CEC8BA 0%, #998F7D 100%);
  }
</style>
</head>
<body>
  <div class="label"><strong>curated-museum-neutral-001</strong> · paper white, true ink, graphite chrome, no accent</div>
  <div class="grid">
    <div class="swatch swatch--on-light" style="--c: var(--ds-bg);">
      <span class="swatch__role">bg</span><span class="swatch__hex">#FAFAF7</span>
    </div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-surface);">
      <span class="swatch__role">surface</span><span class="swatch__hex">#FFFFFF</span>
    </div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-surface-2);">
      <span class="swatch__role">surface-2</span><span class="swatch__hex">#F2F1ED</span>
    </div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text);">
      <span class="swatch__role">text</span><span class="swatch__hex">#111111</span>
    </div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text-muted);">
      <span class="swatch__role">muted</span><span class="swatch__hex">#6B6B68</span>
    </div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text-strong);">
      <span class="swatch__role">strong</span><span class="swatch__hex">#000000</span>
    </div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-border);">
      <span class="swatch__role">border</span><span class="swatch__hex">#E6E5E0</span>
    </div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-hairline);">
      <span class="swatch__role">hairline</span><span class="swatch__hex">#EFEEEA</span>
    </div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-success);">
      <span class="swatch__role">success</span><span class="swatch__hex">#4B6A4F</span>
    </div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-warning);">
      <span class="swatch__role">warning</span><span class="swatch__hex">#B58A3A</span>
    </div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-error);">
      <span class="swatch__role">error</span><span class="swatch__hex">#9B4438</span>
    </div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-info);">
      <span class="swatch__role">info</span><span class="swatch__hex">#4B5560</span>
    </div>
  </div>

  <div class="thumb-demo">
    <div class="thumb-demo__caption">radius-lg 18px · the palette's structural voice</div>
    <div class="thumb-demo__strip" aria-hidden="true">
      <div class="thumb-demo__tile"></div>
      <div class="thumb-demo__tile"></div>
      <div class="thumb-demo__tile"></div>
      <div class="thumb-demo__tile"></div>
    </div>
  </div>
</body>
</html>
