<!--
  Asset: dark-editorial-001
  Class: color-groups
  Pattern: paper-and-ink
  Inspired by: longform digital publications, dark-mode editorial sites
  Notes: Near-black warm background, amber accent, editorial serif. All swatches use tokens.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>dark-editorial-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); display: flex; flex-direction: column; gap: var(--ds-space-4); min-height: 100vh; }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--ds-space-2); }
  .swatch { padding: var(--ds-space-3); min-height: 88px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--ds-border); background: var(--c); }
  .swatch--on-light { color: var(--ds-bg); }
  .swatch--on-dark { color: var(--ds-text); }
  .swatch__role { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; }
  .swatch__hex { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="label">dark-editorial-001 · warm near-black with amber accent</div>
  <div class="grid">
    <div class="swatch swatch--on-dark" style="--c: var(--ds-bg);"><span class="swatch__role">bg · warm black</span><span class="swatch__hex">#14110D</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-surface);"><span class="swatch__role">surface</span><span class="swatch__hex">#1F1A14</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-text);"><span class="swatch__role">text · paper</span><span class="swatch__hex">#F4EFE5</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text-muted);"><span class="swatch__role">muted</span><span class="swatch__hex">#A89F92</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-accent);"><span class="swatch__role">accent · amber</span><span class="swatch__hex">#D9A14A</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-border);"><span class="swatch__role">border</span><span class="swatch__hex">#38322B</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-success);"><span class="swatch__role">success</span><span class="swatch__hex">#7A9E5A</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-error);"><span class="swatch__role">error</span><span class="swatch__hex">#C25A4A</span></div>
  </div>
</body>
</html>
