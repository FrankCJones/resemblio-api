<!--
  Asset: paper-ink-zero-001
  Class: color-groups
  Pattern: paper-and-ink
  Inspired by: A Working Library, Robin Sloan, classic editorial restraint
  Notes:
    - Maximum reduction: paper, ink, gray steps, one status color.
    - All swatches use tokens.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>paper-ink-zero-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg); color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    display: flex; flex-direction: column; gap: var(--ds-space-4);
    min-height: 100vh;
  }
  .label {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: var(--ds-space-2);
  }
  .swatch {
    padding: var(--ds-space-3); min-height: 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--ds-border);
    background: var(--c);
  }
  .swatch--on-light { color: var(--ds-text); }
  .swatch--on-dark { color: var(--ds-bg); }
  .swatch__role {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
  }
  .swatch__hex { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="label">paper-ink-zero-001 · maximum reduction</div>
  <div class="grid">
    <div class="swatch swatch--on-light" style="--c: var(--ds-bg);"><span class="swatch__role">bg · paper</span><span class="swatch__hex">#FBFAF7</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-surface);"><span class="swatch__role">surface · white</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text);"><span class="swatch__role">text · ink</span><span class="swatch__hex">#111111</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-text-muted);"><span class="swatch__role">muted</span><span class="swatch__hex">#707070</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-border);"><span class="swatch__role">border</span><span class="swatch__hex">#D8D6CF</span></div>
    <div class="swatch swatch--on-light" style="--c: var(--ds-hairline);"><span class="swatch__role">hairline</span><span class="swatch__hex">#EAE7DD</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-success);"><span class="swatch__role">success</span><span class="swatch__hex">#2A6F44</span></div>
    <div class="swatch swatch--on-dark" style="--c: var(--ds-error);"><span class="swatch__role">error</span><span class="swatch__hex">#8E2D24</span></div>
  </div>
</body>
</html>
