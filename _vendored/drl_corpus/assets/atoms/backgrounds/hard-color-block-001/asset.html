<!--
  Asset: hard-color-block-001
  Class: backgrounds
  Pattern: electric-accent
  Inspired by: Pitch
  Notes:
    - A single saturated color fills the section. No gradient, no texture,
      no overlay. White type sits directly on the saturated bg with no chrome.
    - Inline ornament: the color (Pitch purple rgb(141, 73, 247)) is the
      whole point; it lives in --ds-bg so a per-site override swaps the
      brand commit. The pattern is "commit to one hue at full saturation
      across a whole section," not the specific purple.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>hard-color-block-001 . Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    display: grid;
    place-items: center;
  }

  .label {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
    padding: var(--ds-space-2) var(--ds-space-4);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-full);
    background: rgba(255, 255, 255, 0.08);
  }

  .lorem {
    max-width: 18ch;
    margin-top: var(--ds-space-6);
    font-family: var(--ds-font-display);
    font-size: var(--ds-text-4xl);
    line-height: var(--ds-leading-tight);
    letter-spacing: var(--ds-tracking-tight);
    color: var(--ds-text-strong);
    font-weight: 700;
    text-align: center;
  }

  .sub {
    margin-top: var(--ds-space-4);
    max-width: 28ch;
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
    line-height: var(--ds-leading-normal);
    color: var(--ds-text-muted);
    text-align: center;
  }
</style>
</head>
<body>
  <main style="display:grid;place-items:center;gap:0;">
    <span class="label">hard-color-block-001 . background atom</span>
    <h1 class="lorem">Lorem ipsum dolor sit amet.</h1>
    <p class="sub">Consectetur adipiscing elit, sed do eiusmod tempor incididunt.</p>
  </main>
</body>
</html>
