<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>oversized-statement-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-3); min-height: 100vh; display: grid; place-items: center; overflow: hidden; }
  h1.statement { font-family: var(--ds-font-display); font-size: clamp(var(--ds-text-4xl), 16vw, var(--ds-text-6xl)); font-weight: 800; line-height: var(--ds-leading-tight); letter-spacing: var(--ds-tracking-tight); margin: 0; text-align: center; }
</style>
</head>
<body>
  <h1 class="statement">LOREM IPSUM</h1>
</body>
</html>
