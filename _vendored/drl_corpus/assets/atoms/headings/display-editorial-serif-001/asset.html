<!--
  Asset: display-editorial-serif-001
  Class: headings
  Pattern: display-editorial, display-italic-accent
  Inspired by: editorial publication design
  Notes: Large serif headline with italic accent word in editorial red.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>display-editorial-serif-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: grid; place-items: center; font-optical-sizing: auto; }
  h1.display { font-family: var(--ds-font-display); font-size: var(--ds-text-5xl); font-weight: 600; line-height: var(--ds-leading-tight); letter-spacing: var(--ds-tracking-tight); margin: 0; max-width: 18ch; text-wrap: balance; }
  h1.display em { font-style: italic; font-weight: 500; color: var(--ds-accent); }
</style>
</head>
<body>
  <h1 class="display">Lorem ipsum <em>dolor sit</em> amet.</h1>
</body>
</html>
