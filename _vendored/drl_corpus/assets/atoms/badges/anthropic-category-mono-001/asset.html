<!--
  Asset: anthropic-category-mono-001
  Class: badges
  Pattern: (none)
  Inspired by: Anthropic
  Notes:
    - Category label: mono uppercase ink with wide tracking; no background, no border.
    - The "badge" is type only. Pairs alongside the date badge in the same row.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>anthropic-category-mono-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--ds-space-10);
  }
  .stack { display: flex; flex-direction: column; gap: var(--ds-space-5); }
  .cat {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text);
    font-weight: 400;
  }
  .cat--md { font-size: var(--ds-text-sm); }
  .cat--muted { color: var(--ds-text-muted); }
  .cat--accent { color: var(--ds-accent); }
  .row { display: inline-flex; align-items: baseline; gap: var(--ds-space-3); }
  .sep { color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="stack">
    <span class="cat">Lorem</span>
    <span class="cat cat--md">Ipsum dolor sit</span>
    <span class="cat cat--muted">Consectetur</span>
    <span class="cat cat--accent">Adipiscing</span>
    <div class="row">
      <span class="cat">Lorem</span>
      <span class="sep" aria-hidden="true">/</span>
      <time class="cat cat--muted">Apr 16, 2026</time>
    </div>
  </div>
</body>
</html>
