<!--
  Asset: anthropic-date-mono-001
  Class: badges
  Pattern: (none)
  Inspired by: Anthropic
  Notes:
    - Date metadata as a mono uppercase label in muted ink.
    - Sister to anthropic-category-mono-001; same register, lower contrast.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>anthropic-date-mono-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--ds-space-10);
  }
  .stack { display: flex; flex-direction: column; gap: var(--ds-space-5); align-items: flex-start; }
  .date {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
    font-weight: 400;
  }
  .date--md { font-size: var(--ds-text-sm); }
  .date--ink { color: var(--ds-text); }
  .row { display: inline-flex; align-items: baseline; gap: var(--ds-space-3); }
  .sep { color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="stack">
    <time class="date">Apr 16, 2026</time>
    <time class="date date--md">Feb 4, 2026</time>
    <time class="date date--ink">Jan 30, 2026</time>
    <div class="row">
      <time class="date">Apr 16, 2026</time>
      <span class="sep" aria-hidden="true">/</span>
      <span class="date date--ink">Lorem</span>
    </div>
  </div>
</body>
</html>
