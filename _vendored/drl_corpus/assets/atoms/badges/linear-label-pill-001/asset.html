<!--
  Asset: linear-label-pill-001
  Class: badges
  Pattern: primary-pill
  Inspired by: Linear
  Notes:
    - Neutral chrome plus colored dot. The pill stays neutral so a row of
      pills reads as a tidy stack of labels; color lives only in the dot,
      which carries the category.
    - Variables: every value comes from the contract. Dot uses the
      success/warning/error/accent semantic slots directly.
    - Inline ornament: none.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>linear-label-pill-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--ds-space-2);
    flex-wrap: wrap;
  }
  .pill {
    display: inline-flex; align-items: center; gap: var(--ds-space-1);
    background: var(--ds-surface);
    border: 0.8px solid var(--ds-border);
    color: var(--ds-text-muted);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-xs);
    font-weight: 500;
    letter-spacing: var(--ds-tracking-normal);
    padding: 2px var(--ds-space-2);
    border-radius: var(--ds-radius-sm);
  }
  .dot { width: 6px; height: 6px; border-radius: var(--ds-radius-full); }
  .dot.is-bug { background: var(--ds-error); }
  .dot.is-design { background: var(--ds-accent); }
  .dot.is-perf { background: var(--ds-warning); }
  .dot.is-ship { background: var(--ds-success); }
</style>
</head>
<body>
  <span class="pill"><span class="dot is-bug"></span>Lorem</span>
  <span class="pill"><span class="dot is-design"></span>Ipsum dolor</span>
  <span class="pill"><span class="dot is-perf"></span>Sit amet</span>
  <span class="pill"><span class="dot is-ship"></span>Consectetur</span>
  <span class="pill"><span class="dot is-design"></span>Adipiscing</span>
</body>
</html>
