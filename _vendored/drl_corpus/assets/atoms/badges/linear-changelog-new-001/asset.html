<!--
  Asset: linear-changelog-new-001
  Class: badges
  Pattern: primary-pill
  Inspired by: Linear
  Notes:
    - The only place in the Linear marketing vocabulary where the indigo
      accent renders as a fill. Uppercase Inter Variable label, white ink,
      4px radius.
    - Variables: every color, size, spacing, radius from the contract.
    - Inline ornament: none.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>linear-changelog-new-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--ds-space-3);
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex; align-items: center;
    background: var(--ds-accent);
    color: var(--ds-text-strong);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-xs);
    font-weight: 510;
    letter-spacing: var(--ds-tracking-wide);
    text-transform: uppercase;
    padding: 2px var(--ds-space-2);
    border-radius: var(--ds-radius-sm);
    transition: background var(--ds-duration-instant) var(--ds-ease-standard);
  }
  .badge:hover { background: var(--ds-accent-2); }
</style>
</head>
<body>
  <span class="badge">New</span>
  <span class="badge">Changelog</span>
  <span class="badge">Lorem</span>
</body>
</html>
