<!--
  Asset: count-indicator-001
  Class: badges
  Pattern: (none)
  Inspired by: notification badge convention
  Notes: Three samples: compact dot, single digit, double-digit (99+ overflow).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>count-indicator-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: var(--ds-space-5); }
  .holder { position: relative; display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-md); }
  .holder svg { width: 22px; height: 22px; color: var(--ds-text); }
  .count {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--ds-accent); color: white;
    font-size: var(--ds-text-2xs); font-weight: 600;
    border-radius: var(--ds-radius-full);
    display: grid; place-items: center;
    border: 2px solid var(--ds-bg);
  }
  .count--dot { width: 10px; min-width: 10px; height: 10px; padding: 0; }
</style>
</head>
<body>
  <div class="holder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="count count--dot"></span></div>
  <div class="holder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="count">3</span></div>
  <div class="holder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="count">99+</span></div>
</body>
</html>
