<!--
  Asset: tag-chip-001
  Class: badges
  Pattern: (none)
  Inspired by: content tagging, filter UI tradition
  Notes: Three states: passive tag, active filter, dismissible.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>tag-chip-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: var(--ds-space-3); flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: var(--ds-space-2); padding: 4px var(--ds-space-3); background: var(--ds-surface-2); border: 1px solid var(--ds-border); border-radius: var(--ds-radius-sm); font-size: var(--ds-text-xs); color: var(--ds-text); }
  .chip--active { background: var(--ds-accent-2); border-color: var(--ds-accent); color: var(--ds-accent); font-weight: 500; }
  .chip__dismiss { width: 14px; height: 14px; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; color: currentColor; padding: 0; opacity: 0.7; }
  .chip__dismiss:hover { opacity: 1; }
  .chip__dismiss svg { width: 10px; height: 10px; }
</style>
</head>
<body>
  <span class="chip">design</span>
  <span class="chip">typography</span>
  <span class="chip chip--active">color · active</span>
  <span class="chip chip--active">layout <button class="chip__dismiss" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
</body>
</html>
