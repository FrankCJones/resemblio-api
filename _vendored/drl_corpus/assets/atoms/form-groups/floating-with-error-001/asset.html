<!--
  Asset: floating-with-error-001
  Class: form-groups
  Pattern: floating-label
  Inspired by: Vercel (Geist)
  Notes:
    - Label starts at input centerline (16px); on focus or fill it travels to a smaller size pinned just inside the top edge.
    - On error, the border and the floated label both tint to the error red; the help-text slot swaps to the same red.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>floating-with-error-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<!-- Geist Sans is Vercel's licensed face; system-ui is the closest available fallback. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
    line-height: var(--ds-leading-normal);
    min-height: 100vh;
    padding: var(--ds-space-10) var(--ds-space-8);
  }
  .stage {
    max-width: 760px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--ds-space-6);
  }
  @media (max-width: 640px) {
    .stage { grid-template-columns: 1fr; }
  }
  .panel {
    padding-top: var(--ds-space-4);
    border-top: 1px solid var(--ds-hairline);
  }
  .state-label {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    text-transform: uppercase;
    letter-spacing: var(--ds-tracking-wider);
    margin-bottom: var(--ds-space-4);
  }
  .field {
    position: relative;
    margin-bottom: var(--ds-space-1);
  }
  .field-input {
    width: 100%;
    background: var(--ds-surface);
    color: var(--ds-text);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    padding: 18px 12px 6px;                /* inline: top-heavy padding makes room for the floated label */
    height: 52px;                          /* inline: 12px taller than Geist's 40px to host the floating label inside the field */
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
    letter-spacing: var(--ds-tracking-normal);
    outline: none;
    transition: border-color var(--ds-duration-fast) var(--ds-ease-standard);
  }
  .field-input:focus-visible,
  .field-input.is-focus {
    border-color: var(--ds-text-strong);
    outline: 2px solid var(--ds-focus-ring);
    outline-offset: 1px;
  }
  .field-label {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ds-text-muted);
    font-size: var(--ds-text-lg);
    pointer-events: none;
    transition: top var(--ds-duration-fast) var(--ds-ease-standard),
                font-size var(--ds-duration-fast) var(--ds-ease-standard),
                color var(--ds-duration-fast) var(--ds-ease-standard),
                transform var(--ds-duration-fast) var(--ds-ease-standard);
  }
  .field.is-focus .field-label,
  .field.is-filled .field-label {
    top: 8px;
    transform: translateY(0);
    font-size: var(--ds-text-xs);
    color: var(--ds-text-muted);
  }
  .field-help {
    color: var(--ds-text-muted);
    font-size: var(--ds-text-xs);
    margin-top: var(--ds-space-1);
    padding-left: var(--ds-space-3);
  }
  .field.is-error .field-input {
    border-color: var(--ds-error);
  }
  .field.is-error .field-label,
  .field.is-error + .field-help,
  .field.is-error ~ .field-help {
    color: var(--ds-error);
  }
  .group { display: flex; flex-direction: column; }
</style>
</head>
<body>
  <div class="stage">
    <div class="panel">
      <div class="state-label">rest</div>
      <div class="group">
        <div class="field">
          <input class="field-input" id="i1" type="email" value=""/>
          <label class="field-label" for="i1">Lorem electronicus</label>
        </div>
        <p class="field-help">Lorem ipsum dolor sit amet.</p>
      </div>
    </div>
    <div class="panel">
      <div class="state-label">focus</div>
      <div class="group">
        <div class="field is-focus">
          <input class="field-input is-focus" id="i2" type="email" value=""/>
          <label class="field-label" for="i2">Lorem electronicus</label>
        </div>
        <p class="field-help">Lorem ipsum dolor sit amet.</p>
      </div>
    </div>
    <div class="panel">
      <div class="state-label">filled</div>
      <div class="group">
        <div class="field is-filled">
          <input class="field-input" id="i3" type="email" value="lorem@ipsum.dev"/>
          <label class="field-label" for="i3">Lorem electronicus</label>
        </div>
        <p class="field-help">Lorem ipsum dolor sit amet.</p>
      </div>
    </div>
    <div class="panel">
      <div class="state-label">error</div>
      <div class="group">
        <div class="field is-filled is-error">
          <input class="field-input" id="i4" type="email" value="not-an-email"/>
          <label class="field-label" for="i4">Lorem electronicus</label>
        </div>
        <p class="field-help" style="color: var(--ds-error);">Lorem ipsum dolor sit amet consectetur.</p>
      </div>
    </div>
  </div>
</body>
</html>
