<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>apple-segmented-controls-001 - Design Reference Library</title><link rel="stylesheet" href="tokens.css"/><style>
.apple-segments { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#fff; color:#1d1d1f; padding:56px 24px; }
.apple-segments__inner { max-width:860px; margin:0 auto; }
.apple-segments h1 { margin:0 0 10px; font-size:40px; line-height:1.1; letter-spacing:0; }
.apple-segments p { margin:0 0 24px; color:#6e6e73; font-size:17px; line-height:1.45; }
.segment-stack { display:grid; gap:18px; }
.segment { display:inline-grid; grid-auto-flow:column; gap:3px; align-items:center; padding:3px; border-radius:12px; background:#e8e8ed; width:max-content; }
.segment.full-width { width:100%; grid-auto-columns:1fr; }
.segment.compact button { min-height:30px; font-size:13px; }
.segment.focus { box-shadow:0 0 0 4px rgba(0,102,204,.16); }
.segment button { min-height:36px; border:0; border-radius:10px; padding:0 16px; background:transparent; color:#1d1d1f; font-size:15px; }
.segment button.selected { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.16); }
.segment button.disabled { opacity:.38; }
.icon-text { display:inline-flex; gap:6px; align-items:center; }
.apple-segments__note { margin-top:22px; color:#86868b; font-size:12px; line-height:1.45; }
@media (max-width:760px) { .apple-segments { padding:40px 18px; } .segment { width:100%; grid-auto-columns:1fr; } }
</style></head><body><section class="apple-segments"><div class="apple-segments__inner"><h1>Segmented controls for compact choices.</h1><p>Soft tracks and raised selected states let related options sit close without visual noise.</p><div class="segment-stack"><div class="segment two-option focus"><button class="selected">selected</button><button>Option</button></div><div class="segment three-option"><button>Day</button><button class="selected">Week</button><button>Month</button></div><div class="segment icon-text"><button><span class="icon-text">grid Grid</span></button><button class="selected"><span class="icon-text">list List</span></button></div><div class="segment compact"><button class="selected">compact</button><button>Standard</button></div><div class="segment full-width"><button class="selected">full-width</button><button class="disabled">disabled</button></div></div><aside class="apple-segments__note" data-resemblio-attribution>Inspired by: Apple (https://www.apple.com). No affiliation with Apple. Independent design reference.</aside></div></section></body></html>
