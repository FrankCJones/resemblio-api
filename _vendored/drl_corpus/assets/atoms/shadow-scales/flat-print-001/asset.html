<!--
  Asset: flat-print-001
  Class: shadow-scales
  Pattern: (none - scales and motion primitives are visualizations, not patterns)
  Inspired by: editorial publications, Information Architects (iA), print tradition
  Notes:
    - No shadows. Cards are demonstrated with borders only; the visual
      hierarchy comes from line, not from light.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>flat-print-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg); color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-6);
    min-height: 100vh;
    display: flex; flex-direction: column; gap: var(--ds-space-4);
  }
  .label {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: var(--ds-space-3);
  }
  .cell { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-2); }
  .swatch {
    width: 88px; height: 88px;
    background: var(--ds-surface);
    border: 1px solid var(--ds-border);
  }
  .cell__label {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
  }
</style>
</head>
<body>
  <div class="label">flat-print-001 · no shadows; borders carry hierarchy</div>
  <div class="grid">
    <div class="cell"><div class="swatch"></div><div class="cell__label">all slots</div></div>
    <div class="cell"><div class="swatch"></div><div class="cell__label">none</div></div>
    <div class="cell"><div class="swatch"></div><div class="cell__label">none</div></div>
    <div class="cell"><div class="swatch"></div><div class="cell__label">none</div></div>
    <div class="cell"><div class="swatch"></div><div class="cell__label">none</div></div>
    <div class="cell"><div class="swatch"></div><div class="cell__label">none</div></div>
  </div>
</body>
</html>
