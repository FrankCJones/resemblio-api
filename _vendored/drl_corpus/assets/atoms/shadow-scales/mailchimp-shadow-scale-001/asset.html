<!--
  Asset: mailchimp-shadow-scale-001
  Class: shadow-scales
  Pattern: (none - token-derived atom)
  Inspired by: Mailchimp (token values from system alphabet)
  Notes:
    - Shadow ramp from sm through xl applied to a common card.
    - Synthesized deterministically from system tokens.css.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>mailchimp-shadow-scale-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-5); }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--ds-space-5); }
  .cell { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-3); }
  .swatch { width: 88px; height: 88px; background: var(--ds-surface); border-radius: var(--ds-radius-md); }
  .cell__label { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="label">mailchimp-shadow-scale-001 - shadow ramp</div>
  <div class="grid">
    <div class="cell"><div class="swatch" style="box-shadow: var(--ds-shadow-sm);"></div><div class="cell__label">sm</div></div>
    <div class="cell"><div class="swatch" style="box-shadow: var(--ds-shadow-md);"></div><div class="cell__label">md</div></div>
    <div class="cell"><div class="swatch" style="box-shadow: var(--ds-shadow-lg);"></div><div class="cell__label">lg</div></div>
    <div class="cell"><div class="swatch" style="box-shadow: var(--ds-shadow-2xl);"></div><div class="cell__label">xl</div></div>
  </div>
</body>
</html>
