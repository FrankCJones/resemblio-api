<!--
  Asset: asterism-001
  Class: dividers
  Pattern: (none - decorative section break)
  Inspired by: print typography tradition, longform essay convention
  Notes: Three centered asterisks; the editorial section break used in print books.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>asterism-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-8); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-5); align-items: center; justify-content: center; }
  .essay { max-width: 56ch; font-size: var(--ds-text-base); line-height: var(--ds-leading-relaxed); color: var(--ds-text); text-align: justify; }
  .asterism { text-align: center; font-family: var(--ds-font-display); font-size: var(--ds-text-xl); color: var(--ds-text-muted); letter-spacing: 0.5em; padding-left: 0.5em; }
</style>
</head>
<body>
  <p class="essay">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus sit amet sapien velit. Curabitur nec libero non nisi convallis fringilla.</p>
  <div class="asterism">* * *</div>
  <p class="essay">Aenean fermentum, magna at suscipit lacinia, eros nibh sodales lacus. Curabitur ac lobortis ipsum, sed convallis erat.</p>
</body>
</html>
