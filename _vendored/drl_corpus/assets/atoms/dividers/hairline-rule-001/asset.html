<!--
  Asset: hairline-rule-001
  Class: dividers
  Pattern: (none)
  Inspired by: modern UI tradition
  Notes: Three weights demonstrated: hairline (default), light, and emphasized.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>hairline-rule-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-5); justify-content: center; }
  .row { display: grid; grid-template-columns: 120px 1fr; gap: var(--ds-space-4); align-items: center; }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  hr { width: 100%; margin: 0; border: 0; }
  hr.hairline { border-top: 1px solid var(--ds-hairline); }
  hr.standard { border-top: 1px solid var(--ds-border); }
  hr.emphasized { border-top: 1px solid var(--ds-text); }
</style>
</head>
<body>
  <div class="row"><span class="label">hairline · hairline</span><hr class="hairline"/></div>
  <div class="row"><span class="label">standard · border</span><hr class="standard"/></div>
  <div class="row"><span class="label">emphasized · text</span><hr class="emphasized"/></div>
</body>
</html>
