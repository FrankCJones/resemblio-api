<!--
  Asset: mono-eyebrow-001
  Class: kickers
  Pattern: mono-eyebrow, kicker-with-rule
  Inspired by: Linear, FrankCJones.com "The Operator" design system
  Notes:
    - Small uppercase mono label with extended tracking, followed by a
      horizontal hairline rule.
    - All values are variables. No inline ornament.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>mono-eyebrow-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-6);
    min-height: 100vh;
    display: grid;
    place-items: center;
  }

  /* The kicker. Mono, uppercase, wider tracking, followed by a hairline
   * rule that extends to a fixed maximum length. The rule is the second
   * signal that says "section marker"; without it, the kicker reads as
   * a metadata label. */
  .kicker {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
    display: inline-flex;
    align-items: center;
    gap: var(--ds-space-3);
  }
  .kicker::after {
    content: "";
    width: 120px;
    height: 1px;
    background: var(--ds-hairline);
  }
</style>
</head>
<body>
  <span class="kicker">section 01 · lorem ipsum</span>
</body>
</html>
