<!--
  Asset: ai-frontier-eyebrow-001
  Class: kickers
  Pattern: mono-eyebrow
  Inspired by: Cursor
  Notes:
    - Compact uppercase sans kicker in the brand's electric accent, sitting
      above a sample headline. The accent color IS the kicker's signal;
      there is no trailing rule.
    - All values are variables. No inline ornament.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ai-frontier-eyebrow-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-6);
    min-height: 100vh;
    display: grid;
    place-items: center;
  }

  /* The block stacks the kicker tightly above a sample headline so the
   * kicker reads as eyebrow rather than a freestanding tag. The kicker
   * itself is sans uppercase in the accent color. The 0.14em tracking
   * is the load-bearing decision that lets a 12px sans read as a label
   * rather than as body copy. */
  .block {
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-3);
    max-width: 640px;
  }
  .kicker {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ds-accent);
    margin: 0;
  }
  .headline {
    font-family: var(--ds-font-display);
    font-size: var(--ds-text-3xl);
    letter-spacing: var(--ds-tracking-tight);
    line-height: var(--ds-leading-tight);
    color: var(--ds-text-strong);
    margin: 0;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="block">
    <p class="kicker">Research</p>
    <h2 class="headline">Lorem ipsum dolor sit amet consectetur adipiscing.</h2>
  </div>
</body>
</html>
