<!--
  Asset: numbered-section-001
  Class: kickers
  Pattern: numbered-section
  Inspired by: editorial section markers, FrankCJones "The Operator"
  Notes: Leading numeral as visual anchor, mono section label, trailing rule.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>numbered-section-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: grid; place-items: center; }
  .kicker { display: flex; align-items: baseline; gap: var(--ds-space-3); }
  .kicker__num { font-family: var(--ds-font-mono); font-size: var(--ds-text-base); color: var(--ds-accent); letter-spacing: 0.04em; }
  .kicker__label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .kicker__rule { width: 120px; height: 1px; background: var(--ds-hairline); }
</style>
</head>
<body>
  <div class="kicker">
    <span class="kicker__num">01.</span>
    <span class="kicker__label">lorem ipsum</span>
    <span class="kicker__rule"></span>
  </div>
</body>
</html>
