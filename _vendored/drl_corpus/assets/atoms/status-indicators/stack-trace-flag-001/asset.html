<!--
  Asset: stack-trace-flag-001
  Class: status-indicators
  Pattern: (none)
  Inspired by: Sentry (stack-trace-as-hero motif; violet/magenta palette on sentry.io)
  Notes:
    - Vertical stack: each row is a service plus its current state.
    - Left edge of each row carries a 3px color band; the band IS the flag.
    - Row dimensions and gaps are variables; the band width is inline ornament.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>stack-trace-flag-001 . Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<!-- Rubik; Sentry's marketing display face. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-10) var(--ds-space-8);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-1);
    background: var(--ds-surface);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    padding: var(--ds-space-2);
    width: 480px;
    box-shadow: var(--ds-shadow-md);
  }

  .stack__title {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-2xs);
    text-transform: uppercase;
    letter-spacing: var(--ds-tracking-wider);
    padding: var(--ds-space-2) var(--ds-space-3) var(--ds-space-1);
  }

  /* Each flag row is the unit. The 3px left band IS the indicator; the rest
   * of the row is metadata. Inline band width chosen because 3px does not
   * map cleanly to any spacing scale step. */
  .flag {
    display: grid;
    grid-template-columns: 3px 1fr auto;
    align-items: center;
    gap: var(--ds-space-3);
    padding: var(--ds-space-3) var(--ds-space-3);
    border-radius: var(--ds-radius-sm);
    background: transparent;
    transition: background var(--ds-duration-fast) var(--ds-ease-standard);
  }
  .flag:hover { background: var(--ds-surface-2); }

  .flag__band {
    width: 3px;
    height: 24px;
    border-radius: var(--ds-radius-full);
    background: var(--ds-text-muted);
  }
  .flag--ok    .flag__band { background: var(--ds-success); }
  .flag--warn  .flag__band { background: var(--ds-warning); }
  .flag--err   .flag__band { background: var(--ds-error); }
  .flag--info  .flag__band { background: var(--ds-info); }

  .flag__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .flag__service {
    color: var(--ds-text);
    font-size: var(--ds-text-base);
    font-weight: 500;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .flag__detail {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-2xs);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .flag__count {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    font-variant-numeric: tabular-nums;
  }
  .flag--err  .flag__count { color: var(--ds-error); }
  .flag--warn .flag__count { color: var(--ds-warning); }
</style>
</head>
<body>
  <div class="stack" role="list" aria-label="Lorem ipsum service status">
    <div class="stack__title">Lorem ipsum services</div>

    <div class="flag flag--ok" role="listitem">
      <span class="flag__band" aria-hidden="true"></span>
      <div class="flag__body">
        <div class="flag__service">Lorem ipsum api</div>
        <div class="flag__detail">operational . 0 errors in last 5m</div>
      </div>
      <span class="flag__count">99.99%</span>
    </div>

    <div class="flag flag--warn" role="listitem">
      <span class="flag__band" aria-hidden="true"></span>
      <div class="flag__body">
        <div class="flag__service">Dolor sit worker</div>
        <div class="flag__detail">elevated latency . p95 1.4s</div>
      </div>
      <span class="flag__count">14</span>
    </div>

    <div class="flag flag--err" role="listitem">
      <span class="flag__band" aria-hidden="true"></span>
      <div class="flag__body">
        <div class="flag__service">Amet consectetur queue</div>
        <div class="flag__detail">connection refused . retrying</div>
      </div>
      <span class="flag__count">231</span>
    </div>

    <div class="flag flag--info" role="listitem">
      <span class="flag__band" aria-hidden="true"></span>
      <div class="flag__body">
        <div class="flag__service">Adipiscing elit cron</div>
        <div class="flag__detail">deploying v1.4.2 . eta 30s</div>
      </div>
      <span class="flag__count">...</span>
    </div>

    <div class="flag flag--ok" role="listitem">
      <span class="flag__band" aria-hidden="true"></span>
      <div class="flag__body">
        <div class="flag__service">Tempor incididunt cache</div>
        <div class="flag__detail">operational . hit rate 94.2%</div>
      </div>
      <span class="flag__count">100%</span>
    </div>
  </div>
</body>
</html>
