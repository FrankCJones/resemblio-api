<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>apple-status-system-001 - Design Reference Library</title><link rel="stylesheet" href="tokens.css"/><style>.apple-status{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#1d1d1f;padding:56px 24px}.apple-status__inner{max-width:860px;margin:0 auto}.status-list{display:grid;gap:12px;margin-top:24px}.status{display:flex;gap:12px;align-items:center;border-radius:18px;padding:16px 18px;background:#fbfbfd;border:1px solid #e8e8ed}.dot{width:10px;height:10px;border-radius:999px}.success .dot{background:#0f8060}.warning .dot{background:#b88e3a}.error .dot{background:#a14438}.info .dot{background:#0066cc}.status span{color:#6e6e73}.apple-status__note{margin-top:22px;color:#86868b;font-size:12px;line-height:1.45}</style></head><body><section class="apple-status"><div class="apple-status__inner"><h1>Status indicators that stay calm.</h1><div class="status-list"><div class="status success"><i class="dot"></i><strong>success</strong><span>Saved locally.</span></div><div class="status warning"><i class="dot"></i><strong>warning</strong><span>Review before publishing.</span></div><div class="status error"><i class="dot"></i><strong>error</strong><span>One field needs attention.</span></div><div class="status info"><i class="dot"></i><strong>info</strong><span>New preview evidence is available.</span></div></div><aside class="apple-status__note" data-resemblio-attribution>Inspired by: Apple (https://www.apple.com). No affiliation with Apple. Independent design reference.</aside></div></section></body></html>
