<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>accent-warm-red-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--ds-space-3); align-items: stretch; }
  .field { display: flex; flex-direction: column; gap: var(--ds-space-2); }
  .field__demo { flex: 1; min-height: 100px; display: grid; place-items: center; font-family: var(--ds-font-mono); font-size: var(--ds-text-sm); border-radius: var(--ds-radius-sm); }
  .demo-field { background: var(--ds-accent); color: var(--ds-bg); }
  .demo-text-on { background: var(--ds-surface); color: var(--ds-accent); border: 1px solid var(--ds-border); }
  .demo-cta { background: var(--ds-surface); display: grid; place-items: center; border: 1px solid var(--ds-border); border-radius: var(--ds-radius-sm); padding: var(--ds-space-3); }
  .demo-cta button { background: var(--ds-accent); color: var(--ds-bg); border: 0; padding: 10px var(--ds-space-5); border-radius: var(--ds-radius-md); font: 500 var(--ds-text-sm) var(--ds-font-body); cursor: pointer; }
  .field__label { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="field"><span class="field__label">field · warm red</span><div class="field__demo demo-field">#C24438</div></div>
  <div class="field"><span class="field__label">text on cream</span><div class="field__demo demo-text-on">accent text</div></div>
  <div class="field"><span class="field__label">cta</span><div class="demo-cta"><button>Read more</button></div></div>
</body>
</html>
