<!--
  Asset: swiss-red-pentagram-001
  Class: swatches
  Pattern: (none)
  Inspired by: Pentagram (pentagram.com)
  Notes:
    - One saturated Swiss red (#E30613) on pure paper white; the studio-portfolio register.
    - The accent slot is the only chroma; every demo context uses it as the single carrier of brand.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>swiss-red-pentagram-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<!-- Helvetica Neue is preferred; system fallback chain handles its absence. No web font needed. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-6);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: var(--ds-space-5);
    align-items: stretch;
  }
  .field { display: flex; flex-direction: column; gap: var(--ds-space-2); }
  .field__label {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .field__demo {
    flex: 1;
    min-height: 140px;
    display: grid;
    place-items: center;
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-sm);
    border-radius: var(--ds-radius-none); /* hard corners; Swiss register. */
  }
  /* Swatch: the accent presented as a full chroma block on the surface. */
  .demo-swatch { background: var(--ds-accent); color: var(--ds-bg); }
  /* Text-on-paper: the accent carrying display type weight against the page surface. */
  .demo-text-on {
    background: var(--ds-bg);
    color: var(--ds-accent);
    border: 1px solid var(--ds-border);
    font-family: var(--ds-font-display);
    font-size: var(--ds-text-2xl);
    font-weight: 700;
    letter-spacing: var(--ds-tracking-tight);
    text-transform: lowercase; /* studio-portfolio convention; the wordmark register. */
  }
  /* CTA: the canonical primary, no radius — Swiss right-angle discipline. */
  .demo-cta {
    background: var(--ds-bg);
    display: grid;
    place-items: center;
    border: 1px solid var(--ds-border);
    padding: var(--ds-space-4);
  }
  .demo-cta button {
    background: var(--ds-accent);
    color: var(--ds-bg);
    border: 0;
    padding: 12px var(--ds-space-6);
    border-radius: var(--ds-radius-none);
    font: 500 var(--ds-text-sm)/1 var(--ds-font-body);
    letter-spacing: var(--ds-tracking-wide);
    text-transform: uppercase;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="field">
    <span class="field__label">swatch &middot; swiss red</span>
    <div class="field__demo demo-swatch">#E30613</div>
  </div>
  <div class="field">
    <span class="field__label">accent on paper</span>
    <div class="field__demo demo-text-on">lorem ipsum</div>
  </div>
  <div class="field">
    <span class="field__label">primary cta</span>
    <div class="demo-cta"><button>Lorem ipsum</button></div>
  </div>
</body>
</html>
