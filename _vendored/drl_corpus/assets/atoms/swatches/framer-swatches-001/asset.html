<!--
  Asset: framer-swatches-001
  Class: swatches
  Pattern: (none - token-derived atom)
  Inspired by: Framer (token values from system alphabet)
  Notes:
    - Three swatches: accent, surface, text. Each shown in role.
    - Synthesized deterministically from system tokens.css.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>framer-swatches-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--ds-space-3); align-items: stretch; }
  .field { display: flex; flex-direction: column; gap: var(--ds-space-2); }
  .field__demo { flex: 1; min-height: 120px; display: grid; place-items: center; font-family: var(--ds-font-mono); font-size: var(--ds-text-sm); border-radius: var(--ds-radius-sm); }
  .demo-accent { background: var(--ds-accent); color: white; }
  .demo-surface { background: var(--ds-surface); color: var(--ds-text); border: 1px solid var(--ds-border); }
  .demo-text { background: var(--ds-bg); color: var(--ds-text); border: 1px solid var(--ds-border); font-family: var(--ds-font-body); font-size: var(--ds-text-xl); }
  .field__label { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="field">
    <span class="field__label">accent</span>
    <div class="field__demo demo-accent">#35E2EB</div>
  </div>
  <div class="field">
    <span class="field__label">surface</span>
    <div class="field__demo demo-surface">#141414</div>
  </div>
  <div class="field">
    <span class="field__label">text</span>
    <div class="field__demo demo-text">#FFFFFF</div>
  </div>
</body>
</html>
