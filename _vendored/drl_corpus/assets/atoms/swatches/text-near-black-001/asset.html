<!--
  Asset: text-near-black-001
  Class: swatches
  Pattern: (none)
  Inspired by: editorial tradition
  Notes: Compares pure black, near-black (#111), and muted gray for reading.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>text-near-black-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--ds-space-3); align-items: stretch; }
  .field { display: flex; flex-direction: column; gap: var(--ds-space-2); }
  .field__label { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .demo { flex: 1; padding: var(--ds-space-4); border: 1px solid var(--ds-border); border-radius: var(--ds-radius-sm); font-size: var(--ds-text-base); line-height: var(--ds-leading-relaxed); }
  .demo--pure { color: #000000; }
  .demo--near { color: #111111; }
  .demo--muted { color: #555555; }
</style>
</head>
<body>
  <div class="field"><span class="field__label">pure · #000</span><div class="demo demo--pure">The quick brown fox jumps over the lazy dog. Reads slightly harsh against pure white.</div></div>
  <div class="field"><span class="field__label">near · #111</span><div class="demo demo--near">The quick brown fox jumps over the lazy dog. Softened by 0x11 across each channel.</div></div>
  <div class="field"><span class="field__label">muted · #555</span><div class="demo demo--muted">The quick brown fox jumps over the lazy dog. Secondary text; too low for body reading.</div></div>
</body>
</html>
