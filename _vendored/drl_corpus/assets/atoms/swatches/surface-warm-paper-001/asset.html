<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>surface-warm-paper-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--ds-space-3); align-items: stretch; }
  .field { display: flex; flex-direction: column; gap: var(--ds-space-2); }
  .field__label { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .demo { flex: 1; min-height: 100px; border-radius: var(--ds-radius-sm); padding: var(--ds-space-3); display: flex; flex-direction: column; justify-content: space-between; }
  .demo--surface { background: var(--ds-bg); border: 1px solid var(--ds-border); }
  .demo--text { background: var(--ds-bg); border: 1px solid var(--ds-border); font-family: var(--ds-font-body); }
  .demo--card { background: var(--ds-bg); border: 1px solid var(--ds-border); display: grid; place-items: center; }
  .card { background: var(--ds-surface); padding: var(--ds-space-4); border-radius: var(--ds-radius-md); box-shadow: var(--ds-shadow-md); width: 80%; text-align: center; font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); }
</style>
</head>
<body>
  <div class="field"><span class="field__label">surface · warm paper</span><div class="demo demo--surface"><span style="font-family:var(--ds-font-mono); font-size:var(--ds-text-xs);">#F5F1EB</span></div></div>
  <div class="field"><span class="field__label">text on surface</span><div class="demo demo--text">The quick brown fox jumps over the lazy dog.</div></div>
  <div class="field"><span class="field__label">card lifted</span><div class="demo demo--card"><div class="card">surface-2 lifted</div></div></div>
</body>
</html>
