<!--
  Asset: triangle-mark-001
  Class: monograms
  Pattern: wordmark-with-mark
  Inspired by: Vercel
  Notes:
    - Equilateral triangle, apex up; filled with currentColor; no stroke, no chrome.
    - The triangle shape and its proportion are inline geometry; color and font surround are tokens.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>triangle-mark-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--ds-space-12);
    padding: var(--ds-space-10) var(--ds-space-8);
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--ds-space-4);
  }
  .state-label {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    text-transform: uppercase;
    letter-spacing: var(--ds-tracking-wider);
  }
  .mark {
    color: var(--ds-text-strong);
    display: inline-block;
  }
  .mark svg {
    display: block;
    fill: currentColor;
  }
  /* favicon size: 16px square render */
  .mark--favicon svg { width: 16px; height: 16px; }
  /* marketing size: 64px square render */
  .mark--display svg { width: 64px; height: 64px; }
  /* paired lockup: mark plus wordmark, mark height matches cap-height */
  .lockup {
    display: inline-flex;
    align-items: center;
    gap: var(--ds-space-2);
    color: var(--ds-text-strong);
    font-family: var(--ds-font-display);
    font-weight: 500;
    font-size: var(--ds-text-xl);
    letter-spacing: var(--ds-tracking-tight);
  }
  .lockup svg { width: 22px; height: 22px; fill: currentColor; }
</style>
</head>
<body>
  <div class="stage">
    <span class="state-label">favicon (16px)</span>
    <span class="mark mark--favicon">
      <!-- viewBox 0 0 60 52 captures the source's equilateral triangle proportion; apex centered above the base. -->
      <svg viewBox="0 0 60 52" aria-label="Lorem"><path d="M30 0 L60 52 L0 52 Z"/></svg>
    </span>
  </div>
  <div class="stage">
    <span class="state-label">marketing (64px)</span>
    <span class="mark mark--display">
      <svg viewBox="0 0 60 52" aria-label="Lorem"><path d="M30 0 L60 52 L0 52 Z"/></svg>
    </span>
  </div>
  <div class="stage">
    <span class="state-label">lockup with wordmark</span>
    <span class="lockup">
      <svg viewBox="0 0 60 52" aria-hidden="true"><path d="M30 0 L60 52 L0 52 Z"/></svg>
      lorem
    </span>
  </div>
</body>
</html>
