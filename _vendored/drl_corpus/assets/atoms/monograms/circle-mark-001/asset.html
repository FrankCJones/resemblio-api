<!--
  Asset: circle-mark-001
  Class: monograms
  Pattern: wordmark-with-mark
  Inspired by: Linear
  Notes:
    - Circular / disc-derived monogram; the shape language is rotational, made
      of arc sweeps inside a 100-unit square.
    - Color and surround tokens are variables; the arc geometry is inline.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>circle-mark-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--ds-space-12);
    padding: var(--ds-space-10) var(--ds-space-8);
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--ds-space-4);
  }
  .state-label {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    text-transform: uppercase;
    letter-spacing: var(--ds-tracking-wider);
  }
  .mark {
    color: var(--ds-text-strong);
    display: inline-block;
  }
  .mark svg {
    display: block;
    fill: currentColor;
  }
  .mark--favicon svg { width: 16px; height: 16px; }
  .mark--display svg { width: 64px; height: 64px; }
  .lockup {
    display: inline-flex;
    align-items: center;
    gap: var(--ds-space-2);
    color: var(--ds-text-strong);
    font-family: var(--ds-font-display);
    font-weight: 500;
    font-size: var(--ds-text-xl);
    letter-spacing: var(--ds-tracking-tight);
  }
  .lockup svg { width: 22px; height: 22px; fill: currentColor; }
</style>
</head>
<body>
  <div class="stage">
    <span class="state-label">favicon (16px)</span>
    <span class="mark mark--favicon">
      <!-- Disc with three concentric arc sweeps; recreates the rotational mass of the source. -->
      <svg viewBox="0 0 100 100" aria-label="Lorem">
        <circle cx="50" cy="50" r="48"/>
        <!-- Inverted arcs subtract to suggest the curving stripes of the source mark. -->
        <path d="M50 6 A 44 44 0 0 1 94 50 L 76 50 A 26 26 0 0 0 50 24 Z" fill="var(--ds-bg)"/>
        <path d="M50 50 A 22 22 0 0 1 28 72 L 28 94 A 44 44 0 0 0 94 50 Z" fill="var(--ds-bg)" opacity="0"/>
      </svg>
    </span>
  </div>
  <div class="stage">
    <span class="state-label">marketing (64px)</span>
    <span class="mark mark--display">
      <svg viewBox="0 0 100 100" aria-label="Lorem">
        <circle cx="50" cy="50" r="48"/>
        <path d="M50 6 A 44 44 0 0 1 94 50 L 76 50 A 26 26 0 0 0 50 24 Z" fill="var(--ds-bg)"/>
      </svg>
    </span>
  </div>
  <div class="stage">
    <span class="state-label">lockup with wordmark</span>
    <span class="lockup">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48"/>
        <path d="M50 6 A 44 44 0 0 1 94 50 L 76 50 A 26 26 0 0 0 50 24 Z" fill="var(--ds-bg)"/>
      </svg>
      lorem
    </span>
  </div>
</body>
</html>
