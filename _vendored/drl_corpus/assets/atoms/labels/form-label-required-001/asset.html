<!--
  Asset: form-label-required-001
  Class: labels
  Pattern: label-above
  Inspired by: Linear
  Notes:
    - Quiet sans label sits above a paired field; an asterisk in accent color marks required.
    - Label color and tracking come from tokens; the asterisk spacing is inline because it is a one-off ornament.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>form-label-required-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<!-- Linear ships Inter Variable; system Inter is the closest free fallback. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
    line-height: var(--ds-leading-normal);
    min-height: 100vh;
    padding: var(--ds-space-10) var(--ds-space-8);
  }
  .stage {
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-6);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-2);
  }
  .form-label {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    font-weight: 400;
    letter-spacing: var(--ds-tracking-normal);
    line-height: 1.3;
  }
  /* inline: 4px gap before the asterisk is hand-tuned to sit close to the word without merging with it */
  .req {
    color: var(--ds-accent);
    margin-left: 4px;
    font-weight: 500;
  }
  .field-input {
    background: var(--ds-surface);
    color: var(--ds-text-strong);
    border: 0.8px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    height: 40px;
    padding: 0 10px; /* inline: matches Linear's input row padding */
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    letter-spacing: var(--ds-tracking-normal);
    outline: none;
  }
  .field-input::placeholder { color: var(--ds-text-muted); }
  .field-textarea {
    background: var(--ds-surface);
    color: var(--ds-text-strong);
    border: 0.8px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    padding: 10px;
    min-height: 96px;
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    letter-spacing: var(--ds-tracking-normal);
    resize: vertical;
    outline: none;
  }
  .legend {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    margin-bottom: var(--ds-space-4);
  }
  .footnote {
    color: var(--ds-text-muted);
    font-size: var(--ds-text-xs);
    margin-top: var(--ds-space-4);
    border-top: 1px solid var(--ds-hairline);
    padding-top: var(--ds-space-3);
  }
  .footnote .req { color: var(--ds-accent); }
</style>
</head>
<body>
  <div class="stage">
    <div class="legend">Lorem ipsum form</div>
    <div class="field">
      <label class="form-label" for="r1">Full name<span class="req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
      <input class="field-input" id="r1" type="text" placeholder="Lorem ipsum"/>
    </div>
    <div class="field">
      <label class="form-label" for="r2">Work email<span class="req" aria-hidden="true">*</span></label>
      <input class="field-input" id="r2" type="email" placeholder="lorem@ipsum.dolor"/>
    </div>
    <div class="field">
      <label class="form-label" for="r3">Company</label>
      <input class="field-input" id="r3" type="text" placeholder="Lorem ipsum dolor"/>
    </div>
    <div class="field">
      <label class="form-label" for="r4">Notes<span class="req" aria-hidden="true">*</span></label>
      <textarea class="field-textarea" id="r4" placeholder="Lorem ipsum dolor sit amet, consectetur adipiscing elit."></textarea>
    </div>
    <p class="footnote"><span class="req" aria-hidden="true">*</span> Sit amet consectetur required.</p>
  </div>
</body>
</html>
