<!--
  Asset: webflow-radius-scale-001
  Class: radius-scales
  Pattern: (none - token-derived atom)
  Inspired by: Webflow (token values from system alphabet)
  Notes:
    - Radius ramp from none through full applied to a common swatch.
    - Synthesized deterministically from system tokens.css.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>webflow-radius-scale-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-3); }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: var(--ds-space-3); }
  .cell { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-2); }
  .swatch { width: 80px; height: 80px; background: var(--ds-accent); }
  .cell__label { font-family: var(--ds-font-mono); font-size: var(--ds-text-2xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="label">webflow-radius-scale-001 - radius ramp</div>
  <div class="grid">
    <div class="cell"><div class="swatch" style="border-radius: var(--ds-radius-none);"></div><div class="cell__label">none - 0</div></div>
    <div class="cell"><div class="swatch" style="border-radius: var(--ds-radius-xs);"></div><div class="cell__label">xs - 2px</div></div>
    <div class="cell"><div class="swatch" style="border-radius: var(--ds-radius-sm);"></div><div class="cell__label">sm - 4px</div></div>
    <div class="cell"><div class="swatch" style="border-radius: var(--ds-radius-md);"></div><div class="cell__label">md - 8px</div></div>
    <div class="cell"><div class="swatch" style="border-radius: var(--ds-radius-lg);"></div><div class="cell__label">lg - 16px</div></div>
    <div class="cell"><div class="swatch" style="border-radius: var(--ds-radius-full);"></div><div class="cell__label">full - 9999px</div></div>
  </div>
</body>
</html>
