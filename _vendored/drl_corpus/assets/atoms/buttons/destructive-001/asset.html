<!--
  Asset: destructive-001
  Class: buttons
  Pattern: primary-square
  Inspired by: delete/destroy action convention
  Notes: Red fill primary used only for destructive actions. Two-step pattern shown (default and confirm).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>destructive-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: var(--ds-space-5); flex-wrap: wrap; }
  .btn { appearance: none; border: 0; background: var(--ds-error); color: var(--ds-bg); font-family: var(--ds-font-body); font-size: var(--ds-text-sm); font-weight: 500; padding: 10px var(--ds-space-5); border-radius: var(--ds-radius-md); cursor: pointer; box-shadow: var(--ds-shadow-sm); transition: background var(--ds-duration-instant) var(--ds-ease-standard); }
  .btn:hover { background: var(--ds-accent-2); }
  .btn--ghost { background: transparent; color: var(--ds-error); border: 1px solid var(--ds-error); box-shadow: none; }
  .btn--ghost:hover { background: var(--ds-error); color: var(--ds-bg); }
  .group { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-2); }
  .state-label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="group"><span class="state-label">destructive primary</span><button type="button" class="btn">Delete account</button></div>
  <div class="group"><span class="state-label">destructive ghost</span><button type="button" class="btn btn--ghost">Delete account</button></div>
</body>
</html>
