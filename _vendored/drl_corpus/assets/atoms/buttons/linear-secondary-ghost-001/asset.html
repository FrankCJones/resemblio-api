<!--
  Asset: linear-secondary-ghost-001
  Class: buttons
  Pattern: ghost-button
  Inspired by: Linear
  Notes:
    - The binary counterpart to the primary white pill: 5% white fill, 8%
      white hairline, label in cool off-white. Same pill geometry, opposite
      affordance weight.
    - Variables: every color, size, spacing, radius, motion value.
    - Inline ornament: none. The focus ring uses the token-defined lifted
      indigo to stay visible against both the button and the bg.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>linear-secondary-ghost-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;510;600&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-5);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--ds-space-4);
    flex-wrap: wrap;
  }
  .btn {
    appearance: none; cursor: pointer;
    background: var(--ds-surface);
    color: var(--ds-text);
    border: 0.8px solid var(--ds-border);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    font-weight: 510;
    letter-spacing: var(--ds-tracking-normal);
    padding: 0 var(--ds-space-3);
    height: 32px;
    border-radius: var(--ds-radius-full);
    transition:
      background var(--ds-duration-instant) var(--ds-ease-standard),
      color var(--ds-duration-instant) var(--ds-ease-standard);
  }
  .btn:hover { background: var(--ds-surface-2); color: var(--ds-text-strong); }
  .btn:focus-visible { outline: 2px solid var(--ds-focus-ring); outline-offset: 2px; }
  .btn:active { background: var(--ds-surface); }
  .btn[disabled] { color: var(--ds-text-muted); cursor: not-allowed; opacity: 0.6; }
</style>
</head>
<body>
  <button class="btn">Lorem ipsum</button>
  <button class="btn">Dolor sit amet</button>
  <button class="btn" disabled>Consectetur</button>
</body>
</html>
