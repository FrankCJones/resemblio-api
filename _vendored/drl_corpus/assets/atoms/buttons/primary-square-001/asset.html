<!--
  Asset: primary-square-001
  Class: buttons
  Pattern: primary-square
  Inspired by: B2B fintech, professional services
  Notes: Squared-corner primary button (md radius). Four states.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>primary-square-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: var(--ds-space-4); flex-wrap: wrap; }
  .btn { appearance: none; border: 0; background: var(--ds-accent); color: var(--ds-bg); font-family: var(--ds-font-body); font-size: var(--ds-text-sm); font-weight: 500; padding: 10px var(--ds-space-5); border-radius: var(--ds-radius-md); cursor: pointer; box-shadow: var(--ds-shadow-sm); transition: background var(--ds-duration-instant) var(--ds-ease-standard); }
  .btn:hover { background: var(--ds-accent-2); }
  .btn[disabled] { background: var(--ds-border); color: var(--ds-text-muted); cursor: not-allowed; box-shadow: none; }
  .group { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-2); }
  .state-label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="group"><span class="state-label">rest</span><button type="button" class="btn">Continue</button></div>
  <div class="group"><span class="state-label">hover</span><button type="button" class="btn" style="background: var(--ds-accent-2);">Continue</button></div>
  <div class="group"><span class="state-label">focus</span><button type="button" class="btn" style="outline: 2px solid var(--ds-focus-ring); outline-offset: 2px;">Continue</button></div>
  <div class="group"><span class="state-label">disabled</span><button type="button" class="btn" disabled>Continue</button></div>
</body>
</html>
