<!--
  Asset: ghost-bordered-001
  Class: buttons
  Pattern: ghost-button
  Inspired by: secondary affordance tradition
  Notes: Transparent fill, dark border, fills on hover. Four states.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ghost-bordered-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-5); min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: var(--ds-space-4); flex-wrap: wrap; }
  .btn { appearance: none; background: transparent; color: var(--ds-text); border: 1px solid var(--ds-text); font-family: var(--ds-font-body); font-size: var(--ds-text-sm); font-weight: 500; padding: 10px var(--ds-space-5); border-radius: var(--ds-radius-md); cursor: pointer; transition: background var(--ds-duration-instant) var(--ds-ease-standard), color var(--ds-duration-instant) var(--ds-ease-standard); }
  .btn:hover { background: var(--ds-text); color: var(--ds-bg); }
  .btn[disabled] { border-color: var(--ds-text-muted); color: var(--ds-text-muted); cursor: not-allowed; }
  .btn[disabled]:hover { background: transparent; color: var(--ds-text-muted); }
  .group { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-2); }
  .state-label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
</style>
</head>
<body>
  <div class="group"><span class="state-label">rest</span><button type="button" class="btn">Learn more</button></div>
  <div class="group"><span class="state-label">hover</span><button type="button" class="btn" style="background: var(--ds-text); color: var(--ds-bg);">Learn more</button></div>
  <div class="group"><span class="state-label">focus</span><button type="button" class="btn" style="outline: 2px solid var(--ds-focus-ring); outline-offset: 2px;">Learn more</button></div>
  <div class="group"><span class="state-label">disabled</span><button type="button" class="btn" disabled>Learn more</button></div>
</body>
</html>
