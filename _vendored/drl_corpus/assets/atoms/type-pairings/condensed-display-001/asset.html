<!--
  Asset: condensed-display-001
  Class: type-pairings
  Pattern: serif-display-sans-body, mono-utility-pair
  Inspired by: editorial display, sports / agency portfolio sites
  Notes: Condensed display sans for hero, neutral sans body, mono metadata.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>condensed-display-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-4); }
  .kicker { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .display { font-family: var(--ds-font-display); font-size: var(--ds-text-6xl); font-weight: 700; line-height: var(--ds-leading-tight); letter-spacing: var(--ds-tracking-normal); margin: 0; text-transform: uppercase; }
  .body { font-family: var(--ds-font-body); font-size: var(--ds-text-lg); line-height: var(--ds-leading-normal); color: var(--ds-text-muted); max-width: 56ch; margin: 0; }
  .meta-row { display: flex; gap: var(--ds-space-5); font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-text-muted); letter-spacing: 0.04em; }
  .meta-row b { color: var(--ds-text); font-weight: 500; }
</style>
</head>
<body>
  <span class="kicker">type pairing · condensed-display-001</span>
  <h1 class="display">Lorem Ipsum Dolor</h1>
  <p class="body">Consectetur adipiscing elit. Vivamus sit amet sapien velit. Curabitur nec libero non nisi convallis fringilla.</p>
  <div class="meta-row">
    <span>display · <b>Archivo Narrow 700</b></span>
    <span>body · <b>Inter 400</b></span>
    <span>mono · <b>JetBrains Mono</b></span>
  </div>
</body>
</html>
