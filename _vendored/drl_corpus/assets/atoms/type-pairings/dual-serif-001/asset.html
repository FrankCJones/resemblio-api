<!--
  Asset: dual-serif-001
  Class: type-pairings
  Pattern: serif-display-sans-body, mono-utility-pair
  Inspired by: editorial publication design
  Notes: Two serifs: one for display, one for reading. No sans-serif at all.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>dual-serif-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Newsreader:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-4); font-optical-sizing: auto; }
  .kicker { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .display { font-family: var(--ds-font-display); font-size: var(--ds-text-5xl); font-weight: 600; line-height: var(--ds-leading-tight); letter-spacing: var(--ds-tracking-tight); margin: 0; }
  .display em { font-style: italic; color: var(--ds-accent); font-weight: 500; }
  .body { font-family: var(--ds-font-body); font-size: var(--ds-text-lg); line-height: var(--ds-leading-relaxed); color: var(--ds-text); max-width: 56ch; margin: 0; }
  .body em { font-style: italic; }
  .meta-row { display: flex; gap: var(--ds-space-5); font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-text-muted); letter-spacing: 0.04em; }
  .meta-row b { color: var(--ds-text); font-weight: 500; }
</style>
</head>
<body>
  <span class="kicker">type pairing · dual-serif-001</span>
  <h1 class="display">Lorem ipsum <em>dolor sit</em> amet.</h1>
  <p class="body">Consectetur adipiscing elit. <em>Vivamus</em> sit amet sapien velit. Curabitur nec libero non nisi convallis fringilla. Aenean fermentum, magna at suscipit lacinia.</p>
  <div class="meta-row">
    <span>display · <b>Fraunces</b></span>
    <span>body · <b>Newsreader</b></span>
    <span>mono · <b>JetBrains Mono</b></span>
  </div>
</body>
</html>
