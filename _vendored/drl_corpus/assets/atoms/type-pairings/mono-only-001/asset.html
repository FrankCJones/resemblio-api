<!--
  Asset: mono-only-001
  Class: type-pairings
  Pattern: single-typeface-system
  Inspired by: GitHub Copilot brand, terminal aesthetics, command-line tooling
  Notes:
    - One monospace family across every type slot. The contract is honored
      structurally; the character is the discipline itself.
    - Accent uses terminal green to commit to the register.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>mono-only-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg); color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-6);
    min-height: 100vh;
    display: flex; flex-direction: column; gap: var(--ds-space-4);
  }
  .kicker {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider); text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .display {
    font-family: var(--ds-font-display);
    font-size: var(--ds-text-4xl);
    font-weight: 700;
    line-height: var(--ds-leading-tight);
    letter-spacing: var(--ds-tracking-tight);
    margin: 0;
  }
  .display em { font-style: normal; color: var(--ds-accent); }
  .body {
    font-family: var(--ds-font-body); font-size: var(--ds-text-base);
    line-height: var(--ds-leading-normal);
    color: var(--ds-text); max-width: 64ch; margin: 0;
    letter-spacing: var(--ds-tracking-normal);
  }
  .prompt::before {
    content: "$ ";
    color: var(--ds-accent);
    /* Inline ornament: terminal prompt prefix. Asset-specific character. */
  }
</style>
</head>
<body>
  <span class="kicker">type pairing · mono-only-001</span>
  <h1 class="display"><em>./</em>lorem-ipsum</h1>
  <p class="body prompt">Consectetur adipiscing elit. Vivamus sit amet sapien velit. Curabitur nec libero non nisi convallis fringilla.</p>
  <p class="body">All four type slots resolve to <em>JetBrains Mono</em>. The discipline is the discipline.</p>
</body>
</html>
