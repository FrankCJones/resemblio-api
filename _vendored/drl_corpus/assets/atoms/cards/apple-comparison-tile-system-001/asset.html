<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>apple-comparison-tile-system-001 - Design Reference Library</title><link rel="stylesheet" href="tokens.css"/><style>.apple-compare{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:56px 24px}.apple-compare__inner{max-width:980px;margin:0 auto}.apple-compare h1{font-size:44px;line-height:1.08;letter-spacing:0;margin:0 0 10px}.side-by-side{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px}.tile{background:#fff;border:1px solid #e8e8ed;border-radius:24px;padding:24px}.tile.selected{border-color:#0066cc;box-shadow:0 0 0 4px rgba(0,102,204,.12)}.spec-row{display:flex;justify-content:space-between;border-top:1px solid #e8e8ed;padding:12px 0;color:#515154}.apple-compare__note{margin-top:22px;color:#86868b;font-size:12px;line-height:1.45}@media(max-width:760px){.side-by-side{grid-template-columns:1fr}.apple-compare h1{font-size:34px}}</style></head><body><section class="apple-compare"><div class="apple-compare__inner"><h1>Comparison tiles for clear choices.</h1><p>Side-by-side options use quiet borders and selected state clarity.</p><div class="side-by-side"><article class="tile selected"><h2>Core One</h2><div class="spec-row"><span>Capacity</span><strong>Standard</strong></div><div class="spec-row"><span>Finish</span><strong>Light</strong></div></article><article class="tile"><h2>Aura Studio</h2><div class="spec-row"><span>Capacity</span><strong>Expanded</strong></div><div class="spec-row"><span>Finish</span><strong>Dark</strong></div></article></div><aside class="apple-compare__note" data-resemblio-attribution>Inspired by: Apple (https://www.apple.com). No affiliation with Apple. Independent design reference.</aside></div></section></body></html>
