<!--
  Asset: soft-elevation-001
  Class: cards
  Pattern: (none)
  Inspired by: Linear
  Notes:
    - Soft-elevation card on dark: 1px ring plus a wide diffuse drop.
    - Hover transitions shadow only; transform is intentionally avoided so
      the card stays optically anchored. Both shadow stops are contract
      tokens; the lift is just --ds-shadow-sm to --ds-shadow-md.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>soft-elevation-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-10);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--ds-surface);
    border: 0.8px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    box-shadow: var(--ds-shadow-sm);
    padding: var(--ds-space-6);
    max-width: 420px;
    width: 100%;
    transition: box-shadow var(--ds-duration-normal) var(--ds-ease-standard);
  }
  .card:hover { box-shadow: var(--ds-shadow-md); }
  .card__title {
    font-size: var(--ds-text-xl);
    font-weight: 600;
    letter-spacing: var(--ds-tracking-tight);
    line-height: var(--ds-leading-snug);
    color: var(--ds-text-strong);
    margin: 0 0 var(--ds-space-3);
  }
  .card__body {
    font-size: var(--ds-text-base);
    line-height: var(--ds-leading-normal);
    color: var(--ds-text-muted);
    margin: 0 0 var(--ds-space-5);
  }
  .card__link {
    font-size: var(--ds-text-sm);
    color: var(--ds-accent);
    text-decoration: none;
    font-weight: 500;
  }
  .card__link:hover { color: var(--ds-accent-2); }
</style>
</head>
<body>
  <article class="card">
    <h2 class="card__title">Lorem ipsum dolor sit amet</h2>
    <p class="card__body">Consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim.</p>
    <a class="card__link" href="#">Lorem ipsum &rarr;</a>
  </article>
</body>
</html>
