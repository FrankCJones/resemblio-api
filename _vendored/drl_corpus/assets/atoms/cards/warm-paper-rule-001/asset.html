<!--
  Asset: warm-paper-rule-001
  Class: cards
  Pattern: paper-and-ink
  Inspired by: Notion
  Notes:
    - Warm-paper card: cream surface, one 0.8px hairline, no drop shadow.
    - The internal section rule under the kicker is inline ornament: it
      reinforces the editorial register but is not a contract slot worth
      a token; an asset that wants the rule declares it inline.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>warm-paper-rule-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-10);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--ds-surface);
    border: 0.8px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    box-shadow: var(--ds-shadow-sm);
    padding: var(--ds-space-5);
    max-width: 340px;
    width: 100%;
  }
  .card__kicker {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
    margin: 0 0 var(--ds-space-3);
  }
  /* Inline ornament: a hairline rule under the kicker; reinforces the
     editorial register without earning a contract slot. */
  .card__rule {
    border: 0;
    border-top: 1px solid var(--ds-hairline);
    margin: 0 0 var(--ds-space-3);
  }
  .card__title {
    font-family: var(--ds-font-accent);
    font-size: var(--ds-text-xl);
    line-height: var(--ds-leading-snug);
    color: var(--ds-text-strong);
    margin: 0 0 var(--ds-space-3);
    font-weight: 500;
  }
  .card__body {
    font-size: var(--ds-text-base);
    line-height: var(--ds-leading-relaxed);
    color: var(--ds-text-muted);
    margin: 0;
  }
</style>
</head>
<body>
  <article class="card">
    <p class="card__kicker">Lorem ipsum</p>
    <hr class="card__rule" />
    <h2 class="card__title">Dolor sit amet consectetur adipiscing</h2>
    <p class="card__body">Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua, ut enim ad minim veniam.</p>
  </article>
</body>
</html>
