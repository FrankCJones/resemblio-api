<!--
  Asset: bento-tile-001
  Class: cards
  Pattern: bento-grid
  Inspired by: Pitch
  Notes:
    - Bento-grid tile: white surface, 20px radius, cool slate shadow.
    - The contract handles the lift (--ds-shadow-sm) and the radius
      (--ds-radius-lg); the surface and the shadow tint are the asset's
      transferable mechanic.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>bento-tile-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-10);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile {
    background: var(--ds-surface);
    border-radius: var(--ds-radius-lg);
    box-shadow: var(--ds-shadow-sm);
    padding: var(--ds-space-5);
    max-width: 320px;
    width: 100%;
    transition: box-shadow var(--ds-duration-normal) var(--ds-ease-standard);
  }
  .tile:hover { box-shadow: var(--ds-shadow-md); }
  .tile__kicker {
    font-size: var(--ds-text-xs);
    font-weight: 600;
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-accent);
    margin: 0 0 var(--ds-space-3);
  }
  .tile__title {
    font-size: var(--ds-text-lg);
    font-weight: 600;
    line-height: var(--ds-leading-snug);
    letter-spacing: var(--ds-tracking-tight);
    color: var(--ds-text-strong);
    margin: 0 0 var(--ds-space-2);
  }
  .tile__body {
    font-size: var(--ds-text-sm);
    line-height: var(--ds-leading-normal);
    color: var(--ds-text-muted);
    margin: 0;
  }
</style>
</head>
<body>
  <article class="tile">
    <p class="tile__kicker">Lorem ipsum</p>
    <h2 class="tile__title">Dolor sit amet consectetur</h2>
    <p class="tile__body">Adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
  </article>
</body>
</html>
