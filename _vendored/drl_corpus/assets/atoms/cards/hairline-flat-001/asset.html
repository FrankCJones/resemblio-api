<!--
  Asset: hairline-flat-001
  Class: cards
  Pattern: (none)
  Inspired by: Vercel
  Notes:
    - Hairline-flat card: white surface, 1px neutral ring, no drop shadow.
    - The ring is delivered as box-shadow (--ds-shadow-sm) rather than a
      border so corner radius stays crisp; the rest is contract tokens.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>hairline-flat-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Inter as system-friendly stand-in for Geist; matches the asset's modern sans register. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-10);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .card {
    background: var(--ds-surface);
    border-radius: var(--ds-radius-md);
    box-shadow: var(--ds-shadow-sm);
    padding: var(--ds-space-8) var(--ds-space-6);
    max-width: 360px;
    width: 100%;
  }
  .card__kicker {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
    margin: 0 0 var(--ds-space-3);
  }
  .card__title {
    font-size: var(--ds-text-2xl);
    font-weight: 600;
    letter-spacing: var(--ds-tracking-tight);
    line-height: var(--ds-leading-snug);
    color: var(--ds-text-strong);
    margin: 0 0 var(--ds-space-4);
  }
  .card__body {
    font-size: var(--ds-text-base);
    line-height: var(--ds-leading-normal);
    color: var(--ds-text-muted);
    margin: 0 0 var(--ds-space-5);
  }
  .card__link {
    font-size: var(--ds-text-sm);
    color: var(--ds-accent);
    text-decoration: none;
    font-weight: 500;
  }
  .card__link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <article class="card">
    <p class="card__kicker">Lorem ipsum</p>
    <h2 class="card__title">Dolor sit amet consectetur</h2>
    <p class="card__body">Adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam.</p>
    <a class="card__link" href="#">Lorem ipsum &rarr;</a>
  </article>
</body>
</html>
