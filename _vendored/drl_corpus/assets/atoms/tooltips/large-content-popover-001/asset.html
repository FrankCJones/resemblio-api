<!--
  Asset: large-content-popover-001
  Class: tooltips
  Pattern: (none)
  Inspired by: Vercel
  Notes:
    - Larger popover closer to a mini card: a title row, a body paragraph, and a trailing link with an arrow.
    - Surface, radius, and the layered hairline-plus-shadow recipe are token-driven; the internal 280px max-width and the arrow icon glyph are inline as the popover's specific spatial recipe.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>large-content-popover-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<!-- Vercel ships Geist; system sans fallback chain in tokens.css. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
    line-height: var(--ds-leading-normal);
    min-height: 100vh;
    padding: var(--ds-space-12) var(--ds-space-8);
  }
  .stage {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-10);
    align-items: center;
  }
  .label {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wide);
    text-transform: uppercase;
  }
  /* Trigger: link or word with dotted underline that opens the popover. */
  .trigger {
    color: var(--ds-text);
    /* inline: dotted underline at 1px offset; the standard hover-popover affordance */
    text-decoration: underline dotted var(--ds-text-muted);
    text-underline-offset: 2px;
    cursor: default;
    position: relative;
    display: inline-block;
  }
  /* Popover: 280px max, title + body + link */
  .popover {
    position: absolute;
    /* inline: 12px gap below the trigger; popovers below by default */
    top: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ds-surface);
    color: var(--ds-text);
    border-radius: var(--ds-radius-md);
    box-shadow: var(--ds-shadow-lg);
    /* inline: popover width 280px, the Vercel mini-card measure */
    width: 280px;
    padding: var(--ds-space-3) var(--ds-space-4) var(--ds-space-3);
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-2);
    text-align: left;
    pointer-events: auto;
    z-index: 2;
  }
  .popover-title {
    font-size: var(--ds-text-base);
    font-weight: 600;
    letter-spacing: var(--ds-tracking-tight);
    color: var(--ds-text-strong);
  }
  .popover-body {
    font-size: var(--ds-text-sm);
    color: var(--ds-text-muted);
    line-height: var(--ds-leading-normal);
    margin: 0;
  }
  .popover-link {
    margin-top: var(--ds-space-1);
    color: var(--ds-accent);
    font-size: var(--ds-text-sm);
    font-weight: 500;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: var(--ds-space-1);
    align-self: flex-start;
  }
  .popover-link:hover { text-decoration: underline; }
  .popover-link svg { width: 12px; height: 12px; }
  /* Body paragraph context */
  .paragraph {
    max-width: 520px;
    font-size: var(--ds-text-lg);
    line-height: var(--ds-leading-relaxed);
    color: var(--ds-text);
    text-align: left;
  }
  .demo-block { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-6); position: relative; }
</style>
</head>
<body>
  <div class="stage">
    <div class="label">Lorem popover ipsum</div>

    <div class="demo-block">
      <p class="paragraph">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit.
        Sed do eiusmod tempor incididunt ut <span class="trigger" aria-describedby="pop-1">labore et dolore<span class="popover" id="pop-1" role="tooltip">
          <span class="popover-title">Lorem definition</span>
          <span class="popover-body">Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</span>
          <a class="popover-link" href="#">
            Read the docs
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 9l6-6M5 3h4v4"/>
            </svg>
          </a>
        </span></span> magna aliqua.
      </p>
    </div>
  </div>
</body>
</html>
