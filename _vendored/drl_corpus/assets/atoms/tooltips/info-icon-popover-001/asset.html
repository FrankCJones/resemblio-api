<!--
  Asset: info-icon-popover-001
  Class: tooltips
  Pattern: (none)
  Inspired by: Anthropic
  Notes:
    - Click-to-reveal popover triggered by a small circular (i) icon; serif body, sans title, warm cream surface.
    - Surface, ink, accent terracotta, and radius are token-driven; the 18px icon target and the 16px close affordance position are inline as the popover's specific geometry.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>info-icon-popover-001 - Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<!-- Anthropic ships custom anthropicSerif + anthropicSans; system serif/sans fallbacks in tokens.css. -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
    line-height: var(--ds-leading-relaxed);
    min-height: 100vh;
    padding: var(--ds-space-12) var(--ds-space-8);
  }
  .stage {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-10);
  }
  .label {
    color: var(--ds-text-muted);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-2xs);
    letter-spacing: var(--ds-tracking-wide);
    text-transform: uppercase;
  }
  /* Form-row context: a label with an info icon next to it. */
  .field {
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-2);
    position: relative;
  }
  .field-label-row {
    display: inline-flex;
    align-items: center;
    gap: var(--ds-space-2);
    font-family: var(--ds-font-accent);
    font-size: var(--ds-text-sm);
    font-weight: 500;
    color: var(--ds-text);
  }
  .info-trigger {
    background: transparent;
    border: 0;
    padding: 0;
    cursor: default;
    color: var(--ds-text-muted);
    /* inline: 18px circular icon hit target */
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .info-trigger svg { width: 18px; height: 18px; }
  .info-trigger:hover { color: var(--ds-accent); }
  /* Field input frame stand-in */
  .field-input {
    background: var(--ds-surface);
    border: 0.8px solid var(--ds-border);
    border-radius: var(--ds-radius-sm);
    padding: var(--ds-space-3) var(--ds-space-4);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
  }
  /* Popover */
  .popover {
    position: absolute;
    /* inline: anchor below the info icon; left of the icon by 4px to overlap nicely */
    top: 30px;
    left: 100px;
    background: var(--ds-surface);
    color: var(--ds-text);
    border: 0.8px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    box-shadow: var(--ds-shadow-lg);
    /* inline: popover width 280px */
    width: 280px;
    padding: var(--ds-space-4);
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-2);
    z-index: 2;
  }
  .popover-title {
    font-family: var(--ds-font-accent);
    font-size: var(--ds-text-base);
    font-weight: 600;
    color: var(--ds-text-strong);
    letter-spacing: var(--ds-tracking-tight);
    line-height: var(--ds-leading-snug);
  }
  .popover-body {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    color: var(--ds-text);
    line-height: var(--ds-leading-normal);
    margin: 0;
  }
  /* Close button: sits at top-right corner of popover. */
  .popover-close {
    position: absolute;
    /* inline: 8px from the corner; small enough to feel like a close affordance not a button */
    top: 8px;
    right: 8px;
    background: transparent;
    border: 0;
    color: var(--ds-text-muted);
    width: 20px;
    height: 20px;
    border-radius: var(--ds-radius-full);
    cursor: default;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .popover-close svg { width: 12px; height: 12px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="label">Lorem info popover</div>

    <div class="field">
      <div class="field-label-row">
        Lorem ipsum field
        <button class="info-trigger" type="button" aria-describedby="info-1" aria-label="More information">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="9" r="7.2"/>
            <path d="M9 8v4.5M9 6v0.1" stroke-width="1.6"/>
          </svg>
        </button>
      </div>
      <div class="field-input">Dolor sit amet</div>

      <div class="popover" id="info-1" role="tooltip">
        <span class="popover-title">Lorem ipsum dolor</span>
        <p class="popover-body">Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam.</p>
        <button class="popover-close" type="button" aria-label="Close">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3l6 6M9 3l-6 6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
