<!--
  Asset: stroke-line-uniform-001
  Class: icons
  Pattern: (none)
  Inspired by: Linear (linear.app/features), Lucide / Phosphor convention
  Notes:
    - Stroke-line icons at uniform 1.75px weight, round caps and joins, currentColor.
    - Sizing token is inline (18px); icon size sits between contract spacing steps so it stays an inline literal.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>stroke-line-uniform-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-10);
    min-height: 100vh;
  }
  .frame {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    gap: var(--ds-space-8);
  }
  h1 {
    font-size: var(--ds-text-lg);
    letter-spacing: var(--ds-tracking-tight);
    color: var(--ds-text-strong);
    margin: 0 0 var(--ds-space-2);
    font-weight: 500;
  }
  p.lead {
    color: var(--ds-text-muted);
    font-size: var(--ds-text-sm);
    margin: 0;
  }
  /* Icons inherit color from parent. 18px is the native render Linear uses for icon-button glyphs. */
  .icon {
    width: 18px;
    height: 18px;
    color: var(--ds-text-muted);
    flex-shrink: 0;
    transition: color var(--ds-duration-fast) var(--ds-ease-standard);
  }
  .icon-row {
    display: flex;
    gap: var(--ds-space-5);
    align-items: center;
    padding: var(--ds-space-4);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    background: var(--ds-surface);
  }
  .label-row { display: grid; gap: var(--ds-space-3); }
  .label-row li {
    display: flex;
    align-items: center;
    gap: var(--ds-space-3);
    color: var(--ds-text);
    font-size: var(--ds-text-sm);
    list-style: none;
  }
  .label-row li:hover .icon { color: var(--ds-text-strong); }
  ul { margin: 0; padding: 0; }
</style>
</head>
<body>
  <main class="frame">
    <header>
      <h1>Lorem ipsum dolor sit</h1>
      <p class="lead">Consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</p>
    </header>

    <section class="icon-row" aria-label="Toolbar example">
      <!-- search -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Search">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <!-- settings -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Settings">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4.8a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.4a7 7 0 0 0-2 1.2l-2.4-.8-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-.8a7 7 0 0 0 2 1.2l.5 2.4h4l.5-2.4a7 7 0 0 0 2-1.2l2.4.8 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/>
      </svg>
      <!-- plus -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Add">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <!-- chevron right -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Next">
        <path d="m9 6 6 6-6 6"/>
      </svg>
      <!-- close -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Close">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
      <!-- check -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Done">
        <path d="m5 12 5 5 9-11"/>
      </svg>
    </section>

    <ul class="label-row">
      <li>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>
        </svg>
        <span>Lorem ipsum dolor sit amet</span>
      </li>
      <li>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
        </svg>
        <span>Consectetur adipiscing elit</span>
      </li>
      <li>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>
        </svg>
        <span>Sed do eiusmod tempor incididunt</span>
      </li>
    </ul>
  </main>
</body>
</html>
