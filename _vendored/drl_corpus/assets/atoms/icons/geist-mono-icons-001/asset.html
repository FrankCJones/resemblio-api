<!--
  Asset: geist-mono-icons-001
  Class: icons
  Pattern: (none)
  Inspired by: Vercel Geist (vercel.com/geist/icons)
  Notes:
    - Filled-glyph icons at 16x16 viewBox, rendered 16px, currentColor inheritance, stroke-linejoin round on root.
    - The 16px native size is an inline literal because icon sizing sits between contract spacing steps.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>geist-mono-icons-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    padding: var(--ds-space-10);
    min-height: 100vh;
  }
  .frame {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    gap: var(--ds-space-6);
  }
  h1 {
    font-size: var(--ds-text-lg);
    letter-spacing: var(--ds-tracking-tight);
    color: var(--ds-text-strong);
    margin: 0 0 var(--ds-space-2);
    font-weight: 600;
  }
  p.lead { color: var(--ds-text-muted); font-size: var(--ds-text-sm); margin: 0; }

  /* Geist icons: 16px native, currentColor */
  .geist-icon { color: currentColor; flex-shrink: 0; }

  .toolbar {
    display: flex;
    gap: var(--ds-space-5);
    align-items: center;
    padding: var(--ds-space-4);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    background: var(--ds-surface);
  }
  .toolbar .geist-icon { color: var(--ds-text); }

  .nav-row {
    display: grid;
    gap: var(--ds-space-3);
  }
  .nav-row .item {
    display: flex;
    align-items: center;
    gap: var(--ds-space-3);
    padding: var(--ds-space-2) var(--ds-space-3);
    border-radius: var(--ds-radius-sm);
    color: var(--ds-text);
    font-size: var(--ds-text-sm);
    cursor: pointer;
  }
  .nav-row .item .geist-icon { color: var(--ds-text-muted); }
  .nav-row .item:hover { background: var(--ds-surface-2); }
  .nav-row .item:hover .geist-icon { color: var(--ds-text); }

  .swatch-set {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: var(--ds-space-3);
    padding: var(--ds-space-4);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    background: var(--ds-surface);
  }
  .swatch-set .cell {
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    color: var(--ds-text);
    border-radius: var(--ds-radius-sm);
  }
  .swatch-set .cell.muted { color: var(--ds-text-muted); }
</style>
</head>
<body>
  <main class="frame">
    <header>
      <h1>Lorem ipsum dolor sit amet</h1>
      <p class="lead">Consectetur adipiscing elit, sed do eiusmod tempor.</p>
    </header>

    <section class="toolbar" aria-label="Toolbar">
      <!-- search (filled lens) -->
      <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-label="Search">
        <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M7 12a5 5 0 1 1 3.16-1.13l3.49 3.48-1.06 1.06-3.48-3.48A5 5 0 0 1 7 12Zm0-1.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
      </svg>
      <!-- plus -->
      <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-label="Add">
        <path fill="currentColor" d="M8.75 1.5h-1.5v5.75H1.5v1.5h5.75v5.75h1.5V8.75h5.75v-1.5H8.75V1.5Z"/>
      </svg>
      <!-- arrow right -->
      <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-label="Next">
        <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M9.53 2.22 8.47 3.28l3.97 3.97H1.5v1.5h10.94l-3.97 3.97 1.06 1.06 5.79-5.78L9.53 2.22Z"/>
      </svg>
      <!-- close -->
      <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-label="Close">
        <path fill="currentColor" d="M3.78 2.72 2.72 3.78 6.94 8l-4.22 4.22 1.06 1.06L8 9.06l4.22 4.22 1.06-1.06L9.06 8l4.22-4.22-1.06-1.06L8 6.94 3.78 2.72Z"/>
      </svg>
      <!-- check -->
      <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-label="Done">
        <path fill="currentColor" d="m13.78 4.22-7.5 7.5-4.06-4.06 1.06-1.06 3 3 6.44-6.44 1.06 1.06Z"/>
      </svg>
      <!-- menu -->
      <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-label="Menu">
        <path fill="currentColor" d="M1.5 3.5h13v1.5h-13V3.5Zm0 4h13V9h-13V7.5Zm0 4h13V13h-13v-1.5Z"/>
      </svg>
    </section>

    <nav class="nav-row" aria-label="Sidebar">
      <div class="item">
        <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-hidden="true">
          <path fill="currentColor" d="M1.5 6 8 1l6.5 5v8a1.5 1.5 0 0 1-1.5 1.5H3a1.5 1.5 0 0 1-1.5-1.5V6Zm6 8.5h1V9h-1v5.5Z"/>
        </svg>
        <span>Lorem ipsum</span>
      </div>
      <div class="item">
        <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-hidden="true">
          <path fill="currentColor" d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-9Zm2 1V11h8V4.5H4Z"/>
        </svg>
        <span>Dolor sit amet</span>
      </div>
      <div class="item">
        <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round" aria-hidden="true">
          <path fill="currentColor" d="M8 1.5a3 3 0 0 0-3 3v.5H3.5A1.5 1.5 0 0 0 2 6.5v7A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 12.5 5H11v-.5a3 3 0 0 0-3-3Zm1.5 3.5v-.5a1.5 1.5 0 1 0-3 0V5h3Z"/>
        </svg>
        <span>Consectetur adipiscing</span>
      </div>
    </nav>

    <div class="swatch-set" aria-label="Glyph set">
      <div class="cell">
        <svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round"><path fill="currentColor" d="M8 1.5 14.5 8 8 14.5 1.5 8 8 1.5Z"/></svg>
      </div>
      <div class="cell"><svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5" fill="currentColor"/></svg></div>
      <div class="cell"><svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2" fill="currentColor"/></svg></div>
      <div class="cell"><svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round"><path fill="currentColor" d="m2 14 6-12 6 12-6-3-6 3Z"/></svg></div>
      <div class="cell muted"><svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round"><path fill="currentColor" d="M8 1.5 14.5 8 8 14.5 1.5 8 8 1.5Z"/></svg></div>
      <div class="cell muted"><svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5" fill="currentColor"/></svg></div>
      <div class="cell muted"><svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2" fill="currentColor"/></svg></div>
      <div class="cell muted"><svg class="geist-icon" data-testid="geist-icon" height="16" width="16" viewBox="0 0 16 16" stroke-linejoin="round"><path fill="currentColor" d="m2 14 6-12 6 12-6-3-6 3Z"/></svg></div>
    </div>
  </main>
</body>
</html>
