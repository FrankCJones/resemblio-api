<!--
  Asset: jetbrains-mono-001
  Class: type-specimens
  Pattern: (none)
  Inspired by: JetBrains Mono (open license)
  Notes: Canonical modern monospace, with code ligatures and italics.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>jetbrains-mono-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-4); }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .display-row { font-family: var(--ds-font-display); font-size: var(--ds-text-4xl); font-weight: 700; line-height: var(--ds-leading-tight); letter-spacing: var(--ds-tracking-tight); margin: 0; }
  .display-row em { font-style: normal; color: var(--ds-accent); }
  .weights { display: flex; gap: var(--ds-space-3); flex-wrap: wrap; font-size: var(--ds-text-xl); align-items: baseline; }
  .w400 { font-weight: 400; } .w500 { font-weight: 500; } .w700 { font-weight: 700; }
  .it400 { font-weight: 400; font-style: italic; }
  .code-sample {
    font-family: var(--ds-font-mono); font-size: var(--ds-text-base);
    line-height: var(--ds-leading-normal); color: var(--ds-text);
    background: var(--ds-surface); padding: var(--ds-space-4);
    border-radius: var(--ds-radius-md); margin: 0;
    font-feature-settings: "calt";   /* Enable code ligatures (==, =>, etc.). */
  }
  .code-sample span { color: var(--ds-accent); }
  .meta { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-text-muted); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <span class="label">type specimen · JetBrains Mono · canonical modern mono</span>
  <h1 class="display-row"><em>./</em>lorem-ipsum</h1>
  <div class="weights">
    <span class="w400">Aa 400</span>
    <span class="w500">Aa 500</span>
    <span class="w700">Aa 700</span>
    <span class="it400"><em>Aa italic</em></span>
  </div>
  <pre class="code-sample">// ligatures enabled
<span>const</span> render = () =&gt; {
  <span>return</span> page !== null;
};</pre>
  <div class="meta">JetBrains Mono · JetBrains · SIL OFL</div>
</body>
</html>
