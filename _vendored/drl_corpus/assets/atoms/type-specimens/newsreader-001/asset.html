<!--
  Asset: newsreader-001
  Class: type-specimens
  Pattern: (none)
  Inspired by: Newsreader by Production Type (open license)
  Notes: Variable optical-size serif. font-optical-sizing: auto enables the axis.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>newsreader-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-4); font-optical-sizing: auto; }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .display-row { font-family: var(--ds-font-display); font-size: var(--ds-text-5xl); font-weight: 600; line-height: var(--ds-leading-tight); letter-spacing: var(--ds-tracking-tight); margin: 0; }
  .display-row em { font-style: italic; color: var(--ds-accent); font-weight: 500; }
  .weights { display: flex; gap: var(--ds-space-3); flex-wrap: wrap; font-size: var(--ds-text-2xl); align-items: baseline; }
  .w400 { font-weight: 400; } .w500 { font-weight: 500; } .w600 { font-weight: 600; }
  .it400 { font-weight: 400; font-style: italic; }
  .body-sample { font-size: var(--ds-text-lg); line-height: var(--ds-leading-relaxed); max-width: 56ch; color: var(--ds-text); margin: 0; }
  .meta { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-text-muted); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <span class="label">type specimen · Newsreader · variable optical-size serif</span>
  <h1 class="display-row">Lorem ipsum <em>dolor sit</em> amet</h1>
  <div class="weights">
    <span class="w400">Aa 400</span>
    <span class="w500">Aa 500</span>
    <span class="w600">Aa 600</span>
    <span class="it400"><em>Aa 400 italic</em></span>
  </div>
  <p class="body-sample">Consectetur adipiscing elit. Vivamus sit amet sapien velit. Curabitur nec libero non nisi convallis fringilla.</p>
  <div class="meta">Newsreader · Production Type · SIL OFL · opsz 6-72</div>
</body>
</html>
