<!--
  Asset: inter-001
  Class: type-specimens
  Pattern: (none - specimens show a single family)
  Inspired by: Inter by Rasmus Andersson (open license, free)
  Notes: Shows Inter across weights, sizes, and italic. Display uses Inter Tight.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>inter-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter+Tight:ital,wght@0,500;0,600;0,700;1,500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ds-bg); color: var(--ds-text); font-family: var(--ds-font-body); padding: var(--ds-space-6); min-height: 100vh; display: flex; flex-direction: column; gap: var(--ds-space-4); }
  .label { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); letter-spacing: var(--ds-tracking-wider); text-transform: uppercase; color: var(--ds-text-muted); }
  .display-row { font-family: var(--ds-font-display); font-size: var(--ds-text-5xl); font-weight: 600; line-height: var(--ds-leading-tight); letter-spacing: var(--ds-tracking-tight); margin: 0; }
  .display-row em { font-style: italic; font-weight: 500; color: var(--ds-accent); }
  .weights { display: flex; gap: var(--ds-space-3); flex-wrap: wrap; font-size: var(--ds-text-2xl); align-items: baseline; }
  .weights span { line-height: 1; }
  .w400 { font-weight: 400; } .w500 { font-weight: 500; } .w600 { font-weight: 600; } .w700 { font-weight: 700; }
  .body-sample { font-size: var(--ds-text-lg); line-height: var(--ds-leading-normal); max-width: 56ch; color: var(--ds-text-muted); margin: 0; }
  .meta { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-text-muted); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <span class="label">type specimen · Inter · humanist sans · open license</span>
  <h1 class="display-row">Lorem ipsum <em>dolor sit</em> amet</h1>
  <div class="weights">
    <span class="w400">Aa 400</span>
    <span class="w500">Aa 500</span>
    <span class="w600">Aa 600</span>
    <span class="w700">Aa 700</span>
  </div>
  <p class="body-sample">Consectetur adipiscing elit. Vivamus sit amet sapien velit. Curabitur nec libero non nisi convallis fringilla.</p>
  <div class="meta">Inter family · Rasmus Andersson · SIL OFL</div>
</body>
</html>
