<!--
  Asset: pudding-about-team-001
  Class: about-team
  Pattern: story-card-grid
  Inspired by: The Pudding (https://pudding.cool/about)
  Notes:
    - About page presents the Team as a headshot-and-bio grid for ten core members. Each member carries a background paragraph on their path into data-visualization journalism. Below the core grid, an expanded collaborators list runs to one hundred plus names. An awards table sits below the team.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>pudding-about-team-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
.at { background: var(--ds-bg); padding: 96px 32px; }
.at__inner { max-width: 1100px; margin: 0 auto; }
.at__head { max-width: 720px; margin-bottom: 48px; }
.at__kicker { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
              text-transform: uppercase; letter-spacing: 0.08em;
              color: var(--ds-text-muted); }
.at__title { font-family: var(--ds-font-display); font-size: var(--ds-text-3xl);
             margin: 16px 0 12px; line-height: 1.15; }
.at__dek { font-family: var(--ds-font-body); font-size: var(--ds-text-lg);
           color: var(--ds-text-muted); margin: 0; }
.at__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.at__member { text-align: center; }
.at__avatar { width: 96px; height: 96px; border-radius: var(--ds-radius-full, 9999px);
              background: var(--ds-surface-2, var(--ds-surface));
              margin: 0 auto 16px; }
.at__member h3 { font-family: var(--ds-font-display); font-size: var(--ds-text-base);
                 margin: 0 0 4px; }
.at__member p { font-family: var(--ds-font-body); font-size: var(--ds-text-sm);
                color: var(--ds-text-muted); margin: 0; }

</style>
</head>
<body>
<section class="at">
  <div class="at__inner">
    <header class="at__head">
      <span class="at__kicker">New</span>
      <h2 class="at__title">Lorem ipsum dolor sit amet</h2>
      <p class="at__dek">Consectetur adipiscing elit, sed do eiusmod tempor incididunt.</p>
    </header>
    <div class="at__grid">
      <article class="at__member"><div class="at__avatar"></div><h3>Lorem</h3><p>Lorem</p></article>
      <article class="at__member"><div class="at__avatar"></div><h3>Lorem</h3><p>Lorem</p></article>
      <article class="at__member"><div class="at__avatar"></div><h3>Lorem</h3><p>Lorem</p></article>
      <article class="at__member"><div class="at__avatar"></div><h3>Lorem</h3><p>Lorem</p></article>
    </div>
  </div>
</section>

</body>
</html>
