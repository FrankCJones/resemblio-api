<!--
  Asset: aesop-hero-001
  Class: heroes
  Pattern: editorial-hero, image-bleed, single-cta-hero
  Inspired by: Aesop (https://web.archive.org/web/20260506004840/https://www.aesop.com/)
  Notes:
    - Header sits transparent over the hero image; body class header-transparent confirmed in Wayback HTML.
    - Headline sets in Zapf Humanist at display size, sentence-case, no exclamation marks.
    - CTA is a hairline-underlined text link, never a saturated pill.
    - Imagery is tonal and quiet: bottles on linen, marble, water, not lifestyle action.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>aesop-hero-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
.h-hero { padding: 96px 32px; background: var(--ds-bg); color: var(--ds-text); }
.h-hero__inner { max-width: 1100px; margin: 0 auto; }
.h-hero__kicker { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
                  text-transform: uppercase; letter-spacing: 0.08em;
                  color: var(--ds-text-muted); }
.h-hero__title { font-family: var(--ds-font-display); font-size: var(--ds-text-5xl);
                 line-height: var(--ds-leading-tight, 1.05); letter-spacing: -0.02em;
                 font-weight: 600; margin: 24px 0 16px; max-width: 18ch; }
.h-hero__dek { font-family: var(--ds-font-body); font-size: var(--ds-text-lg);
               line-height: 1.45; color: var(--ds-text-muted);
               margin: 0 0 32px; max-width: 56ch; }
.h-hero__actions { display: flex; gap: 12px; }
.h-btn { display: inline-flex; align-items: center; padding: 12px 20px;
         font-family: var(--ds-font-body); font-size: var(--ds-text-sm);
         font-weight: 500; border-radius: var(--ds-radius-sm, 6px);
         text-decoration: none; }
.h-btn--primary { background: var(--ds-accent); color: var(--ds-bg); }
.h-btn--ghost { background: transparent; color: var(--ds-text);
                border: 1px solid var(--ds-border); }

</style>
</head>
<body>
<section class="h-hero">
  <div class="h-hero__inner">
    <span class="h-hero__kicker">New</span>
    <h1 class="h-hero__title">Lorem ipsum dolor sit amet</h1>
    <p class="h-hero__dek">Consectetur adipiscing elit, sed do eiusmod tempor incididunt.</p>
    <div class="h-hero__actions">
      <a class="h-btn h-btn--primary" href="#">Get started</a>
      <a class="h-btn h-btn--ghost" href="#">Learn more</a>
    </div>
  </div>
</section>

</body>
</html>
