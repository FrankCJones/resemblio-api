<!--
  Asset: aeon-hero-001
  Class: heroes
  Pattern: editorial-hero, kicker-with-rule
  Inspired by: Aeon (https://aeon.co)
  Notes:
    - Hero is the featured essay card scaled up: discipline kicker (e.g. PHILOSOPHY OF MIND) over an Academica or PP Right Grotesk Wide title.
    - Dek runs one to two sentences in serif body at the larger reading step.
    - No CTA pill or button; the title and dek are themselves the affordance to read.
    - Forest-green accent appears only as the kicker tint or rule.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>aeon-hero-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
.h-hero { padding: 96px 32px; background: var(--ds-bg); color: var(--ds-text); }
.h-hero__inner { max-width: 1100px; margin: 0 auto; }
.h-hero__kicker { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
                  text-transform: uppercase; letter-spacing: 0.08em;
                  color: var(--ds-text-muted); }
.h-hero__title { font-family: var(--ds-font-display); font-size: var(--ds-text-5xl);
                 line-height: var(--ds-leading-tight, 1.05); letter-spacing: -0.02em;
                 font-weight: 600; margin: 24px 0 16px; max-width: 18ch; }
.h-hero__dek { font-family: var(--ds-font-body); font-size: var(--ds-text-lg);
               line-height: 1.45; color: var(--ds-text-muted);
               margin: 0 0 32px; max-width: 56ch; }
.h-hero__actions { display: flex; gap: 12px; }
.h-btn { display: inline-flex; align-items: center; padding: 12px 20px;
         font-family: var(--ds-font-body); font-size: var(--ds-text-sm);
         font-weight: 500; border-radius: var(--ds-radius-sm, 6px);
         text-decoration: none; }
.h-btn--primary { background: var(--ds-accent); color: var(--ds-bg); }
.h-btn--ghost { background: transparent; color: var(--ds-text);
                border: 1px solid var(--ds-border); }

</style>
</head>
<body>
<section class="h-hero">
  <div class="h-hero__inner">
    <span class="h-hero__kicker">LOREM DISCIPLINE</span>
    <h1 class="h-hero__title">Lorem ipsum dolor sit amet consectetur adipiscing elit</h1>
    <p class="h-hero__dek">Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua, ut enim ad minim veniam.</p>
    <div class="h-hero__actions">
      <a class="h-btn h-btn--primary" href="#">Get started</a>
      <a class="h-btn h-btn--ghost" href="#">Learn more</a>
    </div>
  </div>
</section>

</body>
</html>
