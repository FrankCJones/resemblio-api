<!--
  Asset: dev-tool-quote-testimonial-001
  Class: testimonials (whole)
  Pattern: pull-quote-breakout, mono-eyebrow, monochrome-palette, electric-accent
  Inspired by: Supabase (customer-story testimonial blockquote)
  Composition (declared in meta.json > composition_atoms):
    - color-groups/mono-electric-001          (dark palette structure; accent overridden to Supabase green)
    - type-pairings/grotesk-mono-001          (grotesque sans plus mono utility pairing)
    - cards/hairline-flat-001                 (1px ring shadow chrome, no drop shadow at rest)
    - body-text/pull-quote-breakout-001       (oversized quote interrupting the column)
    - avatars/circle-photo-001                (round photo attribution)
    - kickers/mono-eyebrow-001                (uppercase mono pre-quote label)
  Notes:
    - The card composes the six patterns. The accent green plus mono kicker plus
      hairline ring is the load-bearing combination; everything else is rhythm.
    - Variable: every color, every type size, every spacing step. Inline ornament:
      the oversized opening glyph color-mix to lift the green off the dark slate.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>dev-tool-quote-testimonial-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=Source+Code+Pro:wght@400;500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* Page shell. Dark slate base so the green accent earns its punctuation role. */
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--ds-space-10) var(--ds-space-6);
  }

  /* The card. From cards/hairline-flat-001: 1px ring shadow stands in for a
   * border so the corner radius stays crisp; no drop shadow at rest. The
   * dark-mode variant uses --ds-hairline as the ring color. */
  .quote-card {
    width: 100%;
    max-width: 720px;
    background: var(--ds-surface);
    border-radius: var(--ds-radius-md);
    box-shadow: var(--ds-shadow-sm);
    padding: var(--ds-space-8) var(--ds-space-6);
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-5);
  }

  /* Kicker: from atoms/kickers/mono-eyebrow-001. Uppercase mono, tracked,
   * muted color. Reads as a label not a headline. */
  .quote-card__kicker {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
    margin: 0;
  }

  /* Quote body: from atoms/body-text/pull-quote-breakout-001. Oversized,
   * slight negative tracking, snug leading. The green left rule is the
   * Supabase brand accent doing punctuation work; without it the quote
   * would read as just another paragraph. */
  .quote-card__quote {
    font-family: var(--ds-font-display);
    font-size: clamp(var(--ds-text-xl), 3.4vw, var(--ds-text-3xl));
    font-weight: 500;
    line-height: var(--ds-leading-snug);
    letter-spacing: var(--ds-tracking-tight);
    color: var(--ds-text);
    margin: 0;
    padding-left: var(--ds-space-5);
    border-left: 2px solid var(--ds-accent);
    text-wrap: pretty;
  }

  /* Inline ornament: the opening glyph. A lifted-green color-mix so the
   * quote mark sits above the body text in tonal hierarchy without
   * needing a different font. Not a variable because it is a one-off
   * decorative tuning for this asset's character. */
  .quote-card__glyph {
    color: color-mix(in oklab, var(--ds-accent) 70%, white 30%);
    font-family: var(--ds-font-display);
    margin-right: 0.05em;
  }

  /* Divider before attribution; thin, full-width, matches the hairline. */
  .quote-card__rule {
    height: 1px;
    border: 0;
    background: var(--ds-hairline);
    margin: var(--ds-space-2) 0 0 0;
  }

  /* Attribution row: avatar plus stacked name/role. From the composition of
   * avatars/circle-photo-001 and the implicit label stack. */
  .quote-card__attribution {
    display: flex;
    align-items: center;
    gap: var(--ds-space-4);
  }

  /* Avatar: from atoms/avatars/circle-photo-001. Round photo, hairline ring
   * to anchor it against the dark surface. The placeholder gradient stands
   * in for a real headshot in the rendered asset. */
  .quote-card__avatar {
    width: 44px;
    height: 44px;
    border-radius: var(--ds-radius-full);
    background:
      radial-gradient(circle at 30% 30%,
        color-mix(in oklab, var(--ds-accent) 30%, var(--ds-surface-2)),
        var(--ds-surface-2));
    box-shadow: inset 0 0 0 1px var(--ds-hairline);
    flex-shrink: 0;
  }

  .quote-card__person {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* Name: white, body sans, the load-bearing attribution line. */
  .quote-card__name {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
    font-weight: 600;
    color: var(--ds-text-strong);
    line-height: var(--ds-leading-snug);
  }

  /* Role and company on one line; the quieter half of the attribution. */
  .quote-card__role {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    font-weight: 400;
    color: var(--ds-text-muted);
    line-height: var(--ds-leading-snug);
  }

  /* Focus visibility for the card if it becomes a link to the case study. */
  .quote-card:focus-visible {
    outline: 2px solid var(--ds-focus-ring);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .quote-card { transition: none; }
  }
</style>
</head>
<body>
  <figure class="quote-card" aria-label="Customer testimonial">
    <p class="quote-card__kicker">Customer story / lorem ipsum</p>
    <blockquote class="quote-card__quote">
      <span class="quote-card__glyph" aria-hidden="true">&ldquo;</span>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus sit amet sapien velit. Curabitur nec libero non nisi convallis fringilla, a fermentum lacinia magna at suscipit.&rdquo;
    </blockquote>
    <hr class="quote-card__rule" aria-hidden="true"/>
    <figcaption class="quote-card__attribution">
      <span class="quote-card__avatar" role="img" aria-label="Portrait placeholder"></span>
      <span class="quote-card__person">
        <span class="quote-card__name">Lorem Ipsum</span>
        <span class="quote-card__role">Senior Engineer at Dolor Sit Amet</span>
      </span>
    </figcaption>
  </figure>
</body>
</html>
