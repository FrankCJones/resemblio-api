<!--
  Asset: anthropic-testimonials-001
  Class: testimonials (whole)
  Pattern: pull-quote-breakout, paper-and-ink, serif-display-sans-body, mono-utility-pair, centered-narrow-column
  Inspired by: Anthropic (claude.com/customers/cognition case study)
  Composition (declared in meta.json > composition_atoms):
    - color-groups/warm-paper-001            (cream paper bg, ink, clay-crimson accent)
    - type-pairings/serif-mono-editorial-001 (Anthropic Serif display + sans body + mono utility)
    - body-text/pull-quote-breakout-001      (oversized serif breakout quote)
    - kickers/mono-eyebrow-001               (uppercase mono kicker above quote)
    - labels/metadata-mono-001               (mono attribution metadata line)
    - dividers/hairline-rule-001             (warm hairline rule above attribution)
  Notes:
    - Anthropic's customer-quote treatment: a single curly-quoted serif
      breakout on warm cream paper, mono uppercase kicker above, name
      and role-comma-company below a short hairline rule. No card frame,
      no shadow, no quote glyph ornament. Editorial restraint applied
      to product social proof.
    - Variable: every color, type size, family, and the column measure
      are contract-bound tokens. Inline: the hanging-quote padding-left
      and matching negative text-indent are character-dependent tuning
      that does not earn a named slot. The clay-crimson accent is
      reserved for the kicker and focus ring only - the quote itself
      stays in ink, per the Anthropic no-chromatic-accent-on-body rule.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>anthropic-testimonials-001 . Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Source Serif 4 is the closest open-license cousin to Anthropic Serif
     (Tiempos-family contemporary editorial serif). Inter stands in for
     Anthropic Sans (Soehne-family humanist sans). JetBrains Mono carries
     the kicker and attribution metadata role. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* Warm paper page. Generous outer padding so the testimonial reads as
   * an editorial-page object, not a card stuck on a screen. */
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--ds-space-12) var(--ds-space-6);
  }

  /* The testimonial column. Centered narrow measure - Anthropic case
   * study pages set the reading column at roughly 720px and the quote
   * breakout column slightly wider so the display serif gets the room
   * it needs without losing the editorial discipline. */
  .testimonial {
    width: 100%;
    max-width: 760px;
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--ds-space-5);
  }

  /* Kicker: mono uppercase, wide tracking, clay-crimson accent. From
   * kickers/mono-eyebrow-001. The kicker labels the quote as a customer
   * testimonial (vs an editorial pull-quote) - one of the few moments
   * the clay-crimson does any work in this composition. */
  .testimonial__kicker {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-accent);
    margin: 0;
  }

  /* Pull-quote breakout: Anthropic Serif at display weight, generous
   * line height for serif breathing, hanging left curly-quote glyph
   * offset off the column edge. From body-text/pull-quote-breakout-001.
   * Note: ink color, not accent. The Anthropic register reserves clay
   * for kickers, links, and focus - the body of the quote stays in
   * near-black so the typography itself is the gravity. */
  .testimonial__quote {
    font-family: var(--ds-font-display);
    font-size: clamp(var(--ds-text-2xl), 4.4vw, var(--ds-text-3xl));
    line-height: var(--ds-leading-snug);
    letter-spacing: var(--ds-tracking-tight);
    font-weight: 500;
    color: var(--ds-text-strong);
    margin: 0;
    /* Hanging quote: opening curly quote sits in the left margin off the
     * measure. Inline tuning, not a named token - the exact pull is
     * character-dependent (curly vs straight, optical size of the
     * chosen serif). */
    padding-left: var(--ds-space-6);
    text-indent: calc(-1 * var(--ds-space-6));
    text-wrap: balance;
  }

  /* Hairline rule: from dividers/hairline-rule-001. Warm-tan, near-zero
   * weight; sits below the quote, above the attribution row. Short
   * stub width - the rule is a signal, not a separator. */
  .testimonial__rule {
    border: 0;
    border-top: 1px solid var(--ds-hairline);
    width: 48px;
    margin: var(--ds-space-2) 0 0 var(--ds-space-6);
  }

  /* Attribution block. Anthropic case studies attribute below the rule
   * with a two-line stack: name in stronger sans, role-comma-company in
   * a muted register. The company convention here is plain text, not
   * mono - mono is reserved for the kicker. The role and company sit on
   * the same line, separated by a single em-space-free comma, per the
   * observed attribution rows on the cognition case study. */
  .testimonial__attrib {
    padding-left: var(--ds-space-6);
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-1);
  }

  .testimonial__name {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-base);
    font-weight: 600;
    line-height: var(--ds-leading-normal);
    color: var(--ds-text);
    margin: 0;
  }

  .testimonial__role {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    font-weight: 400;
    line-height: var(--ds-leading-normal);
    color: var(--ds-text-muted);
    margin: 0;
  }
</style>
</head>
<body>
  <figure class="testimonial">
    <p class="testimonial__kicker">Customer story . cognition</p>
    <blockquote class="testimonial__quote">
      &ldquo;Lorem ipsum dolor sit amet, consectetur adipiscing elit. Curabitur
      nec libero non nisi convallis fringilla. Aenean fermentum, magna at
      suscipit lacinia, dolor purus venenatis tellus.&rdquo;
    </blockquote>
    <hr class="testimonial__rule" aria-hidden="true"/>
    <figcaption class="testimonial__attrib">
      <p class="testimonial__name">Lorem M. Ipsum</p>
      <p class="testimonial__role">Chief Lorem Officer, Ipsum Labs</p>
    </figcaption>
  </figure>
</body>
</html>
