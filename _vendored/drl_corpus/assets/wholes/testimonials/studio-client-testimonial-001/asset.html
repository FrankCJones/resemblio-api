<!--
  Asset: studio-client-testimonial-001
  Class: testimonials (whole)
  Pattern: pull-quote-breakout, kicker-with-rule
  Inspired by: Pentagram
  Composition (declared in meta.json > composition_atoms):
    - color-groups/swiss-red-rule-001          (palette: cream-paper plus single red)
    - type-pairings/grotesk-mono-001           (Neue Haas Grotesk display plus JetBrains Mono utility)
    - headings/oversized-statement-001         (one-line viewport-spanning display)
    - body-text/pull-quote-breakout-001        (full-width quote treatment)
    - kickers/swiss-rule-kicker-001            (kicker plus structural hairline)
    - labels/metadata-mono-001                 (mono caption for role and company)
    - dividers/hairline-rule-001               (full-ink rule beneath the quote)
  Notes:
    - The quote is the page event. Red appears once - the open-quote glyph -
      and nowhere else. Attribution sits below a full-ink rule because the
      Swiss tradition treats rules as structural beats, not whispers.
    - Variable: every color, every type slot, every spacing step.
    - Inline ornament: the giant left-hung open-quote glyph (font-size and
      negative margin tuned to the display measure), and the exact 1px ink
      rule between quote and attribution.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>studio-client-testimonial-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<!-- Web font: Inter as the closest free stand-in for Neue Haas Grotesk
     (Pentagram's licensed face) plus JetBrains Mono for the attribution
     metadata. The asset still references the licensed family first in
     tokens.css so a downstream library that owns the license picks it up
     automatically. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* The block sits on the cream-paper page, generous outer padding so the
   * quote has room to breathe. No card, no shadow - the rule is the only
   * structural device. */
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--ds-space-12) var(--ds-space-6);
  }

  /* The testimonial container. Left-aligned (editorial register, not
   * marketing-centered), wide-but-bounded measure. The open quote hangs
   * outside the column on desktop. */
  .testimonial {
    max-width: 980px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-8);
    position: relative;
  }

  /* Kicker: composition_atom kickers/swiss-rule-kicker-001. Mono uppercase
   * with a trailing hairline rule that runs to the column edge. */
  .testimonial__kicker {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: var(--ds-space-4);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    font-weight: 500;
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-strong);
  }
  .testimonial__kicker::after {
    content: "";
    height: 1px;
    background: var(--ds-border);
  }

  /* Quote: composition_atom body-text/pull-quote-breakout-001 combined
   * with headings/oversized-statement-001. Display family, weight 500,
   * tight tracking and tight leading; size clamps from 4xl up to 5xl. */
  .testimonial__quote {
    position: relative;
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: clamp(var(--ds-text-2xl), 5.5vw, var(--ds-text-5xl));
    font-weight: 500;
    line-height: var(--ds-leading-tight);
    letter-spacing: var(--ds-tracking-tight);
    text-wrap: balance;
    color: var(--ds-text);
    /* Leave room for the hanging open-quote on desktop. */
    padding-left: 0;
  }

  /* Hanging open-quote glyph. Inline ornament: size and offset are tuned
   * to the display measure rather than a token step. Red is the only
   * chromatic event in the whole block. */
  .testimonial__quote::before {
    content: "\201C";                     /* Left double quotation mark. */
    position: absolute;
    top: -0.18em;                         /* Optical alignment with cap-height of the first line. */
    left: -0.62em;                        /* Hangs outside the column on desktop. */
    font-family: var(--ds-font-display);
    font-size: 1.4em;                     /* Proportional to the quote size. */
    line-height: 1;
    color: var(--ds-accent);              /* The one red moment. */
    font-weight: 500;
  }
  @media (max-width: 720px) {
    /* On narrow viewports the glyph sits inline above the first word
     * rather than hanging outside the column. */
    .testimonial__quote::before {
      position: static;
      display: block;
      margin-bottom: var(--ds-space-2);
      font-size: 2em;
    }
  }

  /* The structural rule. Full-ink, 1px, runs the full column width. The
   * rule is the divider between the quote (the event) and the attribution
   * (the metadata). composition_atom dividers/hairline-rule-001. */
  .testimonial__rule {
    height: 1px;
    background: var(--ds-border);
    border: 0;
    margin: 0;
  }

  /* Attribution row. Two columns on desktop: the attributed name in body
   * weight, then the role / company line in mono caption. composition_atom
   * labels/metadata-mono-001. */
  .testimonial__attribution {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: baseline;
    gap: var(--ds-space-5);
  }
  .testimonial__name {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-lg);
    font-weight: 500;
    color: var(--ds-text-strong);
    letter-spacing: var(--ds-tracking-normal);
  }
  .testimonial__role {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    font-weight: 400;
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  @media (max-width: 720px) {
    .testimonial__attribution {
      grid-template-columns: 1fr;
      gap: var(--ds-space-2);
    }
  }

  /* Focus state: red ring on cream is unambiguous. */
  a:focus-visible {
    outline: 2px solid var(--ds-focus-ring);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <figure class="testimonial">
    <span class="testimonial__kicker" aria-hidden="true">Client &nbsp;/&nbsp; 014</span>

    <blockquote class="testimonial__quote">
      Lorem ipsum dolor sit amet consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
    </blockquote>

    <hr class="testimonial__rule" aria-hidden="true"/>

    <figcaption class="testimonial__attribution">
      <span class="testimonial__name">Lorem A. Ipsum</span>
      <span class="testimonial__role">Chief Brand Officer &nbsp;/&nbsp; Dolor Sit Holdings</span>
    </figcaption>
  </figure>
</body>
</html>
