<!--
  Asset: loom-testimonials-001
  Class: testimonials (whole)
  Pattern: pull-quote-breakout, accent-on-neutral, mono-eyebrow
  Inspired by: Loom (loom.com homepage testimonials block and loom.com/customers "What Customers are Saying")
  Notes:
    - The mechanic is multi-up restraint with a single accent. Light canvas,
      three sentence-case quote cards in a row, each carrying a circular
      avatar plus name plus role and company. A purple-blue kicker sits
      above the section H2; a customer logo strip runs below the grid to
      ground the named quotes in enterprise breadth.
    - Variable: every color, type size, spacing step, radius. Inline
      ornament: the avatar placeholder gradients (Loom ships real
      headshots) and the logo-chip placeholder rectangles (Loom ships
      real wordmark SVGs).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>loom-testimonials-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Inter approximates Loom's humanist sans on the marketing surface across display and body. Single-family system. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* Page shell. Loom's canvas is a near-pure white; the section breathes
   * with generous vertical rhythm. */
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
    padding: var(--ds-space-10) var(--ds-space-6);
    -webkit-font-smoothing: antialiased;
  }

  .section {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-8);
  }

  /* Section header: purple-blue kicker, sentence-case H2. */
  .section__header {
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-3);
    max-width: 720px;
  }

  .section__kicker {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-xs);
    font-weight: 600;
    color: var(--ds-accent);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    margin: 0;
  }

  .section__title {
    font-family: var(--ds-font-display);
    font-size: var(--ds-text-2xl);
    font-weight: 700;
    color: var(--ds-text-strong);
    letter-spacing: var(--ds-tracking-tight);
    line-height: var(--ds-leading-snug);
    margin: 0;
    text-wrap: balance;
  }

  /* Quote grid. Loom presents a three-up at desktop; collapses progressively. */
  .quote-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: var(--ds-space-6);
  }

  /* Card. Hairline edge stands in for the border so the 12px corner stays
   * crisp. No shadow at rest. */
  .quote-card {
    background: var(--ds-surface);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-md);
    padding: var(--ds-space-5);
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-4);
    transition: box-shadow var(--ds-duration-fast) var(--ds-ease-standard),
                transform var(--ds-duration-fast) var(--ds-ease-standard);
  }

  .quote-card:hover {
    box-shadow: var(--ds-shadow-md);
    transform: translateY(-2px);
  }

  .quote-card__quote {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-lg);
    font-weight: 500;
    line-height: var(--ds-leading-normal);
    color: var(--ds-text);
    margin: 0;
    text-wrap: pretty;
  }

  /* Attribution row: circular avatar left, name + role stacked. */
  .quote-card__attribution {
    display: flex;
    align-items: center;
    gap: var(--ds-space-3);
    margin-top: auto;
  }

  /* Avatar. Loom ships real circular headshots of named customers;
   * placeholder uses a soft gradient. */
  .quote-card__avatar {
    width: 48px;
    height: 48px;
    border-radius: var(--ds-radius-full);
    /* Inline ornament: placeholder portrait gradient. */
    background: radial-gradient(circle at 30% 30%, #C4C2F8, #625DF5 80%);
    box-shadow: inset 0 0 0 1px var(--ds-border);
    flex-shrink: 0;
  }

  .quote-card__person {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .quote-card__name {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    font-weight: 600;
    color: var(--ds-text-strong);
    line-height: var(--ds-leading-snug);
  }

  .quote-card__role {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-sm);
    font-weight: 400;
    color: var(--ds-text-muted);
    line-height: var(--ds-leading-snug);
  }

  /* Customer logo strip. Runs flush below the quote grid, on a tonal-step
   * band that lifts it from the canvas by the smallest amount. */
  .logo-strip {
    margin-top: var(--ds-space-4);
    padding: var(--ds-space-6) var(--ds-space-5);
    background: var(--ds-surface-2);
    border-top: 1px solid var(--ds-hairline);
    border-bottom: 1px solid var(--ds-hairline);
    border-radius: var(--ds-radius-md);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: var(--ds-space-8);
  }

  .logo-strip__label {
    width: 100%;
    text-align: center;
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-xs);
    font-weight: 500;
    color: var(--ds-text-muted);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    margin-bottom: var(--ds-space-2);
  }

  /* Logo placeholder. Real implementations swap in monochrome wordmark SVGs. */
  .logo-strip__logo {
    height: 24px;
    min-width: 80px;
    /* Inline ornament: placeholder logo block. */
    background: rgba(11, 11, 20, 0.35);
    border-radius: var(--ds-radius-xs);
    opacity: 0.7;
    transition: opacity var(--ds-duration-fast) var(--ds-ease-standard);
  }

  .logo-strip__logo:hover { opacity: 1; }

  :focus-visible {
    outline: 2px solid var(--ds-focus-ring);
    outline-offset: 3px;
    border-radius: var(--ds-radius-xs);
  }

  @media (prefers-reduced-motion: reduce) {
    .quote-card,
    .logo-strip__logo { transition: none; }
    .quote-card:hover { transform: none; }
  }

  @media (max-width: 520px) {
    .quote-card { padding: var(--ds-space-4); }
    .logo-strip { gap: var(--ds-space-5); }
  }
</style>
</head>
<body>
  <section class="section" aria-label="Customer testimonials">

    <header class="section__header">
      <p class="section__kicker">Lorem ipsum</p>
      <h2 class="section__title">Dolor sit amet, consectetur adipiscing elit sed do eiusmod.</h2>
    </header>

    <div class="quote-grid">

      <figure class="quote-card">
        <blockquote class="quote-card__quote">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus sit amet sapien velit, curabitur nec libero non nisi convallis fringilla.
        </blockquote>
        <figcaption class="quote-card__attribution">
          <span class="quote-card__avatar" role="img" aria-label="Portrait placeholder"></span>
          <span class="quote-card__person">
            <span class="quote-card__name">Aenean Tortor</span>
            <span class="quote-card__role">Design Lead, MetaLab Ipsum</span>
          </span>
        </figcaption>
      </figure>

      <figure class="quote-card">
        <blockquote class="quote-card__quote">
          Curabitur eros nulla, eleifend nec consectetur a, hendrerit ac arcu. Pellentesque habitant morbi tristique senectus.
        </blockquote>
        <figcaption class="quote-card__attribution">
          <span class="quote-card__avatar" role="img" aria-label="Portrait placeholder"></span>
          <span class="quote-card__person">
            <span class="quote-card__name">Vivamus Nullam</span>
            <span class="quote-card__role">Chief People Officer, Dolor Ipsum</span>
          </span>
        </figcaption>
      </figure>

      <figure class="quote-card">
        <blockquote class="quote-card__quote">
          Praesent commodo cursus magna, vel scelerisque nisl consectetur. Aenean lacinia bibendum nulla sed consectetur.
        </blockquote>
        <figcaption class="quote-card__attribution">
          <span class="quote-card__avatar" role="img" aria-label="Portrait placeholder"></span>
          <span class="quote-card__person">
            <span class="quote-card__name">Sed Posuere</span>
            <span class="quote-card__role">Co-CEO, Sit Amet Form</span>
          </span>
        </figcaption>
      </figure>

    </div>

    <div class="logo-strip" aria-label="Customer logos">
      <p class="logo-strip__label">Trusted by lorem ipsum teams</p>
      <span class="logo-strip__logo" role="img" aria-label="Logo placeholder"></span>
      <span class="logo-strip__logo" role="img" aria-label="Logo placeholder"></span>
      <span class="logo-strip__logo" role="img" aria-label="Logo placeholder"></span>
      <span class="logo-strip__logo" role="img" aria-label="Logo placeholder"></span>
      <span class="logo-strip__logo" role="img" aria-label="Logo placeholder"></span>
      <span class="logo-strip__logo" role="img" aria-label="Logo placeholder"></span>
    </div>

  </section>
</body>
</html>
