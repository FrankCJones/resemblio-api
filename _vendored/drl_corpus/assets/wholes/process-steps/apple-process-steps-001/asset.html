<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>apple-process-steps-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
.ps { background: var(--ds-bg); padding: 96px 32px; }
.ps__inner { max-width: 1100px; margin: 0 auto; }
.ps__head { max-width: 720px; margin-bottom: 48px; }
.ps__kicker { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
              text-transform: uppercase; letter-spacing: 0.08em;
              color: var(--ds-text-muted); }
.ps__title { font-family: var(--ds-font-display); font-size: var(--ds-text-3xl);
             margin: 16px 0 0; line-height: 1.15; }
.ps__steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
             padding: 0; list-style: none; }
.ps__steps li { padding-top: 32px; border-top: 2px solid var(--ds-accent); }
.ps__num { font-family: var(--ds-font-mono); font-size: var(--ds-text-sm);
           color: var(--ds-accent); font-weight: 500; }
.ps__steps li h3 { font-family: var(--ds-font-display); font-size: var(--ds-text-xl);
                   margin: 16px 0 8px; }
.ps__steps li p { font-family: var(--ds-font-body); font-size: var(--ds-text-base);
                  line-height: 1.5; color: var(--ds-text-muted); margin: 0; }

</style>
</head>
<body>
<section class="ps">
  <div class="ps__inner">
    <header class="ps__head">
      <span class="ps__kicker">New</span>
      <h2 class="ps__title">Lorem ipsum dolor sit amet</h2>
    </header>
    <ol class="ps__steps">
      <li><span class="ps__num">01</span><h3>Lorem</h3><p>Lorem</p></li>
      <li><span class="ps__num">02</span><h3>Lorem</h3><p>Lorem</p></li>
      <li><span class="ps__num">03</span><h3>Lorem</h3><p>Lorem</p></li>
      <li><span class="ps__num">04</span><h3>Lorem</h3><p>Lorem</p></li>
    </ol>
  </div>
</section>

</body>
</html>
