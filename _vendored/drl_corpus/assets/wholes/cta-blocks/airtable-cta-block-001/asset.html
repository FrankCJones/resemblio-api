<!--
  Asset: airtable-cta-block-001
  Class: cta-blocks (whole)
  Pattern: cta-block; accent-on-neutral + primary-square + ghost-button + display-tight
  Inspired by: Airtable (airtable.com/, /platform, /solutions/marketing, /pricing)
  Composition (declared in meta.json > composition_atoms):
    - color-groups/warm-paper-001          (white surface stand-in; Airtable uses pure white)
    - type-pairings/sans-system-modern-001 (humanist sans, sentence case)
    - headings/display-tight-001           (sans display, tight tracking)
    - body-text/lead-paragraph-001         (supporting subhead measure)
    - buttons/primary-pill-001             (coral primary; subtle 6px radius)
    - buttons/ghost-bordered-001           (hairline ghost secondary)
    - dividers/hairline-rule-001           (optional rule above the block)
  Notes:
    - The block sits flush on the white page surface, centered. No
      card, no tinted band, no shadow. The coral accent on the primary
      button is the only saturated moment; everything else is ink on
      white.
    - Headline is sentence case ("Start building with Airtable",
      "Scale your impact with AI-powered marketing"). The recurring
      dual button is primary "Try it now" / "Get started for free"
      (coral fill, white label) paired with secondary "Book demo"
      (ghost, hairline border).
    - Inline ornament: the 6px button radius (subtle round, not pill),
      the centered alignment, and the generous space-12 vertical
      padding that lets the block breathe against the footer below.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>airtable-cta-block-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Inter stands in for the Airtable marketing sans. Open-license
     substitute; Airtable ships a custom humanist sans on production. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* Page context: white surface. The closing CTA sits flush on the
   * page; no separator above on most Airtable pages, just generous
   * whitespace. */
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    -webkit-font-smoothing: antialiased;
    padding: var(--ds-space-12) var(--ds-space-6);
    display: grid;
    place-items: center;
    min-height: 100vh;
  }

  /* Outer band: full-width container holding a centered content
   * column. Airtable's closing CTAs are centered, unlike many feature
   * sections above them which are left-aligned grids. */
  .cta {
    width: 100%;
    max-width: 1120px;
    padding: var(--ds-space-10) var(--ds-space-5);
  }

  /* Content column: centered, narrow measure for the headline and
   * supporting line, then a centered button row. */
  .cta__content {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: var(--ds-space-5);
  }

  /* Display headline: sentence case, tight tracking, sans display.
   * Airtable's closing headlines are short declarative phrases:
   * "Start building with Airtable", "A plan for every organization's
   * needs". */
  .cta__h2 {
    font-family: var(--ds-font-display);
    font-size: clamp(var(--ds-text-2xl), 4.5vw, var(--ds-text-3xl));
    font-weight: 600;
    line-height: var(--ds-leading-tight);
    letter-spacing: var(--ds-tracking-tight);
    color: var(--ds-text-strong);
    margin: 0;
    max-width: 20ch;
    text-wrap: balance;
    /* Inline ornament: text-wrap balance keeps short headlines from
     * orphaning their final word on narrow widths. */
  }

  /* Supporting line: one short sentence under the headline. Muted
   * ink, relaxed leading, single sentence (never a paragraph). On
   * several Airtable pages this line is omitted entirely. */
  .cta__lead {
    font-family: var(--ds-font-body);
    font-size: var(--ds-text-lg);
    line-height: var(--ds-leading-relaxed);
    color: var(--ds-text-muted);
    margin: 0;
    max-width: 56ch;
    font-weight: 400;
  }

  /* Button row: coral primary + ghost secondary. Centered under the
   * supporting line; wraps on narrow widths. */
  .cta__actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: var(--ds-space-3);
    margin-top: var(--ds-space-2);
  }

  /* Primary: coral fill, white label, 6px radius (subtle round, not
   * a SaaS pill). The single saturated moment in the block. */
  .cta__btn--primary {
    appearance: none;
    background: var(--ds-accent);
    color: #FFFFFF;
    font-family: var(--ds-font-accent);
    font-size: var(--ds-text-base);
    font-weight: 600;
    line-height: 1;
    letter-spacing: var(--ds-tracking-normal);
    border: 1px solid var(--ds-accent);
    border-radius: var(--ds-radius-sm);
    padding: var(--ds-space-3) var(--ds-space-5);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition:
      background-color var(--ds-duration-fast) var(--ds-ease-standard),
      border-color var(--ds-duration-fast) var(--ds-ease-standard);
    /* Inline ornament: 6px radius is the Airtable signature. Sits
     * between dev-tool hard corners and SaaS pill, reads as warm
     * without reading as playful. */
  }
  .cta__btn--primary:hover {
    background: var(--ds-accent-2);
    border-color: var(--ds-accent-2);
  }
  .cta__btn--primary:focus-visible {
    outline: 2px solid var(--ds-focus-ring);
    outline-offset: 3px;
  }

  /* Ghost secondary: no fill, hairline border, ink label. Same
   * dimensions as primary so the pair reads as a deliberate two-
   * action set, not primary plus link. */
  .cta__btn--ghost {
    appearance: none;
    background: transparent;
    color: var(--ds-text-strong);
    font-family: var(--ds-font-accent);
    font-size: var(--ds-text-base);
    font-weight: 600;
    line-height: 1;
    letter-spacing: var(--ds-tracking-normal);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-sm);
    padding: var(--ds-space-3) var(--ds-space-5);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition:
      background-color var(--ds-duration-fast) var(--ds-ease-standard),
      border-color var(--ds-duration-fast) var(--ds-ease-standard);
  }
  .cta__btn--ghost:hover {
    background: rgba(15, 15, 15, 0.04);
    border-color: var(--ds-text-muted);
    /* Inline ornament: 4% black tint on hover; reads as a paper-press,
     * not a UI fill. */
  }
  .cta__btn--ghost:focus-visible {
    outline: 2px solid var(--ds-focus-ring);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .cta__btn--primary, .cta__btn--ghost { transition: none; }
  }
</style>
</head>
<body>
  <section class="cta" aria-labelledby="cta-headline">
    <div class="cta__content">
      <h2 class="cta__h2" id="cta-headline">Lorem ipsum dolor sit amet consectetur.</h2>
      <p class="cta__lead">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus nec libero non nisi convallis fringilla.</p>
      <div class="cta__actions">
        <a class="cta__btn--primary" href="#">Lorem ipsum now</a>
        <a class="cta__btn--ghost" href="#">Book demo</a>
      </div>
    </div>
  </section>
</body>
</html>
