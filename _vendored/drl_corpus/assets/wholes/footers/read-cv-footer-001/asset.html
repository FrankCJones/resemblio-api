<!--
  Asset: read-cv-footer-001
  Class: footers
  Pattern: minimal-footer, footer-link-quiet
  Inspired by: Read.cv (https://web.archive.org/web/20250102161716/https://read.cv/explore)
  Notes:
    - No newsletter signup, no social grid, no language switcher.
    - Footer links observed: /mission, /about, /terms, /privacy, /support, /about/supporters, /sites/about.
    - Hairline top border separates footer from body; otherwise no chrome.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>read-cv-footer-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
.f-footer { background: var(--ds-bg); color: var(--ds-text);
            border-top: 1px solid var(--ds-hairline); padding: 64px 32px 24px; }
.f-footer__inner { max-width: 1200px; margin: 0 auto;
                   display: grid; grid-template-columns: 1fr 2fr; gap: 48px; }
.f-footer__wordmark { font-family: var(--ds-font-display); font-weight: 600;
                      font-size: var(--ds-text-lg); }
.f-footer__tagline { font-family: var(--ds-font-body); font-size: var(--ds-text-sm);
                     color: var(--ds-text-muted); margin: 8px 0 0; max-width: 32ch; }
.f-footer__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.f-footer__col h4 { font-family: var(--ds-font-body); font-size: var(--ds-text-xs);
                    text-transform: uppercase; letter-spacing: 0.06em;
                    color: var(--ds-text-muted); margin: 0 0 12px; font-weight: 500; }
.f-footer__col a { display: block; font-family: var(--ds-font-body);
                   font-size: var(--ds-text-sm); color: var(--ds-text);
                   text-decoration: none; padding: 4px 0; }
.f-footer__legal { max-width: 1200px; margin: 48px auto 0;
                   padding-top: 24px; border-top: 1px solid var(--ds-hairline);
                   font-family: var(--ds-font-body); font-size: var(--ds-text-xs);
                   color: var(--ds-text-muted); }

</style>
</head>
<body>
<footer class="f-footer">
  <div class="f-footer__inner">
    <div class="f-footer__brand">
      <span class="f-footer__wordmark">Wordmark</span>
      <p class="f-footer__tagline">Tagline goes here</p>
    </div>
    <div class="f-footer__cols">
      <div class="f-footer__col">
        <h4>Lorem</h4>
        <a href="#">Lorem</a><a href="#">Lorem</a><a href="#">Lorem</a>
      </div>
      <div class="f-footer__col">
        <h4>Lorem</h4>
        <a href="#">Lorem</a><a href="#">Lorem</a><a href="#">Lorem</a>
      </div>
      <div class="f-footer__col">
        <h4>Lorem</h4>
        <a href="#">Lorem</a><a href="#">Lorem</a><a href="#">Lorem</a>
      </div>
    </div>
  </div>
  <div class="f-footer__legal">
    <span>© 2026 Lorem Ipsum</span>
  </div>
</footer>

</body>
</html>
