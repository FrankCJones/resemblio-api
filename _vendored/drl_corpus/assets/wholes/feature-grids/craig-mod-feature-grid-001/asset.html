<!--
  Asset: craig-mod-feature-grid-001
  Class: feature-grids
  Pattern: writings-index, story-card-grid
  Inspired by: Craig Mod (https://craigmod.com/essays/)
  Notes:
    - The essay index is not a card-image-headline-dek grid; it is a long chronological list of date + title + dek triplets.
    - Date headers sit muted above each entry in sentence-case prose form (e.g. 'April 2026'), not as uppercase mono tags.
    - Titles render as serif links at the subhead step; deks set one step smaller in the same family.
    - A 'Popular Essays' aside surfaces a small curated subset; the long list is otherwise un-decorated.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>craig-mod-feature-grid-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
.fg-grid { background: var(--ds-bg); color: var(--ds-text); padding: 96px 32px; }
.fg-grid__inner { max-width: 1200px; margin: 0 auto; }
.fg-grid__head { max-width: 720px; margin-bottom: 48px; }
.fg-grid__kicker { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs);
                   text-transform: uppercase; letter-spacing: 0.08em;
                   color: var(--ds-text-muted); }
.fg-grid__title { font-family: var(--ds-font-display); font-size: var(--ds-text-3xl);
                  line-height: 1.15; margin: 16px 0 12px; }
.fg-grid__dek { font-family: var(--ds-font-body); font-size: var(--ds-text-lg);
                color: var(--ds-text-muted); margin: 0; }
.fg-grid__tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.fg-tile { padding: 24px; border: 1px solid var(--ds-border);
           border-radius: var(--ds-radius-md, 8px); background: var(--ds-surface); }
.fg-tile h3 { font-family: var(--ds-font-display); font-size: var(--ds-text-xl);
              margin: 0 0 8px; }
.fg-tile p { font-family: var(--ds-font-body); font-size: var(--ds-text-base);
             color: var(--ds-text-muted); line-height: 1.5;
             margin: 0 0 16px; }
.fg-tile a { font-family: var(--ds-font-body); font-size: var(--ds-text-sm);
             font-weight: 500; color: var(--ds-accent); text-decoration: none; }

</style>
</head>
<body>
<section class="fg-grid">
  <div class="fg-grid__inner">
    <header class="fg-grid__head">
      <span class="fg-grid__kicker">New</span>
      <h2 class="fg-grid__title">Lorem ipsum dolor sit amet</h2>
      <p class="fg-grid__dek">Consectetur adipiscing elit, sed do eiusmod tempor incididunt.</p>
    </header>
    <div class="fg-grid__tiles">
      <article class="fg-tile"><h3>Lorem</h3><p>Lorem</p><a href="#">Lorem</a></article>
      <article class="fg-tile"><h3>Lorem</h3><p>Lorem</p><a href="#">Lorem</a></article>
      <article class="fg-tile"><h3>Lorem</h3><p>Lorem</p><a href="#">Lorem</a></article>
      <article class="fg-tile"><h3>Lorem</h3><p>Lorem</p><a href="#">Lorem</a></article>
      <article class="fg-tile"><h3>Lorem</h3><p>Lorem</p><a href="#">Lorem</a></article>
      <article class="fg-tile"><h3>Lorem</h3><p>Lorem</p><a href="#">Lorem</a></article>
    </div>
  </div>
</section>

</body>
</html>
