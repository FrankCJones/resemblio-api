<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>apple-modal-sheet-system-001 - Design Reference Library</title><link rel="stylesheet" href="tokens.css"/><style>.apple-modal{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:56px 24px}.apple-modal__inner{max-width:980px;margin:0 auto}.overlay-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stage{min-height:360px;border-radius:28px;background:linear-gradient(180deg,#fbfbfd,#e8e8ed);position:relative;overflow:hidden;padding:24px}.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,80%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.sheet{position:absolute;left:18px;right:18px;bottom:18px;background:#fff;border-radius:24px 24px 20px 20px;padding:24px;box-shadow:0 16px 40px rgba(0,0,0,.16)}.actions{display:flex;gap:10px;margin-top:18px}.actions a{border-radius:999px;min-height:40px;padding:0 18px;display:inline-flex;align-items:center;text-decoration:none}.confirm{background:#0066cc;color:#fff}.dismiss{background:#f5f5f7;color:#1d1d1f}.apple-modal__note{margin-top:22px;color:#86868b;font-size:12px;line-height:1.45}@media(max-width:760px){.overlay-grid{grid-template-columns:1fr}}</style></head><body><section class="apple-modal"><div class="apple-modal__inner"><h1>Modal and sheet states for decisive moments.</h1><div class="overlay-grid"><div class="stage"><article class="modal"><h2>modal</h2><p>Centered prompt for a focused decision.</p><div class="actions"><a class="dismiss" href="#">dismiss</a><a class="confirm" href="#">confirm</a></div></article></div><div class="stage"><article class="sheet"><h2>sheet</h2><p>Bottom surface for compact options and review.</p><div class="actions"><a class="dismiss" href="#">dismiss</a><a class="confirm" href="#">confirm</a></div></article></div></div><aside class="apple-modal__note" data-resemblio-attribution>Inspired by: Apple (https://www.apple.com). No affiliation with Apple. Independent design reference.</aside></div></section></body></html>
