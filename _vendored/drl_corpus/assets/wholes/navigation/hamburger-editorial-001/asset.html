<!--
  Asset: hamburger-editorial-001
  Class: navigation (whole)
  Pattern: hamburger-only-nav
  Inspired by: A24 Films
  Composition (declared in meta.json > composition_atoms):
    - color-groups/paper-ink-zero-001          (palette context)
    - type-pairings/serif-mono-editorial-001   (serif display, sans body, mono labels)
    - wordmarks/custom-display-001             (distinctive centered wordmark)
    - icons/editorial-line-001                 (line-icon register for the hamburger glyph)
    - links/nav-link-underline-001             (menu row link affordance)
    - dividers/hairline-rule-001               (row separators inside the open sheet)
  Notes:
    - Editorial publication nav: a thin paper header with a centered
      wordmark, a hamburger glyph at the left, a search affordance at the
      right. The desktop nav uses the hamburger pattern at all viewports;
      the open state is a full-viewport sheet with large serif row labels
      arranged as a table of contents.
    - Variable: every color, type size, spacing step lives in tokens.css.
      Inline: the geometry of the hamburger SVG (24x24 path coordinates)
      and the sheet's slide-in keyframe percentages, because both are
      one-off ornamental decisions that do not have contract slots.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>hamburger-editorial-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Newsreader for editorial serif display; Inter for the body/UI text;
     JetBrains Mono for the small uppercase utility labels. The pairing
     matches type-pairings/serif-mono-editorial-001. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* Page shell. Paper background with a faint stage so the header reads
   * as a publication masthead, not a UI bar. */
  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font-body);
    min-height: 100vh;
  }

  /* The thin paper header. Hairline rule at the bottom for editorial
   * registration; layout is a three-column grid so the wordmark stays
   * optically centered regardless of icon widths. */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--ds-bg);
    border-bottom: 1px solid var(--ds-hairline);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: var(--ds-space-3) var(--ds-space-5);
    gap: var(--ds-space-3);
  }

  /* Hamburger trigger. From icons/editorial-line-001 register: stroked
   * line, generous tap target, no fill at rest. */
  .nav-toggle {
    appearance: none;
    background: transparent;
    border: 0;
    padding: var(--ds-space-2);
    margin-left: calc(var(--ds-space-2) * -1);
    color: var(--ds-text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: var(--ds-space-2);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    justify-self: start;
  }
  .nav-toggle__icon {
    width: 24px;
    height: 24px;
    /* Inline ornament: two-line hamburger geometry. Two lines (not three)
     * leans editorial; three lines reads as app UI. The 7px / 17px y
     * positions are tuned by eye for visual weight at this 24x24 box. */
  }
  .nav-toggle__icon line {
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: square;
  }
  .nav-toggle:focus-visible {
    outline: 2px solid var(--ds-focus-ring);
    outline-offset: 2px;
  }

  /* Centered wordmark. From wordmarks/custom-display-001; in this comp it
   * uses the editorial serif rather than a geometric sans because the
   * publication register reads as serif anchored. */
  .wordmark {
    grid-column: 2;
    justify-self: center;
    font-family: var(--ds-font-display);
    font-optical-sizing: auto;
    font-size: var(--ds-text-xl);
    font-weight: 500;
    letter-spacing: var(--ds-tracking-tight);
    color: var(--ds-text);
    text-decoration: none;
  }

  /* Trailing search affordance. Mono utility label so the right side
   * balances the left without competing with the wordmark. */
  .header-search {
    justify-self: end;
    display: inline-flex;
    align-items: center;
    gap: var(--ds-space-2);
    color: var(--ds-text);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    text-decoration: none;
    padding: var(--ds-space-2);
    margin-right: calc(var(--ds-space-2) * -1);
  }
  .header-search__icon { width: 18px; height: 18px; }
  .header-search__icon circle,
  .header-search__icon line { stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: square; }

  /* Open-state sheet. A full-viewport overlay below the header; rows are
   * large serif lines arranged like a table of contents. Demonstrated
   * open by default so the asset shows the pattern's full character. */
  .menu-sheet {
    position: fixed;
    inset: 57px 0 0 0;   /* sits below the header; the header height is the only magic number, but it derives from --ds-space-3 padding plus the 24px icon line-height. */
    background: var(--ds-surface-2);
    overflow-y: auto;
    animation: sheet-in var(--ds-duration-slow) var(--ds-ease-emphasize) both;
  }
  @keyframes sheet-in {
    /* Inline ornament: the slide-in geometry. 12px translateY plus an
     * opacity ramp; not a contract motion primitive because the
     * percentage stops are tuned to this specific sheet height. */
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Menu list. Each row is a hairline-divided link in display serif.
   * Trailing mono label gives editorial subtitle weight without using
   * color. */
  .menu-list {
    list-style: none;
    margin: 0;
    padding: var(--ds-space-8) var(--ds-space-5) var(--ds-space-12);
    max-width: 960px;
    margin-inline: auto;
  }
  .menu-list__item {
    border-bottom: 1px solid var(--ds-hairline);
  }
  .menu-list__item:first-child {
    border-top: 1px solid var(--ds-hairline);
  }

  /* Menu row link. From links/nav-link-underline-001 base; this comp
   * upgrades to a display-serif row that lifts on hover and reveals a
   * mono utility label on the right. */
  .menu-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: var(--ds-space-5);
    padding: var(--ds-space-5) 0;
    text-decoration: none;
    color: var(--ds-text);
    transition:
      color var(--ds-duration-fast) var(--ds-ease-standard),
      padding-left var(--ds-duration-normal) var(--ds-ease-emphasize);
  }
  .menu-row:hover,
  .menu-row:focus-visible {
    color: var(--ds-accent-2);
    padding-left: var(--ds-space-3);
    outline: none;
  }
  .menu-row__title {
    font-family: var(--ds-font-display);
    font-optical-sizing: auto;
    font-size: clamp(var(--ds-text-2xl), 5vw, var(--ds-text-4xl));
    font-weight: 400;
    line-height: var(--ds-leading-tight);
    letter-spacing: var(--ds-tracking-tight);
  }
  .menu-row__meta {
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wider);
    text-transform: uppercase;
    color: var(--ds-text-muted);
  }

  /* Footer rail inside the sheet: small mono utility links arranged as a
   * row of metadata. */
  .menu-foot {
    border-top: 1px solid var(--ds-hairline);
    margin-top: var(--ds-space-8);
    padding-top: var(--ds-space-5);
    display: flex;
    flex-wrap: wrap;
    gap: var(--ds-space-5);
    font-family: var(--ds-font-mono);
    font-size: var(--ds-text-xs);
    letter-spacing: var(--ds-tracking-wide);
    text-transform: uppercase;
    color: var(--ds-text-muted);
  }
  .menu-foot a {
    color: inherit;
    text-decoration: none;
  }
  .menu-foot a:hover { color: var(--ds-text); }

  @media (prefers-reduced-motion: reduce) {
    .menu-sheet { animation: none; }
    .menu-row { transition: none; }
  }
</style>
</head>
<body>
  <!-- The visible header. The hamburger sits flush left, the wordmark is
       optically centered, the search affordance balances the right. -->
  <header class="site-header">
    <button type="button" class="nav-toggle" aria-expanded="true" aria-controls="menu-sheet">
      <svg class="nav-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
        <line x1="3" y1="7"  x2="21" y2="7"/>
        <line x1="3" y1="17" x2="21" y2="17"/>
      </svg>
      <span>Menu</span>
    </button>

    <a href="#" class="wordmark" aria-label="Lorem ipsum publication, home">Lorem Ipsum</a>

    <a href="#" class="header-search">
      <svg class="header-search__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6"/>
        <line x1="20" y1="20" x2="15.5" y2="15.5"/>
      </svg>
      <span>Search</span>
    </a>
  </header>

  <!-- The open sheet. Shown by default so the asset documents the full
       hamburger-only-nav pattern, not just the closed header. -->
  <nav class="menu-sheet" id="menu-sheet" aria-label="Primary">
    <ul class="menu-list">
      <li class="menu-list__item">
        <a href="#" class="menu-row">
          <span class="menu-row__title">Lorem ipsum dolor</span>
          <span class="menu-row__meta">Section 01</span>
        </a>
      </li>
      <li class="menu-list__item">
        <a href="#" class="menu-row">
          <span class="menu-row__title">Sit amet consectetur</span>
          <span class="menu-row__meta">Section 02</span>
        </a>
      </li>
      <li class="menu-list__item">
        <a href="#" class="menu-row">
          <span class="menu-row__title">Adipiscing elit</span>
          <span class="menu-row__meta">Section 03</span>
        </a>
      </li>
      <li class="menu-list__item">
        <a href="#" class="menu-row">
          <span class="menu-row__title">Sed do eiusmod</span>
          <span class="menu-row__meta">Section 04</span>
        </a>
      </li>
      <li class="menu-list__item">
        <a href="#" class="menu-row">
          <span class="menu-row__title">Tempor incididunt</span>
          <span class="menu-row__meta">Section 05</span>
        </a>
      </li>
      <li class="menu-list__item">
        <a href="#" class="menu-row">
          <span class="menu-row__title">Ut labore et dolore</span>
          <span class="menu-row__meta">Section 06</span>
        </a>
      </li>
    </ul>

    <div class="menu-foot">
      <a href="#">Lorem</a>
      <a href="#">Ipsum</a>
      <a href="#">Dolor</a>
      <a href="#">Sit</a>
      <a href="#">Amet</a>
      <a href="#">Consectetur</a>
    </div>
  </nav>
</body>
</html>
