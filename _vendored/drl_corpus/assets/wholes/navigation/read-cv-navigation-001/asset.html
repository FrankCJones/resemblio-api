<!--
  Asset: read-cv-navigation-001
  Class: navigation
  Pattern: flush-top-nav, hairline-as-chrome
  Inspired by: Read.cv (https://web.archive.org/web/20250102161716/https://read.cv/explore)
  Notes:
    - Single-row nav with quiet hairline bottom border.
    - Links observed in 2025-01-02 capture: /explore, /about, /faq, /support, /submit, /gift-shop, /open-roles.
    - Sentence-case labels, no icons, no chromatic accent on hover; underline-on-hover affordance.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>read-cv-navigation-001 · Design Reference Library</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
.n-nav { background: var(--ds-bg); border-bottom: 1px solid var(--ds-hairline); }
.n-nav__inner { max-width: 1200px; margin: 0 auto; padding: 16px 32px;
                display: flex; align-items: center; gap: 32px; }
.n-nav__brand { font-family: var(--ds-font-display); font-weight: 600;
                font-size: var(--ds-text-lg); color: var(--ds-text);
                text-decoration: none; }
.n-nav__links { display: flex; gap: 24px; flex: 1; }
.n-nav__links a { font-family: var(--ds-font-body); font-size: var(--ds-text-sm);
                  font-weight: 500; color: var(--ds-text); text-decoration: none; }
.n-nav__actions { display: flex; align-items: center; gap: 16px; }
.n-nav__signin { font-family: var(--ds-font-body); font-size: var(--ds-text-sm);
                 font-weight: 500; color: var(--ds-text); text-decoration: none; }
.n-btn { display: inline-flex; padding: 8px 14px; border-radius: var(--ds-radius-sm, 6px);
         font-family: var(--ds-font-body); font-size: var(--ds-text-sm);
         font-weight: 500; text-decoration: none; }
.n-btn--primary { background: var(--ds-accent); color: var(--ds-bg); }

</style>
</head>
<body>
<header class="n-nav">
  <div class="n-nav__inner">
    <a class="n-nav__brand" href="#">Wordmark</a>
    <nav class="n-nav__links">
      <a href="#">Lorem</a>
      <a href="#">Lorem</a>
      <a href="#">Lorem</a>
      <a href="#">Lorem</a>
    </nav>
    <div class="n-nav__actions">
      <a class="n-nav__signin" href="#">Sign in</a>
      <a class="n-btn n-btn--primary" href="#">Sign up</a>
    </div>
  </div>
</header>

</body>
</html>
