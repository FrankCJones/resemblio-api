[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resemblio-shadcn"
version = "0.1.0"
description = "Convert a Resemblio DTCG manifest into a shadcn/ui theme (CSS variables + tailwind.config.js)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Resemblio", email = "hello@resemblio.com" }]
keywords = ["resemblio", "shadcn", "dtcg", "design-tokens", "tailwind", "theme"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
resemblio-shadcn = "resemblio_shadcn.cli:main"

[project.urls]
Homepage = "https://resemblio.com"
Source = "https://github.com/optsus/resemblio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
